                         'a beacon\'s buff contribution or a frost tower\'s slow/Shatter amp value. ' +
                         'Compare witnessDpsAvg of (beacon present) vs (no beacon) to derive buff %.',
        witnessDpsAvg:   'witnessDmgDealt / trialDurationSeconds. The buff/debuff-impact metric.',
        witnessDpsPeak:  'Peak 1-second sliding-window DPS of the witness during the trial.'
      },
      analysisHints: [
        'For damage towers (sentry/cannon/tesla): primaryDpsAvg in single + group + each buff state ' +
          'tells you raw efficiency and how much the tower scales with compound buffs.',
        'For BEACONS: compare witnessDpsAvg between buffStack="naked" and "+1 beacon" — the delta ' +
          'is exactly the beacon\'s contribution to a baseline Sentry. Multiply by the player\'s ' +

  const file = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tower-sim-${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function hideSimOverlay() {
  const el = document.getElementById('sim-overlay');
  if (el) el.remove();
}

function updateSimOverlay({ done, total, label, startTime }) {
  const fill   = document.getElementById('sim-bar-fill');
  const text   = document.getElementById('sim-bar-text');
  const dEl    = document.getElementById('sim-done');
  const tEl    = document.getElementById('sim-total');
  const rEl    = document.getElementById('sim-rate');
  const eEl    = document.getElementById('sim-elapsed');
  const etaEl  = document.getElementById('sim-eta');
  const curEl  = document.getElementById('sim-current');
  if (!fill) return;
  const pct    = total > 0 ? (done / total) * 100 : 0;
  fill.style.right = (100 - pct) + '%';
  text.textContent = pct.toFixed(1) + '%';
  dEl.textContent  = done.toLocaleString();
  tEl.textContent  = total.toLocaleString();
  const elapsedSec = (performance.now() - startTime) / 1000;
  eEl.textContent  = formatSimDuration(elapsedSec);
  if (done > 0 && elapsedSec > 0.5) {
    const rate = done / elapsedSec;
    rEl.textContent = rate.toFixed(1);
    const remain = (total - done) / rate;
    etaEl.textContent = formatSimDuration(remain);
  }
  if (label) curEl.textContent = label;
}

function formatSimDuration(sec) {
  if (sec < 1)  return (sec * 1000).toFixed(0) + 'ms';
  if (sec < 60) return sec.toFixed(1) + 's';
  const m = Math.floor(sec / 60);
  const s = Math.round(sec - m * 60);
  return m + 'm ' + s + 's';
}

// Build the JSON blob the export modal lets you copy / download. Has a
// small header with run context so you don't lose track of which session
// the file came from when reviewing later.
function buildBalanceLogBlob() {
  return {
    exportedAt: new Date().toISOString(),
    bestWave:   meta.bestWave || 0,
    runs:       meta.runs || 0,
    shards:     meta.shards || 0,
    entries:    _BAL_LOG.slice()
  };
}
// Modal with two ways to grab the in-memory balance log:
//   - "Copy JSON" puts the whole thing on the clipboard
//   - "Download" saves it as a `.json` file
// Plus a "Clear" so you can start a fresh capture mid-session.
function showLogExport() {
  const data = buildBalanceLogBlob();
  const json = JSON.stringify(data, null, 2);
  const sizeKb = (new Blob([json]).size / 1024).toFixed(1);
  const html = `
    <h2>Balance Log</h2>
    <div class="sub">In-memory snapshot of every tower-config change recorded this session. <span style="color:#9fc0ff;font-weight:700;">${_BAL_LOG.length}</span> entries · ~${sizeKb} KB</div>
    ${_BAL_LOG.length === 0
      ? `<div style="opacity:0.6;text-align:center;padding:24px;">No entries yet — start a run and place / upgrade some towers first.</div>`
      : `<textarea id="log-export-text" readonly style="width:100%;height:200px;font-family:Menlo,Consolas,monospace;font-size:11.5px;background:#0c1018;color:#a7b8d0;border:1px solid #2b3346;border-radius:6px;padding:8px;resize:vertical;margin:10px 0;">${json.replace(/</g,'&lt;')}</textarea>`}
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px;">
      <div style="display:flex;gap:8px;">
        <button class="ctrl primary" id="log-copy"${_BAL_LOG.length === 0 ? ' disabled' : ''}>Copy JSON</button>
        <button class="ctrl primary" id="log-download"${_BAL_LOG.length === 0 ? ' disabled' : ''}>Download .json</button>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="ctrl danger" id="log-clear"${_BAL_LOG.length === 0 ? ' disabled' : ''}>Clear</button>
        <button class="ctrl" id="log-close">Close</button>
      </div>
    </div>
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid #2b3346;">
      <div style="font-size:12.5px;color:#9fc0ff;font-weight:700;letter-spacing:0.05em;margin-bottom:4px;">TOWER SIMULATION</div>
      <div style="font-size:11.5px;color:#7a8094;line-height:1.4;margin-bottom:8px;">
        Headlessly tests every (type × branch × sub × level 1–40 × buffStack × single/group target) combination at max speed. Outputs <code>tower-sim-&lt;ts&gt;.json</code> with single-target DPS, group/AOE DPS, and effective range per config.
        <br/><span style="color:#ff9c5c;">Best run from the title menu — it touches the same state your run would.</span>
      </div>
      <button class="ctrl primary" id="sim-run" style="width:100%;">Run Tower Sim (≈ 6,000–10,000 trials)</button>
      <div id="sim-progress" style="margin-top:6px;font-size:11.5px;color:#9fc0ff;text-align:center;font-family:Menlo,Consolas,monospace;min-height:14px;"></div>
    </div>
    <div id="log-toast" style="margin-top:8px;font-size:12px;color:#7ee69b;text-align:center;min-height:14px;"></div>
  `;
  const modal = showModalHTML(html, '#9fc0ff');
  modal.querySelector('#log-close').onclick = () => hideModal();
  const copyBtn = modal.querySelector('#log-copy');
  const dlBtn   = modal.querySelector('#log-download');
  const clrBtn  = modal.querySelector('#log-clear');
  const toast   = modal.querySelector('#log-toast');
  if (copyBtn) copyBtn.onclick = async () => {
    try {
      await navigator.clipboard.writeText(json);
      toast.textContent = `Copied ${_BAL_LOG.length} entries to clipboard.`;
    } catch (e) {
      // Fallback for older browsers / non-https contexts — focus + select the textarea
      const ta = modal.querySelector('#log-export-text');
      if (ta) { ta.focus(); ta.select(); }
      toast.textContent = 'Clipboard blocked — text is selected, press Ctrl+C.';
    }
  };
  if (dlBtn) dlBtn.onclick = () => {
    const blob = new Blob([json], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tower-balance-${new Date().toISOString().replace(/[:.]/g,'-')}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast.textContent = `Downloaded (${_BAL_LOG.length} entries).`;
  };
  if (clrBtn) clrBtn.onclick = () => {
    if (!confirm('Clear all ' + _BAL_LOG.length + ' captured entries? Cannot be undone.')) return;
    _BAL_LOG.length = 0;
    hideModal();
  };
  // Tower simulation: headless DPS sweep across every tower config × buff state
  // × test scenario. Disables the run button while running, streams progress to
  // the inline counter, downloads the result file when complete.
  const simBtn   = modal.querySelector('#sim-run');
  const simProg  = modal.querySelector('#sim-progress');
  if (simBtn) simBtn.onclick = async () => {
    if (state.phase === 'playing' && !state._simMode) {
      simProg.textContent = 'Cannot run sim while a game is in progress. Quit to title menu first.';
      simProg.style.color = '#ff8c3a';
      return;
    }
    simBtn.disabled = true;
    simBtn.textContent = 'Running…';
    simProg.style.color = '#9fc0ff';
    simProg.textContent = 'Sim running — see overlay.';
    showSimOverlay();
    const t0 = performance.now();
    let results = null;
    try {
      results = await runFullSimSweep(({ done, total, label }) => {
        updateSimOverlay({ done, total, label, startTime: t0 });
      });
      const dt = ((performance.now() - t0) / 1000).toFixed(1);
      // Show "downloading…" briefly so the user sees the success state, then
      // fire the download and tear down the overlay.
      updateSimOverlay({ done: results.length, total: results.length, label: `✓ Done — ${results.length.toLocaleString()} trials in ${dt}s. Downloading…`, startTime: t0 });
      await new Promise(r => setTimeout(r, 600));   // brief pause so user reads the success line
      downloadSimResults(results);
      simProg.textContent = `Sim complete — ${results.length.toLocaleString()} trials in ${dt}s. File downloaded.`;
      simProg.style.color = '#7ee69b';
    } catch (err) {
      console.error('Sim sweep failed:', err);
      simProg.textContent = 'Sim failed: ' + (err && err.message || err);
      simProg.style.color = '#ff5e5e';
      if (state._simMode) exitSimMode();
    } finally {
      hideSimOverlay();
      simBtn.disabled = false;
      simBtn.textContent = 'Run Tower Sim (≈ 6,000–10,000 trials)';
    }
  };
}

document.getElementById('mm-resume').addEventListener('click', onMenuResume);
document.getElementById('mm-shop').addEventListener('click', onMenuShop);
document.getElementById('mm-codex').addEventListener('click', onMenuCodex);
document.getElementById('mm-export-log').addEventListener('click', onMenuExportLog);
document.getElementById('mm-coop').addEventListener('click', () => { if (!NET.role) NET.status = 'off'; showCoop(); });

// Init
function init() {
  resizeCanvas();
  loadMeta();
  refreshMenu();
  // Defensive re-bind in case anything earlier nuked the original listeners.
  // addEventListener with the same handler reference is a no-op on duplicates.
  document.getElementById('mm-start').addEventListener('click', onMenuStart);
  document.getElementById('mm-resume').addEventListener('click', onMenuResume);
  document.getElementById('mm-shop').addEventListener('click', onMenuShop);
  document.getElementById('mm-codex').addEventListener('click', onMenuCodex);
  document.getElementById('mm-export-log').addEventListener('click', onMenuExportLog);
  requestAnimationFrame((t) => { last = t; loop(t); });
  netCheckInviteLink();
}
init();
</script>
