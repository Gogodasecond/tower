// 8b. ELITE ENEMIES — beefy variants with modifiers that drop artifacts
// ----------------------------------------------------------------------------
// Spawn: W8 8%, W20 15%, W40 25% (can roll 2), W60 35% (can roll 2-3). Never
// on boss waves. Each elite = base enemy + one modifier. Drops 3-5x gold and
// an artifact on death (Cursed always drops Legendary).
// ============================================================================

// NOTE: this REPLACES the simple "elite" flag added earlier. New elites go
// through grantEliteModifier() instead of the flat 1.8x HP bonus.
const ELITE_MODIFIERS = {
  armored:     { name: 'Armored',     color: '#8a94a7', icon: '◈', dmgReduction: 0.8, speedMul: 0.7 },
  juggernaut:  { name: 'Juggernaut',  color: '#b84a4a', icon: '█', hpMul: 5,   speedMul: 0.6, slowImmune: true },
  swift:       { name: 'Swift',       color: '#6ce3b4', icon: '»', speedMul: 2.5 },
  regenerator: { name: 'Regenerator', color: '#ff9ccd', icon: '+', regenPct: 0.03 },
  splitter:    { name: 'Splitter',    color: '#ffb86b', icon: '◊', onDeathSplit: 3 },
  aura:        { name: 'Aura',        color: '#c084fc', icon: '◉', auraDmgReduction: 0.5, auraRadius: 90 },
  greedy:      { name: 'Greedy',      color: '#ffc74a', icon: '$', goldMulBonus: 5, stealGold: 30 },
  teleporter:  { name: 'Teleporter',  color: '#9fc0ff', icon: '↷', teleportEvery: 4, teleportTiles: 3 },
  phase:       { name: 'Phase',       color: '#7a95b8', icon: '◍', phaseEvery: 4, phaseDuration: 1 },
  cursed:      { name: 'Cursed',      color: '#ff3366', icon: '✕', towerOfflineOnKill: 5, forceLegendary: true }
};

function rollEliteCount(wave) {
  if (wave % 10 === 0) return 0;      // never on boss waves
  if (wave < 8) return 0;
  let chance, maxCount;
  if      (wave >= 60) { chance = 0.35; maxCount = 3; }
  else if (wave >= 40) { chance = 0.25; maxCount = 2; }
  else if (wave >= 20) { chance = 0.15; maxCount = 1; }
  else                 { chance = 0.08; maxCount = 1; }
  let count = 0;
  for (let i = 0; i < maxCount; i++) if (Math.random() < chance) count++;
  return count;
}

function pickEliteModifier(wave) {
  const keys = Object.keys(ELITE_MODIFIERS);
  // Cursed is rarer — ~1 per 40 waves on average per spec
  const cursedRoll = Math.random();
  if (cursedRoll < 0.025) return 'cursed';
  // Otherwise uniform over non-cursed
  const nonCursed = keys.filter(k => k !== 'cursed');
  return nonCursed[Math.floor(Math.random() * nonCursed.length)];
}

function makeEliteEnemy(type, modifierKey) {
  // Returns a partially-filled enemy shape to be merged onto a regular spawn.
  const mod = ELITE_MODIFIERS[modifierKey];
  return { eliteModifier: modifierKey, eliteDef: mod };
}

function applyEliteToEnemy(enemy) {
  if (!enemy.eliteModifier) return;
  const mod = ELITE_MODIFIERS[enemy.eliteModifier];
  enemy.isElite = true;
  enemy.elite = true; // keep legacy flag for backward compat
  enemy.size = Math.round(enemy.size * 1.25);
  if (mod.hpMul)         { enemy.hp *= mod.hpMul; enemy.maxHp *= mod.hpMul; }
  else                   { enemy.hp *= 2.2; enemy.maxHp *= 2.2; }   // default elite HP bump
  if (mod.speedMul)      { enemy.baseSpeed *= mod.speedMul; enemy.speed *= mod.speedMul; }
  enemy.gold = Math.round(enemy.gold * 4 * (mod.goldMulBonus || 1));
  enemy.dmgReduction = mod.dmgReduction || 0;
  enemy.slowImmuneElite = !!mod.slowImmune;
  enemy.regenPct = mod.regenPct || 0;
  enemy.onDeathSplit = mod.onDeathSplit || 0;
  enemy.auraDmgReduction = mod.auraDmgReduction || 0;
  enemy.auraRadius = mod.auraRadius || 0;
  enemy.stealGold = mod.stealGold || 0;
  enemy.teleportEvery = mod.teleportEvery || 0;
  enemy.teleportTiles = mod.teleportTiles || 0;
  enemy.phaseEvery = mod.phaseEvery || 0;
  enemy.phaseDuration = mod.phaseDuration || 0;
  enemy.towerOfflineOnKill = mod.towerOfflineOnKill || 0;
  enemy.forceLegendary = !!mod.forceLegendary;
  enemy._eliteTimer = 0;
  enemy._phaseCooldown = 0;
  enemy._phasing = false;
}

function rollEncounter() {
  const total = ENCOUNTER_POOL.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * total;
  for (const e of ENCOUNTER_POOL) { r -= e.weight; if (r <= 0) return e; }
  return ENCOUNTER_POOL[0];
}

// ============================================================================
// 9. WAVE GENERATION
// ----------------------------------------------------------------------------
// Waves scale HP * 1.13^(wave-1), gold * 1.10^(wave-1), count gently rises.
// Boss every 10 waves with unique mechanics.
// ============================================================================
// `preview = true` builds the same composition without mutating state — used
// by the Scouts boon to pre-roll the next 3 waves without consuming
// nextWaveExtraEnemies or clobbering eliteIncomingWave. The actual wave's
// side effects are applied by startWave() when the preview is consumed.
function buildWave(n, preview = false) {
  const list = [];
  if (n % 10 === 0) {
    // Boss wave: mini-entourage then boss
    const accomp = Math.min(6 + n / 2, 20);
    for (let i = 0; i < accomp; i++) list.push({ type: pickEnemyTypeForWave(n), delay: 0.6 + i * 0.3 });
    list.push({ type: 'boss', delay: accomp * 0.3 + 3.0, bossWave: n });
    return list;
  }
  // Base count + accelerating density past wave 20; occasional spike wave adds more.
  let count = 8 + n + Math.floor(Math.max(0, n - 20) * 0.6);
  if (Math.random() < 0.15) count += Math.floor(n / 3);
  if (hasMut('overwhelm')) count = Math.floor(count * 1.4);
  // Refugees encounter carryover (only consumed in real-build, peeked in preview)
  if (state.nextWaveExtraEnemies) {
    count += state.nextWaveExtraEnemies;
    if (!preview) state.nextWaveExtraEnemies = 0;
  }
  for (let i = 0; i < count; i++) list.push({ type: pickEnemyTypeForWave(n) });
  // Natural-spawn boss injection — sparse before w20, more frequent after
  // w25. Uses the existing 'boss' enemy (same red `#ff3366` look) but with
  // reduced HP and no special mechanic so it doesn't outclass the full
  // boss-wave boss. See addNaturalBosses().
  addNaturalBosses(list, n);
  // Elite injection — never on boss waves. Curse adds 1 to boss waves if active.
  const eliteCount = rollEliteCount(n) + ((state.curseBossElite && n % 10 === 0) ? 1 : 0);
  for (let i = 0; i < eliteCount; i++) {
    const type = pickEnemyTypeForWave(n);
    const mod = pickEliteModifier(n);
    list.push({ type, eliteModifier: mod });
  }
  if (!preview) state.eliteIncomingWave = eliteCount > 0;
  // Shuffle to mix types
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [list[i], list[j]] = [list[j], list[i]]; }
  // Cumulative spawn delays — tighter intervals at high waves (floor at 0.22s)
  const interval = Math.max(0.22, 0.55 - n * 0.006);
  let t = 0;
  for (const e of list) { t += interval; e.delay = t; }
  return list;
}

// Scouts boon — keep `state.scoutedWaves` filled with previewed compositions
// for the next 3 waves so the player can plan ahead. Builds via the preview
// mode of `buildWave` so no side effects (extras / elite flag) trigger early.
// Cached entries are consumed by `startWave()` and refilled here afterwards.
function ensureScoutedWaves() {
  if (!state.scoutsUnlocked) { state.scoutedWaves = []; return; }
  // Wave numbers we want previews for. If no wave is in progress yet, the
  // "next" wave is wave+1 (inclusive).
  const baseN = state.wave + (state.waveInProgress ? 1 : 1);
  // Drop entries for waves that already started or are stale.
  state.scoutedWaves = state.scoutedWaves.filter(s => s.wave >= baseN);
  for (let w = baseN; w < baseN + 3; w++) {
    if (state.scoutedWaves.find(s => s.wave === w)) continue;
    state.scoutedWaves.push({ wave: w, list: buildWave(w, /*preview*/ true) });
  }
  state.scoutedWaves.sort((a, b) => a.wave - b.wave);
  if (state.scoutedWaves.length > 3) state.scoutedWaves.length = 3;
}

// Compact summary of a previewed wave list — keys are enemy `type`, values are
// counts. Boss / elite / natural-boss flags are surfaced separately for the panel UI.
function summarizeWaveList(list) {
  const counts = {};
  let elites = 0, naturals = 0, hasFullBoss = false;
  for (const e of list) {
    if (e.type === 'boss') {
      if (e.naturalBoss) naturals++;
      else hasFullBoss = true;
      continue;
    }
    if (e.eliteModifier) elites++;
    counts[e.type] = (counts[e.type] || 0) + 1;
  }
  // Keep `moabs` field name for backwards-compat with the panel renderer
  // (the chip is labelled "Boss" below; this is just the natural count).
  return { counts, elites, moabs: naturals, hasBoss: hasFullBoss, total: list.length };
}

// Render the Scouts preview panel — top-left strip showing compositions for
// the next 3 waves. Called whenever the cache updates (wave start/end, boon
// pick, encounter side effects). Hidden when the Scouts boon hasn't been
// picked, so it doesn't take screen real-estate by default.
function renderScoutsPanel() {
  const el = document.getElementById('scouts-panel');
  if (!el) return;
  if (!state.scoutsUnlocked || !state.scoutedWaves.length) {
    el.classList.remove('show');
    el.innerHTML = '';
    return;
  }
  el.classList.add('show');
  // Hidden mode — title bar + eye toggle only, no preview cards.
  const hidden = !!state.scoutsHidden;
  const eyeIcon = hidden ? '◌' : '◉';   // hollow = hidden, filled = shown
  const titleHtml = `<div class="scouts-title">
      <span>◊ Scouts · 3 ahead</span>
      <span class="scouts-eye" id="scouts-eye-toggle" title="${hidden ? 'Show preview' : 'Hide preview'}">${eyeIcon}</span>
    </div>`;
  if (hidden) {
    el.innerHTML = titleHtml;
  } else {
    // Compact "type x N" pieces, top 3 most-numerous types.
    const cardsHtml = state.scoutedWaves.map(s => {
      const sum = summarizeWaveList(s.list);
      const isBoss = sum.hasBoss;
      const isElite = !isBoss && sum.elites > 0;
      const klass = isBoss ? 'sw-card boss' : isElite ? 'sw-card elite' : 'sw-card';
      const tag   = isBoss ? 'BOSS WAVE' : isElite ? 'ELITE' : `${sum.total} ENEMIES`;
      const sorted = Object.entries(sum.counts).sort((a, b) => b[1] - a[1]);
      const pieces = sorted.slice(0, 3).map(([type, n]) => {
        const def = ENEMY_DEFS[type];
        const name = def ? def.name : type;
        return `<span style="color:${def ? def.color : '#a7b8d0'}">${n}× ${name}</span>`;
      });
      const body = pieces.length ? pieces.join(' · ') : (isBoss ? 'Boss + escorts' : '—');
      const flags = [];
      if (sum.moabs > 0)  flags.push(`<span class="sw-flag moab">${sum.moabs}× Boss</span>`);
      if (sum.elites > 0) flags.push(`<span class="sw-flag elite">${sum.elites}× Elite</span>`);
      const flagsHtml = flags.length ? `<div class="sw-flags">${flags.join('')}</div>` : '';
      return `
        <div class="${klass}">
          <div class="sw-head">
            <span class="sw-num">Wave ${s.wave}</span>
            <span class="sw-tag">${tag}</span>
          </div>
          <div class="sw-body">${body}</div>
          ${flagsHtml}
        </div>
      `;
    }).join('');
    el.innerHTML = titleHtml + cardsHtml;
  }
  // Wire the eye toggle. (Re-bound every render since innerHTML rebuilds.)
  const eye = el.querySelector('#scouts-eye-toggle');
  if (eye) {
    eye.onclick = () => {
      state.scoutsHidden = !state.scoutsHidden;
      renderScoutsPanel();
    };
  }
}

// Inject natural-spawn bosses into a regular wave list. Frequency curve:
//   w  1-14 : never (let early waves stay readable)
//   w 15-19 : ~10% chance for 1   (single only — first introduction)
//   w 20-24 : 0/1/2 possible      (FIRST wave multiples can show up)
//   w 25-29 : 1 guaranteed + 40% chance for a 2nd
//   w 30-44 : 1 guaranteed + 60% for a 2nd + 20% for a 3rd
//   w 45+   : 2 guaranteed + 60% for a 3rd + 20% for a 4th
// Same "boss" entity that appears on every-10th boss waves, but spawned with
// `naturalBoss: true` so spawnEnemy uses reduced HP, smaller size, and skips
// the special mechanic. Lets the player see the bright-red boss visual
// regularly in mid-game without breaking pacing.
function addNaturalBosses(list, n) {
  let count = 0;
  if (n < 15) {
    count = 0;
  } else if (n < 20) {
    if (Math.random() < 0.10) count++;
  } else if (n < 25) {
    // Round 20 is the inflection where multiples become possible.
    // Distribution lands at ~38% / 50% / 12% for 0 / 1 / 2.
    if (Math.random() < 0.50) count++;
    if (Math.random() < 0.25) count++;
  } else if (n < 30) {
    count = 1;
    if (Math.random() < 0.40) count++;
  } else if (n < 45) {
    count = 1;
    if (Math.random() < 0.60) count++;
    if (Math.random() < 0.20) count++;
  } else {
    count = 2;
    if (Math.random() < 0.60) count++;
    if (Math.random() < 0.20) count++;
  }
  for (let i = 0; i < count; i++) list.push({ type: 'boss', naturalBoss: true });
}

function pickEnemyTypeForWave(n) {
  // Progressive intro of enemy types. New enemies at 15/20/25/30/40+ maintain late-game pressure.
  const pool = [];
  pool.push('runner');
  if (n >= 2)  pool.push('runner', 'runner');
  if (n >= 3)  pool.push('swarm');
  if (n >= 4)  pool.push('tank');
  if (n >= 6)  pool.push('shielded');
  if (n >= 7)  pool.push('swarm', 'runner');
  if (n >= 8)  pool.push('healer');
  if (n >= 9)  pool.push('brute');                            // strong path enemy intro (filled the flying slot)
  if (n >= 12) pool.push('tank', 'shielded', 'brute');
  if (n >= 15) pool.push('healer', 'tank', 'sprinter', 'brute');
  if (n >= 20) pool.push('wraith', 'sprinter', 'shielded');   // wraith (slow-resistant)
  if (n >= 25) pool.push('juggernaut', 'wraith');             // juggernaut intro
  if (n >= 30) pool.push('juggernaut', 'wraith', 'sprinter'); // late-wave mix
  if (n >= 40) pool.push('juggernaut', 'juggernaut', 'healer');
  if (n >= 50) pool.push('wraith', 'juggernaut');
  return pool[Math.floor(Math.random() * pool.length)];
}

// ============================================================================
// 10. TOWER BEHAVIOR
// ============================================================================
// Beacon rule: for EVERY stat (damage, fire rate, crit, range) the tower
// takes the SINGLE BEST contribution from any in-range beacon. A beacon
// pumping +100% damage overrides another giving +50%. Nothing stacks —
// each stat picks its strongest source.

// Returns every beacon whose range covers this tower (no count cap).
function getInRangeBeaconsFor(tower) {
  if (!tower || tower.type === 'beacon') return [];
  const result = [];
  for (const b of state.towers) {
    if (b.type !== 'beacon') continue;
    // IMPORTANT: use the beacon's full effective range — tile features
    // (high ground, power shrine), the Eagle Eye boon, the Conductor sub-branch
    // adding range to nearby towers (no — that's on buffed towers),
    // perTypeRangeBonus, and artifact rangeFlat all expand coverage. Using the
    // raw base range made the visible aura ring drift wider than the buff zone,
    // so towers inside the ring sometimes silently received no buff.
    // computeTowerStats(beacon) is safe — beacons skip the in-range lookup.
    const bRange = computeTowerStats(b).range;
    const dx = tower.x - b.x, dy = tower.y - b.y;
    if (dx*dx + dy*dy <= bRange * bRange) result.push(b);
  }
  return result;
}

// Best-case single-target DPS: damage one specific enemy would receive per
// second if it were the only thing the tower could target. Folds in crit
// expectation but ignores splash/multi-hit/AOE/aura multipliers — those
// only matter when more than one enemy is in range. Useful for sizing up a
// tower's "boss-killer" potential at a glance.
function computeSingleTargetDps(tower) {
  if (!tower || tower.type === 'beacon' || tower.type === 'frost') return 0;
  const stats = computeTowerStats(tower);
  if (!stats.fireRate || !stats.damage) return 0;
  const critEV = 1 + (stats.critChance || 0) * ((stats.critMul || 3) - 1);
  let dps = stats.damage * stats.fireRate * critEV;
  // Tesla's chain attenuation gives a small boost vs bouncing off the same
  // target — but a single target only takes the FIRST hit, so chains don't
  // contribute here. Same for splash/cone/aoe.
  // Burn DoT (flamethrower) DOES apply to a single target via refresh.
  if (stats.isDoT) dps += stats.damage * 1.1;
  return dps;
}

// Sums damage events from the last 1.0s to give the actual measured DPS.
// Side-effect:
//   - prunes expired entries (>1s old)
//   - bumps stats.peakDps  = best total 1s DPS across all targets
//   - bumps stats.peakSingleTargetDps = best 1s DPS to ONE specific enemy
//     (calculated by grouping the window by enemy id and taking the max).
// Window entries are [time, dmg, enemyId]. Call every frame from tick().
function getRecentDps(tower) {
  if (NET.role === 'guest') return (tower && tower._netDps) || 0;   // the host measures; the guest reads
  if (!tower || !tower.stats) return 0;
  if (!tower.stats.dpsWindow) tower.stats.dpsWindow = [];
  const w = tower.stats.dpsWindow;
  const cutoff = state.time - 1;
  // Drop expired (oldest first — entries are pushed in time order)
  let trim = 0;
  while (trim < w.length && w[trim][0] < cutoff) trim++;
  if (trim) w.splice(0, trim);
  // Total 1s DPS across all targets
  let sum = 0;
  // Per-enemy 1s totals — group by enemy id and find the max bucket.
  const perEnemy = {};
  let bestSingle = 0;
  for (let i = 0; i < w.length; i++) {
    const e = w[i];
    sum += e[1];
    const id = e[2];
    if (id !== undefined) {
      perEnemy[id] = (perEnemy[id] || 0) + e[1];
      if (perEnemy[id] > bestSingle) bestSingle = perEnemy[id];
    }
  }
  if (sum > (tower.stats.peakDps || 0)) tower.stats.peakDps = sum;
  if (bestSingle > (tower.stats.peakSingleTargetDps || 0)) tower.stats.peakSingleTargetDps = bestSingle;
  return sum;
}

// =====================================================================
// AUTO BALANCE LOG — fires whenever a tower's "effective stats"
// change due to upgrades, branch picks, masteries, beacon coverage,
// active mutators, artifacts, global boons, tile features, etc.
//
// Each fire writes a structured payload to the console grouped by
// `[BAL]` so you can grep balance progression across a run. The
// signature compares STRUCTURAL inputs only — transient buffs like
// Bloodbath / Pyrrhic / lastStand are still INCLUDED in the payload
// but don't trigger a log on their own (they would spam every wave).
// =====================================================================
function towerLogSignature(tower) {
  // Composite key of every stable input that affects effective stats.
  const inRange = getInRangeBeaconsFor(tower);
  const beacons = inRange
    .map(b => `${b.level}${b.branch || '-'}${b.subbranch || '-'}`)
    .sort()
    .join('|');
  const feat = (state.features || []).find(f => f.gx === tower.gx && f.gy === tower.gy);
  const haz  = (state.hazards  || []).find(h => !h.onPath && h.gx === tower.gx && h.gy === tower.gy);
  const arts = (state.artifacts || []).map(a => a.id).sort().join(',');
  const muts = state.activeMutators.slice().sort().join(',');
  return [
    tower.level,
    tower.branch || '-',
    tower.subbranch || '-',
    (tower.masteries || []).length,
    beacons,
    muts,
    arts,
    Math.round((state.globalDmgBonus      || 0) * 1000),
    Math.round((state.globalRangeBonus    || 0) * 1000),
    Math.round((state.globalFireRateBonus || 0) * 1000),
    feat ? feat.type : '-',
    haz  ? haz.type  : '-',
    state.specialistType || '-',
    state.perTypeRangeBonus ? (state.perTypeRangeBonus[tower.type] || 0) : 0
  ].join('||');
}

// Builds the full structured snapshot logged on each signature change.
// All multipliers and contributions are listed individually so you can
// reconstruct effective stats by hand for balance reviews.
function buildTowerLogPayload(tower) {
  const def    = TOWER_DEFS[tower.type];
  const stats  = computeTowerStats(tower);
  const beacon = computeBeaconContribution(tower);
  // Theoretical DPS removed from the panel/log — measured peak/last-1s are
  // the source of truth now. Kept the helper around in case future tooling
  // wants a config-ceiling, but no callers use it on the hot path.
  const dpsTheo = 0;
  const dpsNow  = getRecentDps(tower);
  const dpsPeak = (tower.stats && tower.stats.peakDps) || 0;
  const inv     = (tower.stats && tower.stats.totalCost) || 0;
  const feat = (state.features || []).find(f => f.gx === tower.gx && f.gy === tower.gy) || null;
  const haz  = (state.hazards  || []).find(h => !h.onPath && h.gx === tower.gx && h.gy === tower.gy) || null;
  // Enumerate active modifiers grouped by source — enables filtering during balance work.
  const buffs = {
    global: {
      damage:   state.globalDmgBonus      || 0,
      range:    state.globalRangeBonus    || 0,
      fireRate: state.globalFireRateBonus || 0,
      waveFireRate: (state.waveInProgress && state.nextWaveFireRateBuff) ? state.nextWaveFireRateBuff : 0
    },
    beacon: {
      count:    beacon.count,
      damage:   beacon.dmg,
      fireRate: beacon.fireRate,
      crit:     beacon.crit,
      range:    beacon.range
    },
    mutators: state.activeMutators.slice(),
    artifacts: (state.artifacts || []).map(a => a.id),
    artifactCache: state.artifactCache ? { ...state.artifactCache } : {},
    tile: feat ? { feature: feat.type, dmg: feat.dmg || 0, range: feat.range || 0, fireRate: feat.fireRate || 0 } :
          haz  ? { hazard: haz.type, dmgMul: haz.dmgMul, rangeMul: haz.rangeMul, fireRateMul: haz.fireRateMul } : null,
    perTypeRange: (state.perTypeRangeBonus && state.perTypeRangeBonus[tower.type]) || 0,
    specialistDiscount: state.specialistType === tower.type,
    pyrrhicStacks: state.pyrrhicStacks || 0,
    lastStandTriggered: !!(hasMut('lastStand') && state.lives <= 5),
    bloodbathActive: !!(tower._bloodbathUntil && tower._bloodbathUntil > state.time),
    lightningRodWave: !!tower._lrodWave,
    constellationLine: hasMut('constellation') ? countTowerLine(tower) : 0,
    synergyAdjacent: hasMut('synergy') ? hasAdjacentDifferentTower(tower) : false
  };
  const evoNum   = getEvolution(tower.level);
  const evoTier  = getEvoTier(evoNum);
  return {
    type:    tower.type,
    level:   tower.level,
    branch:  tower.branch || null,
    sub:     tower.subbranch || null,
    masteries: (tower.masteries || []).map((m, i) => ({ idx: i, ...m })),
    evolution: evoNum,
    evoLabel:  evoTier ? evoTier.label : 'Base',
    base:    { ...def.base },
    effective: {
      damage:   stats.damage,
      fireRate: stats.fireRate,
      range:    stats.range,
      splash:   stats.splash || 0,
      chains:   stats.chains || 0,
      crit:     stats.critChance || 0,
      critMul:  stats.critMul || 0,
      slowAmt:  stats.slowAmt || 0,
      slowDur:  stats.slowDur || 0,
      pierce:   stats.pierce || 0,
      cluster:  stats.cluster || 0,
      isDoT:    !!stats.isDoT,
      aoe:      !!stats.aoe,
      avalanche:!!stats.avalanche,
      phoenix:  !!stats.phoenix,
      piercing: !!stats.piercing,
      burnSpread: stats.burnSpread || 0,
      burnMul:    stats.burnMul    || 0
    },
    buffs,
    dps:     {
      last1s: Math.round(dpsNow),
      peak1s: Math.round(dpsPeak),
      // Single-target peak — already tracked on tower.stats, just exported now.
      // Critical for separating multi-hit AOE/pierce/chain from raw single-target.
      peakSingleTarget: Math.round((tower.stats && tower.stats.peakSingleTargetDps) || 0)
    },
    economy: {
      invested: inv,
      peakDpsPer100Cost: inv > 0 ? +(dpsPeak / inv * 100).toFixed(2) : 0,
      kills: tower.stats ? tower.stats.kills : 0,
      damageDealt: tower.stats ? Math.round(tower.stats.damageDealt) : 0,
      // Shatter assist damage — bonus dealt by other towers because this Shatter amped chilled enemies.
      assistDamage: tower.stats ? Math.round(tower.stats.assistDamage || 0) : 0,
      // Beacon buff contribution — INSTANTANEOUS per-second DPS this beacon is
      // currently adding to nearby towers (NOT a running lifetime total).
      buffContributionPerSec: Math.round(tower._buffContributionPerSec || 0),
      // Idle frame ratio — % of frames this tower had no recent target.
      // High value (>0.4) = tower is overranged or poorly placed for the path.
      idleTimeRatio: tower._totalFrames > 0 ? +(tower._idleFrames / tower._totalFrames).toFixed(3) : 0,
      // Overkill ratio — % of dealt damage that was past the enemy HP threshold.
      // High value = tower is oversized for the wave's enemies.
      overkillRatio: (tower.stats && tower.stats.damageDealt > 0)
        ? +((tower.stats.overkillDamage || 0) / tower.stats.damageDealt).toFixed(3) : 0,
      // Damage by enemy type — { runner: N, tank: N, swarm: N, ... }
      // Reveals where each tower actually does its work.
      damageByEnemyType: (tower.stats && tower.stats.dmgByType) ? { ...tower.stats.dmgByType } : {}
    },
    waveAtLog: state.wave
  };
}

// Per-frame check: when a tower's structural signature changes, write a log.
// Throttled by signature comparison (no time throttle needed — only fires on
// real config changes). First tick after build always logs as a baseline.
// Throttled to ~2Hz (every 500ms). The signature scan touches every tower
// AND every beacon's range via getInRangeBeaconsFor, so it was a heavy
// per-frame cost at high tower counts. 2Hz still catches every meaningful
// change (level / branch / mastery happen on click, slower than 2Hz).
let _autoLogLast = -Infinity;
// In-memory ring of every balance log entry from this page-session. The
// menu's "Export Balance Log" button serializes this to a JSON file the
// user can download for offline review. Capped to 5000 entries so a long
// session doesn't grow unbounded — old entries drop off the front when full.
const _BAL_LOG = [];
const _BAL_LOG_MAX = 5000;
function autoLogTowerChanges() {
  if (state.phase !== 'playing') return;
  if (state._simMode) return;   // Sim-mode towers should never pollute the live balance log
  if (state.time - _autoLogLast < 0.5) return;
  _autoLogLast = state.time;
  for (let i = 0; i < state.towers.length; i++) {
    const t = state.towers[i];
    const sig = towerLogSignature(t);
    if (t._logSig === sig) continue;
    const reason = t._logSig === undefined ? 'initial' : 'change';
    t._logSig = sig;
    const payload = buildTowerLogPayload(t);
    console.log(`[BAL] tower#${i} ${t.type} L${t.level} (${reason}, wave ${state.wave})`, payload);
    // Keep a session-wide buffer for the menu's Export Balance Log button.
    _BAL_LOG.push({
      ts:     Date.now(),
      gameTime: +state.time.toFixed(2),
      wave:   state.wave,
      towerIdx: i,
      reason,
      payload
    });
    if (_BAL_LOG.length > _BAL_LOG_MAX) _BAL_LOG.shift();
  }
}

// Theoretical DPS estimate. Folds in sub-branch abilities, mutators, artifacts,
// and "always on" enemy debuffs (chilled bonuses if a frost tower exists, etc.)
// so the displayed number reflects the configured build, not just base × rate.
// This is a CEILING — actual DPS depends on how many enemies are in range.
// Live measured DPS (getRecentDps) is the ground truth; this is a forecast.
function computeDPS(tower) {
  if (!tower || tower.type === 'beacon') return 0;
  const stats = computeTowerStats(tower);
  let dps = 0;

  // ---- Base projectile DPS path (only if the tower deals damage) ----
  if (stats.fireRate && stats.damage) {
    const critEV  = 1 + (stats.critChance || 0) * ((stats.critMul || 3) - 1);
    let baseDps = stats.damage * stats.fireRate * critEV;

    // Tesla chain bounce — sum of attenuated chain hits (88% per hop)
    if (tower.type === 'tesla' && stats.chains > 1) {
      let mult = 0, atten = 1;
      for (let i = 0; i < stats.chains; i++) { mult += atten; atten *= 0.88; }
      baseDps *= mult;
    }
    // Sentry Piercer — shot pierces N extra targets (×(N+1) effective DPS)
    if (stats.pierce > 0) baseDps *= (1 + stats.pierce);
    // Tesla Railgun line-pierce — approximate 2 extra hits along the line
    if (stats.piercing) baseDps *= 2;

    dps += baseDps;

    // Cannon Cluster — N additional mini-bombs each at 50% damage on hit
    if (stats.cluster > 0) {
      dps += stats.fireRate * stats.damage * 0.5 * stats.cluster * critEV;
    }
    // Cannon Flamethrower — burn DoT + cone hits multiple enemies
    if (stats.isDoT) {
      // Per-tick burn = dmg×0.55 (initial) × 0.5 (tick mul) × 4 ticks/s = dmg×1.1.
      // Inferno (burnMul=2) extends duration, but shots refresh continuously so
      // steady-state effect is negligible — leave the 1.1 base intact.
      dps += stats.damage * 1.1;
      // Cone hits ~2 enemies on average; Inferno burn-spread adds 2 more at 0.7×
      let coneMul = 2;
      if (stats.burnSpread) coneMul += stats.burnSpread * 0.7;
      dps *= coneMul;
    }
    // Cannon non-DoT splash — multi-target ~1.5× effective DPS
    else if (tower.type === 'cannon' && stats.splash > 0) {
      dps *= 1.5;
    }
    // Frost Blizzard AOE — multi-target ~1.5× effective DPS (when Ice Heart adds dmg)
    if (stats.aoe) dps *= 1.5;
    // Cannon Phoenix — kills cause chained fiery explosions; ~25% effective bonus
    // assuming several enemies present in late-game waves.
    if (stats.phoenix) dps *= 1.25;
    // Tesla Overload — every 4th volley stuns; treated as utility, not damage.
    // (No DPS multiplier — it's purely tactical control.)
  }

  // ---- Independent damage sources (don't require base damage) ----
  // Frost Avalanche — drops a 180-base ice chunk every 3s, scaled by wave
  if (stats.avalanche) {
    dps += (180 * Math.pow(1.08, Math.max(0, state.wave))) / 3;
  }

  // ---- Enemy-state damage bonuses ("always on" if condition is realistic) ----
  // These mirror damageEnemy() — folded in here so the theoretical number
  // reflects what actually lands on a typical chilled / marked target.
  if (dps > 0) {
    // A frost tower (or chill aoe) is on the field → assume targets are chilled.
    const hasFrost = state.towers.some(t => t.type === 'frost');
    if (hasFrost) {
      let chilledBonus = 0;
      if (hasMut('frostbite')) chilledBonus += 0.30;
      if (state.artifactCache && state.artifactCache.chilledDmgBonus) {
        chilledBonus += state.artifactCache.chilledDmgBonus;
      }
      // Shatter (Frost B2) stacks across all such towers — global +60% per
      let shatterStacks = 0;
      for (const t of state.towers) if (t.type === 'frost' && t.subbranch === 'B2') shatterStacks++;
      chilledBonus += 0.60 * shatterStacks;
      dps *= (1 + chilledBonus);
    }
    // Frozen Gears — deeply slowed targets take more damage. Frost B (Cryo) gets
    // slowAmt past 0.5 trivially; otherwise apply if any cryo-line tower exists.
    if (state.artifactCache && state.artifactCache.deepSlowDmgMul > 1) {
      const hasDeepSlow = state.towers.some(t => t.type === 'frost' && t.branch === 'B');
      if (hasDeepSlow) dps *= state.artifactCache.deepSlowDmgMul;
    }
  }

  return dps;
}

// For each stat (damage, fire rate, crit, range), the tower takes the BEST
// contribution from any in-range beacon. Sub-branch abilities are folded
// into the same beacon's stat so e.g. an A2 Champion's beacon contributes a
// higher damage number than a plain beacon, and only the highest wins.
// What one beacon hands to every tower in its range. Single source of truth:
// the buff applied in computeTowerStats, the beacon's own card and the
// "DPS added" estimate all read this, so they can't drift apart.
function beaconBuffs(b) {
  const def2 = TOWER_DEFS.beacon;
  let dmg = def2.base.buffDmg + def2.perLvl.buffDmg * (b.level - 1);
  let fireRate = def2.base.buffFireRate + def2.perLvl.buffFireRate * (b.level - 1);
  if (b.branch === 'A') dmg *= 2;
  if (b.branch === 'B') fireRate *= 2;
  let crit = 0, range = 0, rangePct = 0;
  const sb = b.branch && b.subbranch && def2.branches[b.branch] && def2.branches[b.branch].subs[b.subbranch];
  if (sb) {
    if (sb.beaconCritBonus)     crit      = sb.beaconCritBonus;
    if (sb.beaconExtraDmg)      dmg      += sb.beaconExtraDmg;
    if (sb.beaconExtraFireRate) fireRate += sb.beaconExtraFireRate;
    if (sb.beaconRangeBonus)    range     = sb.beaconRangeBonus;
    if (sb.beaconExtraRange)    rangePct  = sb.beaconExtraRange;
  }
  return { dmg, fireRate, crit, range, rangePct };
}
// Best value of each stat across the beacons covering a tower (no stacking).
// `skip` leaves one beacon out — used to measure that beacon's marginal value.
function bestBeaconBuffs(tower, skip) {
  const best = { dmg: 0, fireRate: 0, crit: 0, range: 0, rangePct: 0, count: 0 };
  for (const b of getInRangeBeaconsFor(tower)) {
    if (b === skip) continue;
    const v = beaconBuffs(b); best.count++;
    for (const k of ['dmg', 'fireRate', 'crit', 'range', 'rangePct']) if (v[k] > best[k]) best[k] = v[k];
  }
  return best;
}
function computeBeaconContribution(tower) {
  if (!tower || tower.type === 'beacon') return { dmg: 0, fireRate: 0, crit: 0, range: 0, count: 0 };
  return bestBeaconBuffs(tower);
}

// Per-tick cache for computeTowerStats. The same tower's stats are read many
// times per frame (firing path, render, beacon range checks, autoLog, panel
// refresh, etc.) and the function is non-trivial — looping through branches,
// sub-branches, masteries, beacons, mutators, artifacts, tile features, and
// when it inspects beacon-range coverage it recursively calls itself for
// every nearby beacon. With ~30 towers × ~5 beacons that's 150 nested calls
// per signature check alone. Cache invalidates each tick via _statsCacheFrame.
let _statsCacheFrame = 0;

function computeTowerStats(tower) {
  // Per-tick cache — stale entries from previous frames are ignored.
  if (tower._statsCacheFrame === _statsCacheFrame && tower._statsCache) {
    return tower._statsCache;
  }
  // Returns current stats with upgrades + branches + masteries + mutators applied.
  const def = TOWER_DEFS[tower.type];
  const s = { ...def.base };
  // Linear per-level
  const lvl = tower.level;
  for (const k of Object.keys(def.perLvl)) s[k] = s[k] + def.perLvl[k] * (lvl - 1);
  // Branch multipliers
  if (tower.branch && def.branches[tower.branch]) {
    const br = def.branches[tower.branch];
    if (br.mul) for (const k of Object.keys(br.mul)) if (s[k] !== undefined) s[k] *= br.mul[k];
    if (br.chainBonus) s.chains = (s.chains || 0) + br.chainBonus;
    if (br.setChains != null) s.chains = br.setChains;
    if (br.splash) s.splash = br.splash;
    if (br.aoe) s.aoe = true;
    if (br.isDoT) s.isDoT = true;
  }
  // Sub-branch
  if (tower.subbranch && tower.branch && def.branches[tower.branch].subs[tower.subbranch]) {
    const sb = def.branches[tower.branch].subs[tower.subbranch];
    if (sb.mul) for (const k of Object.keys(sb.mul)) if (s[k] !== undefined) s[k] *= sb.mul[k];
    Object.assign(s, Object.fromEntries(Object.entries(sb).filter(([k]) => k !== 'mul' && k !== 'name' && k !== 'desc')));
  }
  // Masteries: tower.masteries is array of {type,...}
  for (const m of tower.masteries) {
    if (m.dmg)      s.damage   *= (1 + m.dmg);
    if (m.range)    s.range    *= (1 + m.range);
    if (m.fireRate) s.fireRate *= (1 + m.fireRate);
    if (m.splash)   s.splash   = (s.splash || 0) * (1 + m.splash);
  }
  // Global boon bonuses
  s.damage   *= (1 + state.globalDmgBonus);
  s.range    *= (1 + state.globalRangeBonus);
  s.fireRate *= (1 + state.globalFireRateBonus);
  // One-wave boon (Blessed Barrage)
  if (state.waveInProgress && state.nextWaveFireRateBuff) s.fireRate *= (1 + state.nextWaveFireRateBuff);
  // Map feature bonus — tower sitting on a special tile (highGround/powerShrine/speedStone)
  const feat = state.features && state.features.find(f => f.gx === tower.gx && f.gy === tower.gy);
  if (feat) {
    if (feat.dmg)      s.damage   *= (1 + feat.dmg);
    if (feat.range)    s.range    *= (1 + feat.range);
    if (feat.fireRate) s.fireRate *= (1 + feat.fireRate);
  }
  // Map hazard penalty — dampener tile weakens the tower placed on it
  const haz = state.hazards && state.hazards.find(h => !h.onPath && h.gx === tower.gx && h.gy === tower.gy);
  if (haz) {
    if (haz.dmgMul)      s.damage   *= haz.dmgMul;
    if (haz.rangeMul)    s.range    *= haz.rangeMul;
    if (haz.fireRateMul) s.fireRate *= haz.fireRateMul;
  }
  // BEACON SUPPORT — for each stat, take the BEST in-range beacon's contribution.
  // No stacking: a 100% damage beacon overrides a 50% damage beacon; same for
  // fire rate, crit, and range.
  if (tower.type !== 'beacon') {
    const bb = bestBeaconBuffs(tower);
    if (bb.dmg)      s.damage     *= (1 + bb.dmg);
    if (bb.fireRate) s.fireRate   *= (1 + bb.fireRate);
    if (bb.crit)     s.critChance = (s.critChance || 0) + bb.crit;
    if (bb.range)    s.range     += bb.range;
    if (bb.rangePct) s.range     *= (1 + bb.rangePct);
  } else {
    // Card shows what nearby towers actually receive (incl. sub-path extras)
    const own = beaconBuffs(tower);
    s.buffDmg = own.dmg; s.buffFireRate = own.fireRate;
  }
  // ARTIFACT CACHE — aggregated passive modifiers (cheap: cache is flat)
  const ac = state.artifactCache;
  if (ac) {
    if (ac.rangeFlat)    s.range    += ac.rangeFlat;
    if (ac.fireRateMul)  s.fireRate *= (1 + ac.fireRateMul);
    if (ac.splashMul && s.splash) s.splash *= (1 + ac.splashMul);
    if (ac.teslaChainsBonus && tower.type === 'tesla' && s.chains) s.chains += ac.teslaChainsBonus;
    if (ac.chainBonus && s.chains) s.chains += ac.chainBonus;
    // Resonance Stone: +20% dmg when 2+ towers neighbor this one (8-dir)
    if (ac.resonanceAdjacent) {
      let adj = 0;
      for (const o of state.towers) {
        if (o === tower) continue;
        if (Math.abs(o.gx - tower.gx) <= 1 && Math.abs(o.gy - tower.gy) <= 1) adj++;
      }
      if (adj >= 2) s.damage *= (1 + ac.resonanceAdjacent);
    }
    // Aurora: tower gains 30% of every other tower-type effect (approx via damage + fireRate + range bumps)
    if (ac.auroraActive) { s.damage *= 1.08; s.range *= 1.05; s.fireRate *= 1.05; if (s.splash) s.splash *= 1.10; if (s.chains) s.chains += 1; }
  }
  // Per-type range bonus (Workshop encounter)
  if (state.perTypeRangeBonus && state.perTypeRangeBonus[tower.type]) s.range += state.perTypeRangeBonus[tower.type];
  // Pyrrhic Victory stacks (resets each wave)
  if (state.pyrrhicStacks) s.damage *= (1 + state.pyrrhicStacks);
  // (Lightning Rod's +2 chain bonus is NOT applied here — it's a transient
  // wave-buff effect that the panel shouldn't show in the displayed stats.
  // Applied only at fire time in fireTesla so the actual chain firing still
  // gets the bonus while the stat display stays clean.)
  // Mutator: glassCannon — big damage boost; downside is 1 starting life (applied at run start)
  if (hasMut('glassCannon')) s.damage *= 1.6;
  // Mutator: nightfall
  if (hasMut('nightfall'))  { s.damage *= 1.4; s.range *= 0.75; }
  // Mutator: conscription
  if (hasMut('conscription')) s.damage *= 0.8;
  // Mutator: temperedSteel — costly but punchier towers
  if (hasMut('temperedSteel')) s.damage *= 1.8;
  // Mutator: lastStand
  if (hasMut('lastStand') && state.lives <= 5) s.damage *= 2.0;
  // Mutator: synergy
  if (hasMut('synergy') && hasAdjacentDifferentTower(tower)) s.damage *= 1.15;
  // Mutator: constellation
  if (hasMut('constellation')) {
    const lineCount = countTowerLine(tower);
    if (lineCount >= 3) s.damage *= (1 + 0.10 * lineCount);
  }
  // Bloodbath buff
  if (tower._bloodbathUntil && tower._bloodbathUntil > state.time) s.fireRate *= 1.5;
  // EVOLUTION stat buff — each evo tier MULTIPLIES damage and fire rate by
  // 1.35×. So Tempered (evo 1) towers do 1.35² = 1.82× base DPS, Hallowed
  // (evo 4) do 1.35⁸ = 11.03× (6× a Tempered), Iridescent (evo 6) do
  // 1.35¹² = 36.6× (20× a Tempered). Range follows a SAWTOOTH: the moment
  // a tower evolves it drops to 0.65× and climbs back to 1.0× over the
  // next 4 upgrades (see getEvoRangeMult).
  //
  // The multiplicative form is intentional: it keeps every evo threshold a
  // ~+18% net DPS-times-range gain (1.35² × 0.65 = 1.184), so the player
  // never takes a step back at L15/L20/L25/L30/L35/L40, even though they
  // pay 3× cost. Plus base level scaling layered on top makes each evo
  // step a chunky ~25–30% real-world power spike.
  const evoLvl = getEvolution(tower.level);
  if (evoLvl > 0) {
    const evoBoost = Math.pow(1.35, evoLvl);
    s.damage   *= evoBoost;
    s.fireRate *= evoBoost;
    s.range    *= getEvoRangeMult(tower.level);
  }
  // Cache result for the rest of this tick. Callers should treat the returned
  // object as read-only (no mutations) — fresh copy on next frame's first call.
  tower._statsCache = s;
  tower._statsCacheFrame = _statsCacheFrame;
  return s;
}

function hasMut(k) { return state.activeMutators.includes(k); }

function hasAdjacentDifferentTower(tower) {
  for (const dx of [-1, 0, 1]) for (const dy of [-1, 0, 1]) {
    if (dx === 0 && dy === 0) continue;
    const o = state.towers.find(t => t.gx === tower.gx + dx && t.gy === tower.gy + dy);
    if (o && o.type !== tower.type) return true;
  }
  return false;
}

function countTowerLine(tower) {
  // Count towers in horizontal OR vertical line (whichever bigger).
  let h = 1, v = 1;
  for (let d = 1; d < GRID_W; d++) { if (state.towers.some(t => t.gx === tower.gx - d && t.gy === tower.gy)) h++; else break; }
  for (let d = 1; d < GRID_W; d++) { if (state.towers.some(t => t.gx === tower.gx + d && t.gy === tower.gy)) h++; else break; }
  for (let d = 1; d < GRID_H; d++) { if (state.towers.some(t => t.gx === tower.gx && t.gy === tower.gy - d)) v++; else break; }
  for (let d = 1; d < GRID_H; d++) { if (state.towers.some(t => t.gx === tower.gx && t.gy === tower.gy + d)) v++; else break; }
  return Math.max(h, v);
}

function canPlaceAt(gx, gy) {
  if (gx < 0 || gx >= GRID_W || gy < 0 || gy >= GRID_H) return false;
  if (state.grid[gy][gx] !== 0) return false;
  if (state.towers.some(t => t.gx === gx && t.gy === gy)) return false;
  // Rubble hazard blocks placement
  if (state.hazards && state.hazards.some(h => h.blocks && h.gx === gx && h.gy === gy)) return false;
  return true;
}

function buildTower(gx, gy, type) {
  // Codex discovery — first time the player builds this tower type.
  recordCodexDiscovery('tower', type);
  const def = TOWER_DEFS[type];
  let cost = def.cost;
  if (hasMut('conscription')) cost *= 0.7;
  if (hasMut('temperedSteel')) cost *= 1.4;
  if (state.specialistType === type) cost *= 0.5;
  if (state.curseCostMul && state.curseCostMul !== 1) cost *= state.curseCostMul;
  // First Swing perk — N free placements (legacy boolean still respected).
  if ((state.firstTowerFreeCount && state.firstTowerFreeCount > 0) || state.firstTowerFree) cost = 0;
  cost = Math.round(cost);
  if (state.gold < cost) return false;
  if (!canPlaceAt(gx, gy)) return false;
  const tower = {
    id: Math.random(),
    type, gx, gy,
    x: gx * CELL + CELL/2, y: gy * CELL + CELL/2,
    level: 1, branch: null, subbranch: null,
    masteries: [], cooldown: 0, targetMode: 'first',
    angle: 0, firedCount: 0, _lastShot: 0,
    buildAnim: 1, // shrinks to 0
    _bloodbathUntil: 0,
    // Evolution animation timer + ambient sparkle accumulator. Both transient
    // (not saved). _evoAnimUntil > state.time means a collapse animation is
    // playing right now; otherwise the tower is in its stable evo state.
    _evoAnimUntil: 0,
    _evoSparkTimer: 0,
    // Visual stage unlock timestamps — each new stage animates in over ~0.45s at
    // its level threshold. Elements gated on these read `getStageAlpha()` in render.
    stageAnims: { core: state.time, inner: -1, outer: -1, orbital: -1, branch: -1, sub: -1, mastery: -1 },
    // Per-tower stats shown in the panel
    // dpsWindow keeps damage events from the last 1.0s for live DPS readout.
    // peakDps tracks the highest 1-second sliding sum this tower ever produced.
    // assistDamage = bonus dmg this tower's Shatter amp credited to other towers' hits.
    // overkillDamage = damage absorbed past enemy HP (high overkill = oversized for the wave).
    // dmgByType = breakdown by enemy type name (runner/tank/swarm/boss/etc.) for analysis.
    // _buffContributionTotal = (Beacons only) running sum of effective DPS this beacon
    //                          adds to nearby towers via its buffs. Surfaces support value
    //                          that the regular damage metric can't capture.
    stats: { damageDealt: 0, kills: 0, goldFromKills: 0, bonusGold: 0, totalCost: cost, dpsWindow: [], peakDps: 0, peakSingleTargetDps: 0, maxSingleHit: 0, assistDamage: 0, overkillDamage: 0, dmgByType: {} }
  };
  tower._buffContributionTotal = 0;
  tower._idleFrames  = 0;
  tower._totalFrames = 0;
  state.towers.push(tower);
  state.gold -= cost;
  state.towersBuilt++;
  spawnRingFx(tower.x, tower.y, def.color);
  sfx('build');
  // Monolith artifact: new towers start +1 level
  if (state.artifactCache && state.artifactCache.monolithBonus) {
    freeUpgrade(tower, state.artifactCache.monolithBonus);
  }
  // Consume First Swing perk — counter form takes priority, fall through to legacy boolean.
  if (state.firstTowerFreeCount && state.firstTowerFreeCount > 0) state.firstTowerFreeCount--;
  else if (state.firstTowerFree) state.firstTowerFree = false;
  // Artifact event
  fireArtifactEvent('tower_placed', { tower });
  return true;
}

function upgradeCost(tower) {
  const def = TOWER_DEFS[tower.type];
  // Base for next level = def.cost * 0.8 * UPGRADE_SCALE^(level-1)
  let c = def.cost * UPGRADE_COST_MULT * Math.pow(UPGRADE_SCALE, tower.level - 1);
  if (hasMut('conscription')) c *= 0.7;
  if (hasMut('temperedSteel')) c *= 1.4;
  if (state.specialistType === tower.type) c *= 0.5;
  // SPECIALIZE COST — picking a sub at L10→L11 costs 2× a normal upgrade.
  // The premium is baked into the upgrade button price instead of a separate
  // per-sub fee, so the player sees one number when they click "Specialize".
  if (tower.level === 10 && !tower.subbranch) c *= 2;
  // EVOLUTION COST — when the next upgrade crosses an evo threshold (L15,
  // L20, L25, …) it costs 3× a normal upgrade. Buys a permanent +35% dmg /
  // +35% fr stack and a tier color shift, so it's still a phenomenal deal
  // — but the price spike makes the moment feel like a real commitment.
  if (willEvolveAt(tower.level)) c *= 3;
  return Math.max(1, Math.round(c));
}

// Gold actually paid into a tower: build price plus every paid level, including
// the 2× specialise and 3× evolve steps, after discounts. Free towers and free
// levels (boons, encounters) add nothing. Old saves without the ledger fall back
// to the list-price estimate.
function towerPaid(tower) {
  if (tower.stats && typeof tower.stats.totalCost === 'number') return tower.stats.totalCost;
  const def = TOWER_DEFS[tower.type];
  let spent = def.cost;
  for (let i = 1; i < tower.level; i++) spent += def.cost * UPGRADE_COST_MULT * Math.pow(UPGRADE_SCALE, i - 1);
  return spent;
}
function sellRefundRate() { return hasMut('recycler') ? 1.0 : SELL_REFUND; }
function sellValue(tower) { return Math.round(towerPaid(tower) * sellRefundRate()); }

function upgradeTower(tower, isFree) {
  // BRANCH-CHOICE GATE — never let a free upgrade silently skip past level 5
  // or level 10 without the player choosing a specialization. If we're about
  // to push past either threshold without a choice, open the modal first.
  // The modal handler will complete this upgrade AND any queued free levels
  // (`tower._pendingFreeLevels`) once the player picks.
  if (tower.level === 5 && !tower.branch) {
    showBranchChoice(tower, 'branch', isFree);
    return true;
  }
  if (tower.level === 10 && !tower.subbranch) {
    showBranchChoice(tower, 'sub', isFree);
    return true;
  }
  if (!isFree) {
    const c = upgradeCost(tower);
    if (state.gold < c) return false;
    state.gold -= c;
    if (tower.stats) tower.stats.totalCost += c;
  }
  tower.level++;
  // Visual stage unlocks — each threshold reveals a new layer of detail.
  if (!tower.stageAnims) tower.stageAnims = { core: state.time, inner: -1, outer: -1, orbital: -1, branch: -1, sub: -1, mastery: -1 };
  if (tower.level >= 3  && tower.stageAnims.inner   < 0) tower.stageAnims.inner   = state.time;
  if (tower.level >= 5  && tower.stageAnims.outer   < 0) tower.stageAnims.outer   = state.time;
  if (tower.level >= 7  && tower.stageAnims.orbital < 0) tower.stageAnims.orbital = state.time;
  if (tower.level >= 11 && tower.stageAnims.mastery < 0) tower.stageAnims.mastery = state.time;
  // Small build pulse so the new pin dot pops + the whole tower bumps briefly
  tower.buildAnim = Math.max(tower.buildAnim || 0, 0.35);
  // Mastery perks every 5 levels past 10
  if (tower.level >= 15 && (tower.level - 10) % 5 === 0) {
    // Random mastery perk
    const perks = [
      { dmg: 0.12 },
      { range: 0.10 },
      { fireRate: 0.10 },
      { splash: 0.20 },
      { dmg: 0.20, range: -0.05 },
      { fireRate: 0.15, dmg: -0.05 }
    ];
    tower.masteries.push(perks[Math.floor(Math.random()*perks.length)]);
  }
  sfx('upgrade');
  spawnRingFx(tower.x, tower.y, TOWER_DEFS[tower.type].color);
  // Evolution threshold cross — every 5 levels past 10, the rings collapse
  // and the tower steps up a tier. Pre-increment evo is computed against
  // (level - 1) so the first cross at L15 triggers cleanly.
  const oldEvo = getEvolution(tower.level - 1);
  const newEvo = getEvolution(tower.level);
  if (newEvo > oldEvo) {
    tower._evoAnimUntil = state.time + EVO_ANIM_DURATION;
    spawnEvolutionFx(tower, newEvo);
    sfx('evo');
    // Codex tracking — record the highest evo tier reached per tower type
    // so the menu Codex can show the player's lifetime progress.
    if (!meta.codex) meta.codex = {};
    if (!meta.codex.evo) meta.codex.evo = {};
    if ((meta.codex.evo[tower.type] || 0) < newEvo) {
      meta.codex.evo[tower.type] = newEvo;
      saveMeta();
    }
  }
  return true;
}

// Find current target for a tower (first/last/strongest/closest).
// In-place removal of "dead" entries to avoid the per-frame array allocation
// `arr = arr.filter(...)` produces. Keeps the same array, shifts live entries
// down, then truncates with arr.length = w. ~zero GC pressure even with
// hundreds of particles/projectiles per frame.
function compactInPlace(arr, isAlive) {
  let w = 0;
  for (let i = 0; i < arr.length; i++) {
    const v = arr[i];
    if (isAlive(v)) {
      if (w !== i) arr[w] = v;
      w++;
    }
  }
  arr.length = w;
}

// ============================================================================
// SPATIAL HASH (enemy lookup)
// ----------------------------------------------------------------------------
// Late-game frames had ~T×E inner loops everywhere (tower targeting, AOE
// blasts, healer aura, boss aura, splash, pierce reseek) — at 30 towers and
// 200 enemies that was 6,000+ ops just to find targets, repeated for every
// hot path. The hash is rebuilt once per tick from state.enemies and lets
// any "nearby enemies within R" query touch only the cells it covers.
// ============================================================================
const SPATIAL_CELL = 64;          // pixels per spatial bucket
const _spatial = new Map();       // packed key → enemy[]
function _spatialKey(cx, cy) { return ((cx + 1024) << 12) | (cy + 1024); }

function rebuildSpatialIndex() {
  _spatial.clear();
  for (let i = 0; i < state.enemies.length; i++) {
    const e = state.enemies[i];
    if (e.dead) continue;
    const cx = (e.x / SPATIAL_CELL) | 0;
    const cy = (e.y / SPATIAL_CELL) | 0;
    const k = _spatialKey(cx, cy);
    let arr = _spatial.get(k);
    if (!arr) { arr = []; _spatial.set(k, arr); }
    arr.push(e);
  }
}

// Iterate enemies whose center is within radius `r` of (x, y). `fn(e, d2)`
// receives the squared distance for cheap comparisons. Tight loop, no allocs.
function forEachEnemyInRange(x, y, r, fn) {
  const minCx = ((x - r) / SPATIAL_CELL) | 0;
  const maxCx = ((x + r) / SPATIAL_CELL) | 0;
  const minCy = ((y - r) / SPATIAL_CELL) | 0;
  const maxCy = ((y + r) / SPATIAL_CELL) | 0;
  const r2 = r * r;
  for (let gy = minCy; gy <= maxCy; gy++) {
    for (let gx = minCx; gx <= maxCx; gx++) {
      const arr = _spatial.get(_spatialKey(gx, gy));
      if (!arr) continue;
      for (let i = 0; i < arr.length; i++) {
        const e = arr[i];
        if (e.dead) continue;
        const dx = e.x - x, dy = e.y - y;
        const d2 = dx*dx + dy*dy;
        if (d2 <= r2) fn(e, d2);
      }
    }
  }
}

function findTarget(tower, stats) {
  const r2 = stats.range * stats.range;
  let best = null, bestVal = -Infinity;
  // Use the spatial index — only enemies within the tower's range bucket
  // grid are inspected, instead of every enemy on the field.
  const r = stats.range;
  const minCx = ((tower.x - r) / SPATIAL_CELL) | 0;
  const maxCx = ((tower.x + r) / SPATIAL_CELL) | 0;
  const minCy = ((tower.y - r) / SPATIAL_CELL) | 0;
  const maxCy = ((tower.y + r) / SPATIAL_CELL) | 0;
  for (let gy = minCy; gy <= maxCy; gy++) {
    for (let gx = minCx; gx <= maxCx; gx++) {
      const arr = _spatial.get(_spatialKey(gx, gy));
      if (!arr) continue;
      for (let i = 0; i < arr.length; i++) {
        const e = arr[i];
        if (e.dead || e.hp <= 0) continue;
        const dx = e.x - tower.x, dy = e.y - tower.y;
        const d2 = dx*dx + dy*dy;
        if (d2 > r2) continue;
        let v;
        switch (tower.targetMode) {
          case 'first':    v = e.progress; break;
          case 'last':     v = -e.progress; break;
          case 'strong':   v = e.hp; break;
          case 'close':    v = -d2; break;
          default:         v = e.progress;
        }
        if (v > bestVal) { bestVal = v; best = e; }
      }
    }
  }
  return best;
}

function updateTowers(dt) {
  for (const tower of state.towers) {
    tower.cooldown -= dt;
    tower.buildAnim = Math.max(0, tower.buildAnim - dt * 3);
    // Decay shoot anim (recoil + muzzle flash) — full decay in ~0.18s
    if (tower._shootAnim) tower._shootAnim = Math.max(0, tower._shootAnim - dt * 5.5);
    // Beacon is a pure support tower — skip targeting/firing entirely.
    if (tower.type === 'beacon') continue;
    // Frost — only the Blizzard branch (A) is aura-based and skips firing.
    // Default frost and Cryo (B, deep-freeze single-target) keep firing.
    if (tower.type === 'frost' && tower.branch === 'A') continue;
    const stats = computeTowerStats(tower);
    if (tower.cooldown <= 0) {
      const target = findTarget(tower, stats);
      if (target) {
        tower.angle = Math.atan2(target.y - tower.y, target.x - tower.x);
        fireTower(tower, stats, target);
        tower.cooldown = 1 / stats.fireRate;
        tower.firedCount++;
      }
    } else {
      // Idle rotation: track the enemy we'd ACTUALLY fire at, so the barrel
      // doesn't swivel toward a flyer while shots go to a different ground target.
      const goalTarget = findTarget(tower, stats);
      if (goalTarget) {
        const goal = Math.atan2(goalTarget.y - tower.y, goalTarget.x - tower.x);
        const da = normalizeAngle(goal - tower.angle);
        tower.angle += da * Math.min(1, dt * 8);
      }
    }
  }
}

// Frost towers are constant area auras — no firing, no projectiles. Every
// 0.25s each frost tower re-applies its slow to all enemies inside its full
// `stats.range`. The slow's intrinsic duration (`stats.slowDur`) governs how
// long the chill lingers after an enemy leaves the field.
function updateFrostAuras(dt) {
  for (const tower of state.towers) {
    // Only Blizzard branch (A) is the aura version. Default frost (no branch)
    // and Cryo branch (B, single-target deep freeze) keep their shot/projectile
    // behavior via the regular fireTower path.
    if (tower.type !== 'frost' || tower.branch !== 'A') continue;
    tower._auraTimer = (tower._auraTimer || 0) + dt;
    if (tower._auraTimer < 0.25) continue;
    tower._auraTimer = 0;
    const stats = computeTowerStats(tower);
    if (!stats.range || !stats.slowAmt) continue;
    forEachEnemyInRange(tower.x, tower.y, stats.range, (e) => {
      applySlow(e, stats.slowAmt, stats.slowDur);
    });
  }
}

function normalizeAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

// Tier 1-4 based on level. Each tier adds a layer to the firing visuals:
//   1: L1-4    basic
//   2: L5-9    branched     — adds ember sparks
//   3: L10-14  specialized  — adds ejecta + shockwave / ring effects
//   4: L15+    mastery      — adds environmental ground dust / aura pulse
function towerTier(t) {
  if (t.level >= 15) return 4;
  if (t.level >= 10) return 3;
  if (t.level >= 5)  return 2;
  return 1;
}

// Spawn a particle iff we're under the cap. Caller-side guard avoids the
// per-frame array growing without bound when many towers are firing fast.
function spawnParticle(p) {
  if (state.particles.length >= PARTICLE_CAP) return;
  state.particles.push(p);
}

// Per-tower firing visual FX — particles + AOE rings spawned at fire time.
// Each tower's effects layer on as it tiers up.
function fireFxSentry(tower, tier) {
  if (state._simMode) return;
  const tip = getBarrelTip(tower);
  // Tier 2+: warm ember sparks shot forward
  if (tier >= 2) {
    const n = 2 + tier;
    for (let i = 0; i < n; i++) {
      const a = tower.angle + (Math.random() - 0.5) * 0.4;
      const sp = 110 + Math.random() * 80;
      spawnParticle({ kind: 'spark', x: tip.x, y: tip.y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 0.30, max: 0.40, size: 1.6, color: '#ffeec0' });
    }
  }
  // Tier 3+: ejected casing — flicks out the side
  if (tier >= 3) {
    const sideAng = tower.angle + Math.PI/2 + (Math.random() - 0.5) * 0.3;
    spawnParticle({ kind: 'spark', x: tip.x, y: tip.y,
      vx: Math.cos(sideAng)*75, vy: Math.sin(sideAng)*75 + 25,
      life: 0.45, max: 0.55, size: 2.4, color: '#ffd866' });
  }
  // Tier 4+: small forward shock-ring
  if (tier >= 4) state.aoes.push({ x: tip.x, y: tip.y, r: 3, maxR: 18, life: 0.18, color: '#9fc0ff' });
}
function fireFxCannon(tower, tier) {
  if (state._simMode) return;
  const tip = getBarrelTip(tower);
  // Tier 2+: spark spray from muzzle
  if (tier >= 2) {
    const n = 4 + tier * 2;
    for (let i = 0; i < n; i++) {
      const a = tower.angle + (Math.random() - 0.5) * 0.6;
      const sp = 90 + Math.random() * 100;
      spawnParticle({ kind: 'spark', x: tip.x, y: tip.y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 0.40, max: 0.50, size: 2.0, color: '#ff8c3a' });
    }
  }
  // Tier 3+: golden shockwave ring expanding from muzzle
  if (tier >= 3) state.aoes.push({ x: tip.x, y: tip.y, r: 4, maxR: 32, life: 0.25, color: '#ffd866' });
  // Tier 4+: ground dust around the tower base
  if (tier >= 4) {
    for (let i = 0; i < 5; i++) {
      const a = Math.random() * Math.PI * 2;
      spawnParticle({ kind: 'spark', x: tower.x, y: tower.y,
        vx: Math.cos(a)*35, vy: Math.sin(a)*35 + 18,
        life: 0.35, max: 0.45, size: 2.5, color: '#7a8090' });
    }
  }
}
function fireFxTesla(tower, tier) {
  if (state._simMode) return;
  // Tier 2+: white sparks spraying around the tower core
  if (tier >= 2) {
    const n = 2 + tier;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 70 + Math.random() * 60;
      spawnParticle({ kind: 'spark', x: tower.x, y: tower.y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 0.25, max: 0.35, size: 1.8, color: '#ffffff' });
    }
  }
  // Tier 3+: electric ring expanding outward
  if (tier >= 3) state.aoes.push({ x: tower.x, y: tower.y, r: 4, maxR: 28, life: 0.20, color: '#d9b6ff' });
  // Tier 4+: secondary larger ring
  if (tier >= 4) state.aoes.push({ x: tower.x, y: tower.y, r: 6, maxR: 42, life: 0.30, color: '#b28dff' });
}
function fireFxFrost(tower, tier) {
  if (state._simMode) return;
  const tip = getBarrelTip(tower);
  // Tier 2+: drifting ice flake particles
  if (tier >= 2) {
    const n = 2 + tier;
    for (let i = 0; i < n; i++) {
      const a = tower.angle + (Math.random() - 0.5) * 0.5;
      const sp = 55 + Math.random() * 45;
      spawnParticle({ kind: 'spark', x: tip.x, y: tip.y,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 0.50, max: 0.60, size: 1.8, color: '#b4eeff' });
    }
  }
  // Tier 3+: crystalline burst at the tip
  if (tier >= 3) state.aoes.push({ x: tip.x, y: tip.y, r: 3, maxR: 22, life: 0.25, color: '#b4eeff' });
  // Tier 4+: chilled aura pulse from the tower itself
  if (tier >= 4) state.aoes.push({ x: tower.x, y: tower.y, r: 6, maxR: 34, life: 0.32, color: '#5ad6ff' });
}

function fireTower(tower, stats, target) {
  const def = TOWER_DEFS[tower.type];
  let dmg = stats.damage;
  let isCrit = false;
  // Visual-throttle decision — at fire rates above VISUAL_FIRE_CAP, only the
  // cap-rate of shots renders a projectile / particles / muzzle flash. Damage
  // still goes off every shot via the instant-hit path further down.
  const visualGap = 1 / VISUAL_FIRE_CAP;
  const showVisuals = !tower._lastVisualShot ||
                      (state.time - tower._lastVisualShot) >= visualGap;
  if (showVisuals) tower._lastVisualShot = state.time;
  // Recoil + muzzle flash anim only on visual shots — otherwise the tower
  // would jitter at high rates when only some shots fire.
  if (showVisuals) tower._shootAnim = 1;
  // Tiered firing FX — particles / aoe rings. Visual shots only.
  if (showVisuals) {
    const fxTier = towerTier(tower);
    if (tower.type === 'sentry') fireFxSentry(tower, fxTier);
    else if (tower.type === 'cannon') fireFxCannon(tower, fxTier);
    else if (tower.type === 'tesla')  fireFxTesla(tower, fxTier);
    else if (tower.type === 'frost')  fireFxFrost(tower, fxTier);
  }
  const ac = state.artifactCache || {};
  // Artifact: Thunderclap — first shot each wave auto-crits
  if (ac.firstShotCrit && !tower._firedThisWave) { dmg *= 3; isCrit = true; tower._firedThisWave = true; }
  // Artifact: Last Ember — Sentry silent 5+ seconds triple-damages next shot
  if (ac.sentrySilentCrit && tower.type === 'sentry') {
    const since = state.time - (tower._lastShot || -999);
    if (since >= ac.sentrySilentCrit) { dmg *= 3; isCrit = true; }
  }
  tower._lastShot = state.time;
  // Artifact: Bullet Casing — extra sentry crit chance
  const bonusSentryCrit = (tower.type === 'sentry' && ac.sentryCritBonus) ? ac.sentryCritBonus : 0;
  // Critical Eye mutator
  if (hasMut('criticalEye') && Math.random() < 0.10) { dmg *= 3; isCrit = true; }
  // Sub-branch crit + artifact crit bonus
  const critChance = (stats.critChance || 0) + bonusSentryCrit;
  if (critChance && Math.random() < critChance) { dmg *= stats.critMul || 3; isCrit = true; }
  // Audio: at high fire rates the per-shot pulses fuse into a streaming tone.
  // Flamethrower (cannon DoT) ALWAYS streams — its per-shot boom sounds awful
  // when stacked at 3-4 rounds/sec.
  const eff = stats.fireRate;
  const isFlame = (tower.type === 'cannon' && stats.isDoT);
  if (isCrit) sfx('crit');
  if (isFlame) {
    flameStream(tower, eff);
  } else if (eff > STREAM_THRESHOLD && STREAM_CONFIGS[tower.type]) {
    streamFire(tower, eff);
  } else if (!isCrit) {
    sfx(tower.type === 'cannon' ? 'cannon' : tower.type === 'tesla' ? 'tesla' : tower.type === 'frost' ? 'frost' : 'shoot');
  }

  // Lightning Rod: non-tesla picked tower this wave fires tesla-style chains.
  // Tesla path is already instant-damage (chain hits resolved immediately +
  // a visual zap pushed into state.zaps), so we just gate the visual.
  if (tower._lrodWave && tower.type !== 'tesla') {
    fireTesla(tower, stats, target, dmg, isCrit, showVisuals);
    return;
  }
  if (tower.type === 'tesla') {
    fireTesla(tower, stats, target, dmg, isCrit, showVisuals);
  } else if (tower.type === 'cannon') {
    if (showVisuals) {
      fireCannon(tower, stats, target, dmg, isCrit);
    } else {
      instantCannonHit(tower, stats, target, dmg);
    }
    // Artifact: Echo Chamber — 20% chance to fire twice. Second shot follows
    // the same visual gate as the first.
    if (ac.cannonDoubleFire && Math.random() < ac.cannonDoubleFire) {
      if (showVisuals) fireCannon(tower, stats, target, dmg * 0.7, isCrit);
      else             instantCannonHit(tower, stats, target, dmg * 0.7);
    }
  } else if (tower.type === 'frost') {
    if (showVisuals) fireFrost(tower, stats, target, dmg);
    else             instantFrostHit(tower, stats, target, dmg);
  } else {
    if (showVisuals) fireProjectile(tower, stats, target, dmg, isCrit);
    else             instantSentryHit(tower, stats, target, dmg, isCrit);
  }
}

// Visual-fire cap — once a tower's fire rate exceeds this, individual shots
// keep applying damage but only every ~1/VISUAL_FIRE_CAP seconds spawns the
// projectile / particles / muzzle flash. At 30 shots/sec that's a 2.5×
// reduction in projectiles in flight + particle spawns per tower, while DPS
// stays correct. The threshold is high enough that most towers fire fully
// visually — only late-game minigun-class rates hit the cap.
const VISUAL_FIRE_CAP = 18;

// Apply a sentry-style instant hit (no projectile in flight). Mirrors the
// on-impact behavior in updateProjectiles for the sentry path: damage +
// slowOnHit / empSlow + pierce reseek through nearby enemies.
function instantSentryHit(tower, stats, target, dmg, isCrit) {
  if (!target || target.dead) return;
  damageEnemy(target, dmg, tower, false, isCrit);
  if (stats.slowOnHit) applySlow(target, stats.slowOnHit.amt, stats.slowOnHit.dur);
  if (stats.empSlow)   applySlow(target, stats.empSlow.amt, stats.empSlow.dur);
  if (stats.pierce > 0) {
    let remaining = stats.pierce;
    const hit = new Set([target.id]);
    forEachEnemyInRange(target.x, target.y, 180, (e) => {
      if (remaining <= 0 || hit.has(e.id) || e.dead) return;
      hit.add(e.id);
      damageEnemy(e, dmg, tower, false, isCrit);
      if (stats.slowOnHit) applySlow(e, stats.slowOnHit.amt, stats.slowOnHit.dur);
      if (stats.empSlow)   applySlow(e, stats.empSlow.amt, stats.empSlow.dur);
      remaining--;
    });
  }
}
// Apply a cannon-style instant hit. Splash at the target's CURRENT pos +
// cluster bombs around it. Flamethrower (isDoT) keeps its existing path
// because the cone IS the visual; nothing to skip there.
function instantCannonHit(tower, stats, target, dmg) {
  if (stats.isDoT) return;   // flamethrower handles itself
  explodeAt(target.x, target.y, stats.splash || 40, dmg, tower);
  if (stats.cluster) {
    const splash = stats.splash || 40;
    for (let i = 0; i < stats.cluster; i++) {
      const a  = (i / stats.cluster) * Math.PI * 2;
      const cx = target.x + Math.cos(a) * 28;
      const cy = target.y + Math.sin(a) * 28;
      explodeAt(cx, cy, splash * 0.7, dmg * 0.5, tower);
    }
  }
}
// Apply a frost-style instant hit. Single-target slow + (Ice Heart) flat
// damage; AOE branch (Blizzard) is now an aura tower so we never hit this
// path — Cryo (single-target) is the only frost shooter.
function instantFrostHit(tower, stats, target, dmg) {
  if (!target || target.dead) return;
  applySlow(target, stats.slowAmt, stats.slowDur);
  if (dmg > 0) damageEnemy(target, dmg, tower, false);
  if (stats.glacier) {
    // Glacier base: 90% slow / 1.0s on the target itself (was 75%/0.6s).
    applySlow(target, 0.90, 1.0);
    // Glacier aura: also chill nearby enemies in glacierAuraRange (50px).
    if (stats.glacierAuraRange) {
      // applySlow already updates the chilled timer (see end of that function),
      // so we just call it on each nearby enemy with reduced amt + dur to apply
      // the aura effect.
      forEachEnemyInRange(target.x, target.y, stats.glacierAuraRange, (e) => {
        if (e === target) return;
        applySlow(e, (stats.slowAmt || 0.20) * 0.7, (stats.slowDur || 1.0) * 0.6);
      });
    }
  }
}

// Tier-aware projectile color. At evo 0 we use the tower's base projectile
// color (#9fc0ff blue bullet, #ff8c3a orange shell, etc.). At higher evos
// the projectile picks up the tier glow so the bullets / shells / shards
// match the evolved tower's body. drawProjectile adds the per-tier flair
// (crystalline glint, gold shine, halo, void darkness, prismatic) on top.
function projectileColor(tower) {
  const tier = getEvoTier(getEvolution(tower.level));
  if (tier) return tier.glow;
  return TOWER_DEFS[tower.type].projectile.color;
}
function projectileEvoMeta(tower) {
  const evo = getEvolution(tower.level);
  const tier = getEvoTier(evo);
  return { evo, mode: tier ? tier.mode : null, accent: tier ? tier.accent : null };
}

// Distance from tower center to barrel tip per tower type. Bullets/shells
// spawn here so they appear to come OUT of the barrel rather than out of
// the tower body.
const BARREL_TIP_OFFSET = { sentry: 24, cannon: 26, tesla: 20, frost: 19, beacon: 0 };
function getBarrelTip(tower) {
  const off = BARREL_TIP_OFFSET[tower.type] || 0;
  return {
    x: tower.x + Math.cos(tower.angle) * off,
    y: tower.y + Math.sin(tower.angle) * off
  };
}

function fireProjectile(tower, stats, target, dmg, isCrit) {
  const def = TOWER_DEFS[tower.type];
  const tip = getBarrelTip(tower);
  const meta = projectileEvoMeta(tower);
  state.projectiles.push({
    type: def.projectile.type,
    x: tip.x, y: tip.y,
    speed: def.projectile.speed,
    color: projectileColor(tower),       // evo glow at higher tiers, base at evo 0
    target, damage: dmg,
    from: tower,
    pierce: stats.pierce || 0,
    hitSet: new Set(),
    slowOnHit: stats.slowOnHit || null,
    isCrit,
    empSlow: stats.empSlow || null,
    piercing: stats.piercing || false,
    trail: [],
    evo: meta.evo,                        // tier number, drives drawProjectile flair
    evoMode: meta.mode                    // 'plates' / 'facet' / 'beams' / 'halo' / 'stars' / 'hueCycle'
  });
}

function fireCannon(tower, stats, target, dmg, isCrit) {
  // Shell flies to target.x,y position at target's predicted future location.
  const tx = target.x, ty = target.y;
  if (stats.isDoT) {
    // Flamethrower: wide cone of fire — hits ALL enemies in the cone every shot.
    // It's literally a pressurized stream; a thin pierce wouldn't read like a
    // flamethrower. The cone is wide and the range is generous so it shreds
    // bunched enemies like a real flame stream.
    const ang = tower.angle;
    const tip = getBarrelTip(tower);
    const CONE_HALF_ANGLE = 0.78;     // ~45° each side, ~90° total — proper flame fan
    const RANGE_FACTOR = 1.25;         // a bit beyond the tower's nominal range
    // Spawn lots of flame particles fanning across the cone for visual pierce
    const N_PARTICLES = 14;
    for (let i = 0; i < N_PARTICLES; i++) {
      const spread = (Math.random() - 0.5) * (CONE_HALF_ANGLE * 1.7);
      const speed = 240 + Math.random() * 130;
      state.particles.push({
        kind: 'flame', x: tip.x, y: tip.y,
        vx: Math.cos(ang + spread) * speed,
        vy: Math.sin(ang + spread) * speed,
        life: 0.55 + Math.random() * 0.30,
        max:  0.85,
        size: 1.8 + Math.random() * 1.6,
        color: i % 3 === 0 ? '#ffd866' : '#ff8c3a'   // mix orange + bright yellow tips
      });
    }
    // Damage every enemy inside the cone — spatial-indexed by extended range.
    const coneR = stats.range * RANGE_FACTOR;
    forEachEnemyInRange(tower.x, tower.y, coneR, (e, d2) => {
      const dx = e.x - tower.x, dy = e.y - tower.y;
      const a = Math.atan2(dy, dx);
      const da = Math.abs(normalizeAngle(a - ang));
      if (da > CONE_HALF_ANGLE) return;
      damageEnemy(e, dmg, tower, false);
      // Apply burn DoT — duration scales with Inferno
      e.burn = { dur: 2 * (stats.burnMul || 1), dmg: dmg * 0.55, from: tower, tick: 0 };
      // Inferno (B1) — burn spreads to nearest unburned enemies (also spatial).
      // Wider spread radius if the sub specifies one (Inferno bumps to 75 from default 60).
      if (stats.burnSpread) {
        let spread = 0;
        const spreadR = stats.burnSpreadRadius || 60;
        forEachEnemyInRange(e.x, e.y, spreadR, (o) => {
          if (spread >= stats.burnSpread) return;
          if (o === e || o.burn) return;
          o.burn = { dur: e.burn.dur * 0.7, dmg: e.burn.dmg * 0.7, from: tower, tick: 0 };
          spread++;
        });
      }
    });
    return;
  }
  const tip = getBarrelTip(tower);
  const meta = projectileEvoMeta(tower);
  state.projectiles.push({
    type: 'cannonball',
    x: tip.x, y: tip.y,
    speed: TOWER_DEFS.cannon.projectile.speed,
    color: projectileColor(tower),
    target, damage: dmg, splash: stats.splash || 40,
    targetX: tx, targetY: ty,
    cluster: stats.cluster || 0,
    stunOnHit: stats.stunOnHit || 0,
    from: tower, isCrit,
    evo: meta.evo, evoMode: meta.mode
  });
}

function fireFrost(tower, stats, target, dmg) {
  // Ice Heart artifact: frost projectiles deal a flat chunk of damage.
  // Permafrost (frost A1) now also has a chip damage field on its sub def
  // that flows into stats.damage (≥4). Sum both so chip + artifact stack.
  const frostFlat   = (state.artifactCache && state.artifactCache.frostDmgFlat) ? state.artifactCache.frostDmgFlat : 0;
  const permafrostChip = stats.damage || 0;
  const totalProjectileDmg = frostFlat + permafrostChip;
  const tip = getBarrelTip(tower);
  const meta = projectileEvoMeta(tower);
  state.projectiles.push({
    type: 'frost',
    x: tip.x, y: tip.y,
    speed: TOWER_DEFS.frost.projectile.speed,
    color: projectileColor(tower),
    target, damage: totalProjectileDmg,
    from: tower,
    slowAmt: stats.slowAmt, slowDur: stats.slowDur,
    aoe: stats.aoe, splash: stats.splash,
    glacier: stats.glacier,
    glacierAuraRange: stats.glacierAuraRange || 0,
    trail: [],
    evo: meta.evo, evoMode: meta.mode
  });
}

function fireTesla(tower, stats, target, dmg, isCrit, showVisuals) {
  if (showVisuals === undefined) showVisuals = true;
  // Chain from target through nearby enemies up to stats.chains (default 3).
  // Spatial-indexed nearest-search — was iterating every enemy on the field
  // for each chain hop, which got expensive with many tesla towers.
  // Lightning Rod artifact: chosen non-Tesla tower this wave fires +2 chain hops.
  // Applied at fire time (NOT in computeTowerStats) so the panel display stays
  // clean — wave-buff effects shouldn't show in the tower's headline stats.
  const lrodChainBonus = (tower._lrodWave && tower.type !== 'tesla') ? 2 : 0;
  const chainsBase = stats.chains || 3;
  const chains = chainsBase + (hasMut('shockTherapy') ? 2 : 0) + lrodChainBonus;
  const hitOrder = [target];
  let current = target;
  const hitSet = new Set([target.id]);
  while (hitOrder.length < chains) {
    let best = null, bestD2 = Infinity;
    forEachEnemyInRange(current.x, current.y, 110, (e, d2) => {
      if (hitSet.has(e.id) && !stats.loopChain) return;
      if (d2 < bestD2) { bestD2 = d2; best = e; }
    });
    if (!best) break;
    hitOrder.push(best);
    hitSet.add(best.id);
    current = best;
  }
  // Tesla Overload — every Nth volley (3rd by default with the new tunable)
  // applies a heavy slow AND deals 2× damage on the slow shot. Slow caps at
  // MAX_SLOW so enemies always retain at least 25% of their base speed.
  // Overload tunables come from the sub def (overloadEvery, overloadDmgMul).
  let overload = false;
  let overloadDmgMul = 1;
  if (stats.overload) {
    let every = 4, oMul = 1;
    if (tower.branch && tower.subbranch) {
      const sb = TOWER_DEFS.tesla.branches[tower.branch] && TOWER_DEFS.tesla.branches[tower.branch].subs[tower.subbranch];
      if (sb) {
        every = sb.overloadEvery || every;
        oMul  = sb.overloadDmgMul || oMul;
      }
    }
    overload = (tower.firedCount % every === every - 1);
    if (overload) overloadDmgMul = oMul;
  }
  // Tempest gets a chainDmgFalloff override (default 0.88 → 0.85). Set on the
  // sub def. Higher value = chains keep more punch as they hop further.
  let chainFalloff = 0.88;
  if (tower.branch && tower.subbranch) {
    const sb = TOWER_DEFS.tesla.branches[tower.branch] && TOWER_DEFS.tesla.branches[tower.branch].subs[tower.subbranch];
    if (sb && typeof sb.chainDmgFalloff === 'number') chainFalloff = sb.chainDmgFalloff;
  }
  let attenuation = 1;
  for (const e of hitOrder) {
    damageEnemy(e, dmg * attenuation * overloadDmgMul, tower, false, isCrit);
    if (overload) applySlow(e, 0.75, 0.8);
    if (stats.empSlow) applySlow(e, stats.empSlow.amt, stats.empSlow.dur);
    attenuation *= chainFalloff;
  }
  // Railgun: pierce in line — damage everything along the line (still happens
  // even on non-visual shots so DPS stays correct).
  if (stats.piercing) {
    const ang = Math.atan2(target.y - tower.y, target.x - tower.x);
    const ex = tower.x + Math.cos(ang) * stats.range * 1.2;
    const ey = tower.y + Math.sin(ang) * stats.range * 1.2;
    for (const e of state.enemies) {
      if (e.dead || hitSet.has(e.id)) continue;
      if (distToLine(e.x, e.y, tower.x, tower.y, ex, ey) < 16) {
        damageEnemy(e, dmg * 0.8, tower, false);
        hitOrder.push(e);
      }
    }
  }
  // Zap VISUAL — gated behind showVisuals so high-rate tesla doesn't bury
  // the field in jagged bolts. Damage above already ran for every shot.
  if (showVisuals) {
    const tEvo = getEvolution(tower.level);
    const tTier = getEvoTier(tEvo);
    const tierGlow = tTier ? tTier.glow : null;
    // Color picks: overload always white-hot. Otherwise evo glow (if any),
    // else the Tesla baseline purple. Stash evo + mode on the zap so the
    // renderer can layer tier-specific flair (laser core, halo, starfield).
    const zapColor = overload ? '#ffffff' : (tierGlow || '#d9b6ff');
    if (stats.piercing) {
      const ang = Math.atan2(target.y - tower.y, target.x - tower.x);
      const beamEnd = {
        x: tower.x + Math.cos(ang) * stats.range * 1.25,
        y: tower.y + Math.sin(ang) * stats.range * 1.25
      };
      state.zaps.push({
        points: [{ x: tower.x, y: tower.y }, beamEnd],
        life: 0.30,                                  // longer dwell — railgun's the showpiece
        color: zapColor,
        railgun: true,                               // turns on the laser look in render
        evo: tEvo,
        evoMode: tTier ? tTier.mode : null,
        evoAccent: tTier ? tTier.accent : null
      });
    } else {
      const anchors = [{ x: tower.x, y: tower.y }].concat(hitOrder.map(e => ({ x: e.x, y: e.y })));
      const pts = [anchors[0]];
      for (let i = 0; i < anchors.length - 1; i++) {
        const a = anchors[i], b = anchors[i + 1];
        for (let s = 1; s < 4; s++) {
          const t = s / 4;
          pts.push({
            x: a.x + (b.x - a.x) * t + (Math.random() - 0.5) * 16,
            y: a.y + (b.y - a.y) * t + (Math.random() - 0.5) * 16
          });
        }
        pts.push(b);
      }
      state.zaps.push({
        points: pts,
        life: 0.20,
        color: zapColor,
        evo: tEvo,
        evoMode: tTier ? tTier.mode : null,
        evoAccent: tTier ? tTier.accent : null
      });
    }
  }
  // Audio is handled by fireTower (per-shot or stream) — don't double-play here.
}

function distToLine(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const L = dx*dx + dy*dy;
  if (L === 0) return Math.hypot(px-x1, py-y1);
  let t = ((px-x1)*dx + (py-y1)*dy) / L;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t*dx, cy = y1 + t*dy;
  return Math.hypot(px-cx, py-cy);
}

// ============================================================================
// 11. ENEMY BEHAVIOR
