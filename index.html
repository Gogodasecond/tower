function showBoonPick() {
  // Between every 5th wave, pick 1 of 3 random boons.
  const shuffled = [...BOON_POOL];
  for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i+1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
  const picks = shuffled.slice(0, 3);
  pushModalPause();
  const html = `
    ${modalFunds()}
    <h2>Boon</h2>
    <div class="sub">Pick one to strengthen your run.</div>
    <div class="choice-grid">
      ${picks.map(b => {
        const col = BOON_COLORS[b.id] || '#6caaff';
        const preview = previewBoon(b.id);
        return `<div class="choice colored" data-id="${b.id}" style="--cc:${col};">
          <div class="accent-bar"></div>
          <div class="tag">Boon</div>
          <h3>${b.name}</h3>
          <div class="desc">${b.desc}</div>
          ${preview ? `<div class="boon-preview">${preview}</div>` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
  const modal = showModalHTML(html, '#ffd866');
  modal.dataset.noEsc = '1';   // a boon has no "skip" — Esc must not throw it away
  modal.querySelectorAll('.choice').forEach(el => {
    el.onclick = () => {
      const needsFollowup = applyBoon(el.dataset.id);
      if (!needsFollowup) {
        hideModal();
        popModalPause();
      }
      sfx('boon');
    };
  });
}

function applyBoon(id) {
  switch (id) {
    case 'freeTower': {
      // Present tower type choice — returns true so showBoonPick doesn't tear down our modal
      const html = `<h2>Choose a Free Tower</h2>
        <div class="sub">Placed wherever you click next.</div>
        <div class="choice-grid">
          ${TOWER_ORDER.map(k => {
            const col = TOWER_DEFS[k].color;
            return `<div class="choice colored" data-t="${k}" style="--cc:${col};">
              <div class="accent-bar"></div>
              <div class="tag">FREE</div>
              <h3>${TOWER_DEFS[k].name}</h3>
              <div class="desc">${TOWER_DEFS[k].desc}</div>
            </div>`;
          }).join('')}
        </div>`;
      const modal = showModalHTML(html, '#9fc0ff');   // gift / structure
      modal.querySelectorAll('.choice').forEach(el => { el.onclick = () => { state.placingType = el.dataset.t; state._freePlacing = true; hideModal(); popModalPause(); showPlacementHint(el.dataset.t); renderTowerButtons(); }; });
      return true;
    }
    case 'rangeAll':    state.globalRangeBonus += 0.10; break;
    case 'doubleGold':  state.nextWaveGoldMul = 2; break;
    case 'heal':        state.lives = Math.min(state.lives + 5, hasMut('fortified') ? 50 : 40); break;
    case 'twoLevels': {
      if (state.towers.length === 0) return false;
      // Map-based pick — promotion purple highlight on hover.
      openTowerPicker('Pick a tower to promote (+2 levels)', t => freeUpgrade(t, 2), '#c190ff');
      return true;
    }
    case 'dmgAll':      state.globalDmgBonus += 0.08; break;
    case 'barrage':     state.nextWaveFireRateBuff = 0.30; break;
    case 'bigGold':     { const amt = 150 + state.wave * 25; state.gold += amt; state.goldEarned += amt; } break;
    case 'fireRateAll': state.globalFireRateBonus += 0.10; break;
    case 'chillWorld':  state.chillNextWave = true; break;
    case 'scouts': {
      state.scoutsUnlocked = true;
      ensureScoutedWaves();
      renderScoutsPanel();
      break;
    }
    case 'reroll': {
      // Swap a random active mutator — same eligibility as run-start mutator pick.
      const pool = Object.keys(MUTATOR_POOL).filter(k => (MUTATOR_POOL[k].startUnlocked || isInPool('mutators', k)) && !state.activeMutators.includes(k));
      if (pool.length && state.activeMutators.length) {
        const ri = Math.floor(Math.random() * state.activeMutators.length);
        state.activeMutators[ri] = pool[Math.floor(Math.random() * pool.length)];
        applyMutatorStart();
        renderMutatorsBar();
        updateTopBar();
      }
    } break;
  }
  updateTopBar();
}

      L.push({ path: P.rrect(x - 15, y - 15, 30, 30, 3.5), h: 2.8 * hk, fill: W1, deco: g => { g.strokeStyle = ink; g.lineWidth = 0.5; g.strokeRect(x - 12, y - 12, 24, 24); for (const [dx, dy] of [[-13, -13], [13, -13], [-13, 13], [13, 13]]) dot(g, x + dx, y + dy); ticks(15)(g); } });
      L.push({ path: P.circle(x, y, 10.6), h: 5.4 * hk, fill: W0, deco: g => { for (let k = 0; k < 12; k++) { const an = k / 12 * TAU; line(g, [x + Math.cos(an) * 8.4, y + Math.sin(an) * 8.4], [x + Math.cos(an) * 10.6, y + Math.sin(an) * 10.6], ink, 0.5); } } });
      if (br === 'A') {
        // Mortar: a fat tube pointing at the sky — from above, a bored ring on a short yoke
        const [mx, my] = T(6.5, 0);
        L.push({ rot: 1, path: P.rot(x, y, a, -2, -3.6, 8, 3.6), h: 6.6 * hk, fill: W1 });
        L.push({ rot: 1, path: P.circle(mx, my, 7), h: 9.6 * hk, fill: W1, deco: g => { ring(g, mx, my, 4.8, ink, 0.6); ring(g, mx, my, 6.2, ink, 0.4); } });
        L.push({ rot: 1, path: P.circle(mx, my, 2.4), h: 9.8 * hk, fill: acc });
      } else if (br === 'B') {
        // Flamethrower: twin fuel tanks behind a thin nozzle with a flared tip
        L.push({ rot: 1, path: P.many(P.rot(x, y, a, -9, -8.8, 3, -4.8), P.rot(x, y, a, -9, 4.8, 3, 8.8)), h: 6.8 * hk, fill: W0, deco: g => { for (const s of [-6.8, 6.8]) line(g, T(-7, s), T(1, s), ink, 0.5); } });
        L.push({ rot: 1, path: P.rot(x, y, a, -1, -2.1, 19, 2.1), h: 7.6 * hk, fill: W1, deco: g => { for (const u of [7, 11, 15]) line(g, T(u, -2.1), T(u, 2.1), ink, 0.5); } });
        L.push({ rot: 1, path: P.poly([T(18, -2.4), T(23.5, -4), T(23.5, 4), T(18, 2.4)]), h: 7.9 * hk, fill: acc });
      } else {
        const bw = 3.6, bl = 19;
        L.push({ rot: 1, path: P.rot(x, y, a, -1, -bw, bl, bw), h: 7.6 * hk, fill: W1, deco: g => line(g, T(3, 0), T(bl, 0), ink, 0.5) });

    } else if (t.type === 'tesla') {
      const n = br === 'A' ? 4 : 3, armL = br === 'B' ? 16 : 13.5, arms = [], ins = [], ends = [];
      for (let k = 0; k < n; k++) { const an = -Math.PI / 2 + k * TAU / n; arms.push(P.rot(x, y, an, 3.5, -1.2, armL, 1.2)); ins.push(P.circle(x + Math.cos(an) * armL, y + Math.sin(an) * armL, 3.2)); ends.push([x + Math.cos(an) * armL, y + Math.sin(an) * armL]); }
      L.push({ path: P.circle(x, y, 15.5), h: 2.8 * hk, fill: W1, deco: g => { ring(g, x, y, 13.3, ink, 0.5); ticks(15.5)(g); } });
      L.push({ path: P.many(...arms), h: 4.6 * hk, fill: W0 });
      L.push({ path: P.many(...ins), h: 7.2 * hk, fill: W0, deco: g => { for (const [ex, ey] of ends) { ring(g, ex, ey, 2.1, ink, 0.5); ring(g, ex, ey, 1, LOOK.ink, 0.5); } } });
      L.push({ path: P.circle(x, y, 5.8), h: 8 * hk, fill: W0, deco: g => ring(g, x, y, 4.3, ink, 0.5) });

    } else if (t.type === 'frost') {
      L.push({ path: P.ngon(x, y, 14.5, 8, Math.PI / 8), h: 2.8 * hk, fill: W1, deco: g => { g.beginPath(); P.ngon(x, y, 12, 8, Math.PI / 8)(g); g.strokeStyle = ink; g.lineWidth = 0.5; g.stroke(); ticks(14.5)(g); } });
      const shards = br === 'A' ? 4 : 2;
      for (let k = 0; k < shards; k++) { const an = k / shards * TAU + Math.PI / 4, T2 = R(x, y, an);

      const hh = br === 'B' ? 13 : 10.5;

        g.fillStyle = 'rgba(100,150,185,0.18)'; g.beginPath(); P.poly([[x, y - 13.5], [x + 4.7, y], [x, y + 13.5]])(g); g.fill(); line(g, [x, y - 13.5], [x, y + 13.5], 'rgba(80,130,160,0.5)', 0.5); if (sub) dot(g, x, y, 1.3, acc); } });
    } else { // beacon
      L.push({ path: P.ngon(x, y, 14.5, 4, Math.PI / 4), h: 2.8 * hk, fill: W1, deco: g => { ring(g, x, y, 8, ink, 0.5); ticks(14.5)(g); } });
      L.push({ path: P.ngon(x, y, br === 'B' ? 10 : 8, 4, 0), h: (br === 'A' ? 10 : 7.4) * hk, fill: W0, deco: g => { line(g, [x - 8, y], [x + 8, y], ink, 0.5); line(g, [x, y - 8], [x, y + 8], ink, 0.5); } });

  }

  // ---- ENEMY FAMILIES (one per era) ---------------------------------------
  // Signature: (role, x, y, heading, t, scale) → { top, layers }. All white with
  // orange details; no outlines (same hairline/catch-light treatment as towers).
  const FAM = {
    Drones(role, x, y, a, t, k) {
      const T = R(x, y, a), E = LOOK.enemy, W1 = LOOK.w1, ink = LOOK.inkSoft;
      const rotor = (px, py, r) => ({ path: P.circle(px, py, r), h0: 5 * k, h: 7 * k, fill: 'rgba(255,255,255,0.6)', deco: g => { const sp = t * 40 + px * 0.3; line(g, [px + Math.cos(sp) * r, py + Math.sin(sp) * r], [px - Math.cos(sp) * r, py - Math.sin(sp) * r], ink, 0.6); ring(g, px, py, r, ink, 0.4); dot(g, px, py, 0.8, ORANGE); } });
      if (role === 'swarm') return { top: 8 * k, layers: [rotor(x, y, 3.2 * k)] };
      if (role === 'runner' || role === 'brute') { const n = role === 'runner' ? 4 : 6, rr = (role === 'runner' ? 7 : 11) * k, br = (role === 'runner' ? 4 : 6.6) * k, ro = (role === 'runner' ? 3.2 : 3.9) * k; const arms = [], rots = [];
        for (let i = 0; i < n; i++) { const an = a + Math.PI / n + i * TAU / n; arms.push(P.rot(x, y, an, 0, -0.6 * k, rr, 0.6 * k)); rots.push(rotor(x + Math.cos(an) * rr, y + Math.sin(an) * rr, ro)); }
        return { top: 11 * k, layers: [{ path: P.many(...arms), h0: 3.5 * k, h: 5 * k, fill: W1 }, { path: role === 'runner' ? P.rot(x, y, a, -br, -br, br, br) : P.ngon(x, y, br, 6, a), h0: 3.5 * k, h: 6.2 * k, fill: E, deco: g => dot(g, ...T(br * 0.55, 0), 1.1 * k, ORANGE) }, ...rots] }; }
      const arms = [], rots = [];
      for (const [sx, sy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) { const [px, py] = T(sx * 13 * k, sy * 10.5 * k); arms.push(P.poly([T(0, -1 * k), [px, py - k], [px, py + k], T(0, 1 * k)])); rots.push(rotor(px, py, 6.6 * k)); }
      return { top: 14 * k, layers: [{ path: P.many(...arms), h0: 5 * k, h: 6.6 * k, fill: W1 }, { path: P.rot(x, y, a, -11.5 * k, -7 * k, 11.5 * k, 7 * k), h0: 5 * k, h: 8.8 * k, fill: E, deco: g => line(g, T(-11.5 * k, 0), T(11.5 * k, 0), ORANGE, 1) }, ...rots] };
    },
    Crawlers(role, x, y, a, t, k) {
      const T = R(x, y, a), E = LOOK.enemy, I = LOOK.ink;
      const legs = (g, xs, span, sp) => { for (const u of xs) for (const s of [-1, 1]) { const ph = Math.sin(t * sp + u + (s > 0 ? Math.PI : 0)); line(g, T(u, s * span * 0.35), T(u + ph * 2 * k + 1.3 * k, s * span), I, 0.55); } };
      if (role === 'swarm') return { top: 5 * k, layers: [{ path: P.circle(x, y, 2.3 * k), h: 2.1 * k, fill: E, deco: g => { legs(g, [-0.7 * k, 0.7 * k], 4.4 * k, 30); dot(g, ...T(1.4 * k, 0), 0.55, ORANGE); } }] };
      if (role === 'runner') return { top: 6 * k, layers: [{ path: P.many(P.circle(...T(-4.4 * k, 0), 2.7 * k), P.circle(...T(0, 0), 3.3 * k), P.circle(...T(4.4 * k, 0), 2.7 * k)), h: 3 * k, fill: E,
        deco: g => { legs(g, [-3.6 * k, 0, 3.6 * k], 7 * k, 26); dot(g, ...T(6.2 * k, -1.1 * k), 0.7, ORANGE); dot(g, ...T(6.2 * k, 1.1 * k), 0.7, ORANGE); } }] };
      if (role === 'brute') return { top: 10 * k, layers: [
        { path: P.ellipse(x, y, 10.6 * k, 7.6 * k, a), h: 5.4 * k, fill: E, deco: g => { legs(g, [-5.4 * k, -0.9 * k, 3.6 * k], 12.5 * k, 14); line(g, T(-10.6 * k, 0), T(6.2 * k, 0), LOOK.inkSoft, 0.6); dot(g, ...T(-3.6 * k, -3.1 * k), 1.35 * k, ORANGE); dot(g, ...T(-3.6 * k, 3.1 * k), 1.35 * k, ORANGE); } },
        { path: P.circle(...T(9.8 * k, 0), 3.2 * k), h: 4.4 * k, fill: LOOK.w1 }] };
      const segs = [], ls = [];
      for (let i = 0; i < 8; i++) { const off = Math.sin(t * 3.4 - i * 0.8) * 2.8 * k; segs.push(P.circle(...T((12.5 - i * 6.2) * k, off), (5.5 - i * 0.3) * k)); ls.push([(12.5 - i * 6.2) * k, off]); }
      return { top: 12 * k, layers: [{ path: P.many(...segs), h: 4.4 * k, fill: E, deco: g => { for (const [u, v] of ls) for (const s of [-1, 1]) { const ph = Math.sin(t * 9 + u * 0.5 + (s > 0 ? 1.5 : 0)); line(g, T(u, v + s * 3.6 * k), T(u + ph * 2.2 * k, v + s * 9 * k), I, 0.55); }
        line(g, T(17 * k, -1.8 * k), T(20.5 * k, -4 * k), ORANGE, 1.1); line(g, T(17 * k, 1.8 * k), T(20.5 * k, 4 * k), ORANGE, 1.1); } }] };
    },
    Orbs(role, x, y, a, t, k) {
      const r = { runner: 6, brute: 9.4, swarm: 3.4, boss: 14.2 }[role] * k;
      const roll = (g, bands) => { g.save(); g.beginPath(); P.circle(x, y, r)(g); g.clip(); const T = R(x, y, a);
        for (let b = 0; b < bands; b++) { const u = (((t * 24 / (TAU * r)) + b / bands) % 1) * 2.6 * r - 1.3 * r; line(g, T(u, -r), T(u, r), ORANGE, Math.max(0.8, r * 0.16)); }
        g.restore(); dot(g, x - r * 0.35, y - r * 0.4, r * 0.18, 'rgba(255,255,255,0.9)'); };
      const L = [{ path: P.circle(x, y, r), h: r * 0.9, fill: LOOK.enemy, deco: g => roll(g, role === 'boss' ? 3 : role === 'brute' ? 2 : 1) }];
      if (role === 'boss') for (let i = 0; i < 3; i++) { const an = t * 1.4 + i * TAU / 3; const px = x + Math.cos(an) * 22 * k, py = y + Math.sin(an) * 22 * k; L.push({ path: P.circle(px, py, 3.2 * k), h0: 5 * k, h: 8.5 * k, fill: LOOK.w1, deco: g => dot(g, px, py, 0.9, ORANGE) }); }

    },
    Shards(role, x, y, a, t, k) {
      const E = LOOK.enemy, warm = 'rgba(200,150,110,0.15)';
      const facet = (pp, g) => { g.fillStyle = warm; g.beginPath(); P.poly(pp)(g); g.fill(); };
      if (role === 'boss') { const sp = t * 0.5;
        return { top: 15 * k, layers: [{ path: P.star(x, y, 18 * k, 8.5 * k, 8, sp), h: 8 * k, fill: E, deco: g => { for (let i = 0; i < 8; i++) { const an = sp + i / 8 * TAU; line(g, [x, y], [x + Math.cos(an) * 18 * k, y + Math.sin(an) * 18 * k], LOOK.inkSoft, 0.5); if (i % 2) facet([[x, y], [x + Math.cos(an) * 18 * k, y + Math.sin(an) * 18 * k], [x + Math.cos(an + Math.PI / 8) * 8.5 * k, y + Math.sin(an + Math.PI / 8) * 8.5 * k]], g); } } },
          { path: P.circle(x, y, 3.6 * k), h: 9.4 * k, fill: ORANGE, glow: true }] }; }
      const sz = { runner: 8, brute: 10.8, swarm: 3.6 }[role] * k, sp = t * (role === 'brute' ? 1.1 : 2.6), T = R(x, y, sp);
      const pp = role === 'brute' ? [T(sz, 0), T(0, -sz * 0.62), T(-sz, 0), T(0, sz * 0.62)] : [T(sz, 0), T(-sz * 0.6, -sz * 0.75), T(-sz * 0.6, sz * 0.75)];

    },
    Origami(role, x, y, a, t, k) {
      const T = R(x, y, a), E = LOOK.enemy, sh = 'rgba(190,140,100,0.17)';
      if (role === 'runner') { const pp = [T(10.6 * k, 0), T(-7 * k, -6.6 * k), T(-3.6 * k, 0), T(-7 * k, 6.6 * k)];
        return { top: 6 * k, layers: [{ path: P.poly(pp), h: 4 * k, fill: E, deco: g => { g.fillStyle = sh; g.beginPath(); P.poly([pp[0], pp[2], pp[3]])(g); g.fill(); line(g, pp[0], pp[2], LOOK.inkSoft, 0.5); g.fillStyle = ORANGE; g.beginPath(); P.poly([pp[0], T(8 * k, -1.1 * k), T(8 * k, 1.1 * k)])(g); g.fill(); } }] }; }
      if (role === 'swarm') { const T2 = R(x, y, t * 3 + x); const pp = [T2(3.6 * k, 0), T2(0, -3.6 * k), T2(-3.6 * k, 0), T2(0, 3.6 * k)];
        return { top: 5 * k, layers: [{ path: P.poly(pp), h: 2.2 * k, fill: E, deco: g => { g.fillStyle = sh; g.beginPath(); P.poly([pp[0], pp[1], pp[2]])(g); g.fill(); line(g, pp[0], pp[2], LOOK.inkSoft, 0.5); } }] }; }
      if (role === 'brute') { const T2 = R(x, y, a + Math.PI / 4); const pp = [T2(9.8 * k, 0), T2(0, -9.8 * k), T2(-9.8 * k, 0), T2(0, 9.8 * k)];
        return { top: 11 * k, layers: [{ path: P.poly(pp), h: 5.8 * k, fill: E, deco: g => { for (let i = 1; i < 4; i += 2) { g.fillStyle = sh; g.beginPath(); P.poly([[x, y], pp[i], pp[(i + 1) % 4]])(g); g.fill(); } line(g, pp[0], pp[2], LOOK.inkSoft, 0.5); line(g, pp[1], pp[3], LOOK.inkSoft, 0.5); g.strokeStyle = ORANGE; g.lineWidth = 0.9; g.strokeRect(x - 1.8 * k, y - 1.8 * k, 3.6 * k, 3.6 * k); } }] }; }
      const f = 1 - 0.35 * Math.abs(Math.sin(t * 2.6));
      const wL = [T(2.6 * k, -1.8 * k), T(-3.6 * k, -17.8 * k * f), T(-8 * k, -13.4 * k * f), T(-4.4 * k, -1.8 * k)], wR = [T(2.6 * k, 1.8 * k), T(-3.6 * k, 17.8 * k * f), T(-8 * k, 13.4 * k * f), T(-4.4 * k, 1.8 * k)];
      return { top: 16 * k, layers: [{ path: P.many(P.poly(wL), P.poly(wR)), h: 9 * k, fill: E, deco: g => { line(g, T(0, 0), T(-5.8 * k, -15 * k * f), LOOK.inkSoft, 0.5); line(g, T(0, 0), T(-5.8 * k, 15 * k * f), LOOK.inkSoft, 0.5); g.fillStyle = sh; g.beginPath(); P.poly(wR)(g); g.fill(); } },
        { path: P.many(P.poly([T(9 * k, 0), T(0, -4 * k), T(-10.6 * k, 0), T(0, 4 * k)]), P.poly([T(8 * k, -0.9 * k), T(16 * k, -2.7 * k), T(8 * k, 0.9 * k)]), P.poly([T(-9 * k, -0.9 * k), T(-17 * k, -3 * k), T(-9 * k, 0.9 * k)])), h: 10.6 * k, fill: E, deco: g => { line(g, T(9 * k, 0), T(-10.6 * k, 0), LOOK.inkSoft, 0.5); dot(g, ...T(15 * k, -2.7 * k), 1.2, ORANGE); } }] };
    },
    Walkers(role, x, y, a, t, k) {
      const T = R(x, y, a), E = LOOK.enemy;
      const foot = (u, v, w, l, hh) => ({ path: P.rot(...T(u, v), a, -l, -w, l, w), h: hh, fill: LOOK.w1 });
      if (role === 'runner' || role === 'swarm') { const s = (role === 'swarm' ? 0.55 : 1) * k, st = Math.sin(t * (role === 'swarm' ? 16 : 10)) * 2.7 * s;
        return { top: 9 * s + 3, layers: [foot(st, -3 * s, 1.1 * s, 2.1 * s, 1.4), foot(-st, 3 * s, 1.1 * s, 2.1 * s, 1.4), { path: P.circle(x, y, 4.4 * s), h: 7 * s, fill: E, deco: g => { g.strokeStyle = ORANGE; g.lineWidth = 1 * s; g.beginPath(); g.arc(x, y, 3 * s, a - 0.7, a + 0.7); g.stroke(); } }] }; }
      if (role === 'brute') { const st = Math.sin(t * 6) * 2.8 * k;
        return { top: 12 * k, layers: [foot(7 * k + st, -7 * k, 1.8 * k, 2.7 * k, 1.8), foot(-7 * k - st, 7 * k, 1.8 * k, 2.7 * k, 1.8), foot(7 * k - st, 7 * k, 1.8 * k, 2.7 * k, 1.8), foot(-7 * k + st, -7 * k, 1.8 * k, 2.7 * k, 1.8),
          { path: P.rot(x, y, a, -8 * k, -6.2 * k, 8 * k, 6.2 * k), h: 8 * k, fill: E, deco: g => { line(g, T(7.8 * k, -4 * k), T(7.8 * k, 4 * k), ORANGE, 1.3); line(g, T(-4.4 * k, -6.2 * k), T(-4.4 * k, 6.2 * k), LOOK.inkSoft, 0.5); } }] }; }
      const feet = [], legs = [];
      for (let i = 0; i < 3; i++) { const an = i * TAU / 3 + 0.2, ext = (19.5 + Math.sin(t * 3 + i * 2.1) * 3.6) * k; feet.push(P.circle(...T(Math.cos(an) * ext, Math.sin(an) * ext), 3 * k)); legs.push([Math.cos(an) * ext, Math.sin(an) * ext]); }
      return { top: 16 * k, layers: [{ path: P.many(...feet), h: 1.8 * k, fill: LOOK.w1 }, { path: P.ngon(x, y, 11.6 * k, 3, a), h: 10.6 * k, fill: E, deco: g => { for (const [u, v] of legs) line(g, [x, y], T(u, v), LOOK.ink, 0.6); } }, { path: P.circle(x, y, 3.7 * k), h: 11.6 * k, fill: ORANGE, glow: true }] };
    },
    Capsules(role, x, y, a, t, k) {
      const T = R(x, y, a);
      const [len, rad, h0, hh, n] = { runner: [16, 3.7, 4.4, 8, 1], brute: [23, 6.2, 5.4, 9.8, 2], swarm: [7, 2.1, 3.6, 5.4, 1], boss: [39, 8, 7, 13.4, 3] }[role];
      const thr = []; for (let i = 0; i < n; i++) { const v = n === 1 ? 0 : (i / (n - 1) - 0.5) * rad * 1.1; thr.push([-len / 2 - 0.5, v]); }
      return { top: (hh + rad) * k + 2, layers: [{ path: P.pill(x, y, a, len * k, rad * k), h0: h0 * k, h: hh * k, fill: LOOK.enemy, deco: g => {
        line(g, T((-len / 2 + rad) * k, 0), T((len / 2 - rad) * k, 0), LOOK.inkSoft, 0.5);
        if (role === 'boss') for (let i = 0; i < 5; i++) line(g, T((-10.6 + i * 5.3) * k, -rad * 0.55 * k), T((-8 + i * 5.3) * k, -rad * 0.55 * k), ORANGE, 1);
        const fl = 0.7 + 0.3 * Math.sin(t * 40 + x);
        for (const [u, v] of thr) { const [tx, ty] = T(u * k, v * k); g.fillStyle = `rgba(255,140,50,${0.35 * fl})`; g.beginPath(); g.arc(tx, ty, (rad * 0.7 * fl + 1) * k, 0, TAU); g.fill(); dot(g, tx, ty, Math.max(0.8, rad * 0.25 * k), ORANGE); } } }] };
    },

// ============================================================================
// 18. GAME LOOP
// ============================================================================
function tick(dt) {
  if (state.paused || state.phase !== 'playing') return;
  state.time += dt;
  // Bump the per-tick stats cache key so all computeTowerStats(t) calls in
  // this frame share one cached result per tower (was being recomputed many
  // times per tower per frame from various read sites).
  _statsCacheFrame++;

  // Wave logic
  if (state.waveInProgress) {
    state.spawnTimer += dt;
    while (state.enemiesToSpawn.length && state.enemiesToSpawn[0].delay <= state.spawnTimer) {
      const e = state.enemiesToSpawn.shift();
      spawnEnemy(e.type, e.bossWave, e.eliteModifier, e.naturalBoss);
    }
    // Relentless mutator — once the spawn queue is empty BUT enemies remain on
    // the field, count down RELENTLESS_DELAY and auto-advance to the next wave.
    if (hasMut('relentless') && state.enemiesToSpawn.length === 0 && state.enemies.length > 0) {
      state._relentlessTimer = (state._relentlessTimer || 0) + dt;
      if (state._relentlessTimer >= RELENTLESS_DELAY) {
        state._relentlessTimer = 0;
        relentlessAdvance();
      }
    } else if (state.enemiesToSpawn.length > 0) {
      state._relentlessTimer = 0;
    }
    // Wave end: no pending spawns AND no enemies alive
    if (state.enemiesToSpawn.length === 0 && state.enemies.length === 0) {
      endWave();
    }
  } else if (state.wave > 0 && state.autoStartEnabled) {
    state.autoStart -= dt;
    if (state.autoStart <= 0) startWave();
  }

  // Spatial index — rebuilt once per tick so all subsequent nearby-enemy
  // queries (target finding, AOE blasts, healer aura, splash) are O(local)
  // instead of O(all enemies). Must happen BEFORE any system that reads it.
  rebuildSpatialIndex();

  // Entities
  updateTowers(dt);
  updateFrostAuras(dt);   // frost towers are stationary aura emitters
  updateEnemies(dt);
  updateProjectiles(dt);
  // Particle / ice-aura / shard-drop / stream updates are pure visual decay —
  // skip in sim mode so the harness only spends cycles on combat math.
  if (!state._simMode) {
    updateParticles(dt);
    updateIceAuras(dt);
    updateShardDrops(dt);
    pruneStreams();
  }

  // Live DPS — prune the 1s window for every tower and update peakDps.
  // Done here (not in renderPanel) so peaks register even if the panel is closed.
  for (let i = 0; i < state.towers.length; i++) getRecentDps(state.towers[i]);

  // BEACON CONTRIBUTION ACCUMULATOR + IDLE-FRAME TRACKING (per tick, all towers).
  // Beacons: track the INSTANTANEOUS rate of DPS added to nearby towers — sum
  // over towers in range of (their recent DPS × beacon's effective buffDmg).
  // Result is a per-second number (NOT a running total) — what the beacon is
  // currently adding to the system right now. Stored as t._buffContributionPerSec.
  // Idle frames: track per non-beacon tower how often it has no target.
  for (let i = 0; i < state.towers.length; i++) {
    const t = state.towers[i];
    t._totalFrames = (t._totalFrames || 0) + 1;
    if (t.type === 'beacon') {
      const stats = computeTowerStats(t);
      let perSec = 0;
      if (stats.range > 0) {
        const r2 = stats.range * stats.range;
        for (let j = 0; j < state.towers.length; j++) {
          const o = state.towers[j];
          if (o === t || o.type === 'beacon') continue;
          const dx = o.x - t.x, dy = o.y - t.y;
          if (dx*dx + dy*dy > r2) continue;
          const oDps = getRecentDps(o);
          if (oDps <= 0) continue;
          // oDps already includes the best buffs. Strip this beacon's share:
          const withB = bestBeaconBuffs(o), without = bestBeaconBuffs(o, t), os = computeTowerStats(o), cm = (os.critMul || 3) - 1;
          const base = os.critChance || 0;
          const ratio = ((1 + without.dmg) / (1 + withB.dmg)) * ((1 + without.fireRate) / (1 + withB.fireRate))
                      * ((1 + (base - withB.crit + without.crit) * cm) / (1 + base * cm));
          perSec += oDps * Math.max(0, 1 - ratio);
        }
      }
      t._buffContributionPerSec = perSec;
    } else {
      // Idle frame check — did this tower fire (or have a target in range) in the last beat?
      const recentlyFired = (t._lastShot && (state.time - t._lastShot) < 1.0);
      if (!recentlyFired) t._idleFrames = (t._idleFrames || 0) + 1;
    }
  }

  // Auto-log balance snapshots when a tower's structural inputs change
  // (level / branch / mastery / beacons / mutators / artifacts / tile etc.).
  autoLogTowerChanges();

  // Camera shake decay
  if (state.camera.shakeAmt > 0) {
    state.camera.shakeX = (Math.random() - 0.5) * state.camera.shakeAmt;
    state.camera.shakeY = (Math.random() - 0.5) * state.camera.shakeAmt;
    state.camera.shakeAmt = Math.max(0, state.camera.shakeAmt - dt * SHAKE_DECAY * 3);
  } else { state.camera.shakeX = 0; state.camera.shakeY = 0; }

  // Mutator ticks
  if (hasMut('marked')) {
    state.markedTimer -= dt;
    if (state.markedTimer <= 0 && state.enemies.length > 0) {
      const candidates = state.enemies.filter(e => !e.dead);
      if (candidates.length) {
        const pick = candidates[Math.floor(Math.random() * candidates.length)];
        state.markedEnemyId = pick.id;
        state.markedTimer = 10;
      }
    }
  }
  // Avalanche proc — Frost A2 sub def now carries `avalancheDmg` (220) and
  // `avalancheCooldown` (2.5s, was 3s). Pull from the sub def so future tuning
  // is purely data-driven.
  for (const t of state.towers) {
    if (t.type === 'frost' && t.subbranch === 'A2') {
      const sb = t.branch ? (TOWER_DEFS.frost.branches[t.branch] && TOWER_DEFS.frost.branches[t.branch].subs[t.subbranch]) : null;
      const cd  = (sb && sb.avalancheCooldown) || 3;
      const dmg = (sb && sb.avalancheDmg)      || 180;
      t._avTimer = (t._avTimer == null ? cd : t._avTimer) - dt;
      if (t._avTimer <= 0) {
        t._avTimer = cd;
        const s = computeTowerStats(t);
        const cand = [];
        forEachEnemyInRange(t.x, t.y, s.range, (e) => cand.push(e));
        if (cand.length) {
          const pick = cand[Math.floor(Math.random() * cand.length)];
          damageEnemy(pick, dmg * Math.pow(1.08, state.wave), t, false);
          applySlow(pick, 0.75, 1.0);
          state.aoes.push({ x: pick.x, y: pick.y, r: 4, maxR: 40, life: 0.3, color: '#b4eeff' });
        }
      }
    }
  }
}

// Cheap per-frame refresh of the upgrade button affordability color. A full

  const c = upgradeCost(t);
  const fe = document.getElementById('panel-funds'), ft = '$' + fmtMoney(state.gold);
  if (fe && fe.textContent !== ft) fe.textContent = ft;
  // Evolve buttons pulse when affordable; normal ones go green.

// Wave button state — updates label and color based on Gold Rush availability
// and whether a wave is currently in progress.
function refreshWaveBtn() {
  const btn = document.getElementById('btn-wave');
  if (!btn) return;
  const gr = state.artifacts && state.artifacts.find(a => a.id === 'goldRush');
  const grSt = gr ? state.artifactState['goldRush'] : null;
  const grReady = grSt && grSt.cd === 0;
  const grCd    = grSt ? grSt.cd : 0;

  // Reset state classes each frame
  btn.classList.remove('gr-ready', 'gr-cd');

  if (state.waveInProgress) {
    // Mid-wave: only Gold Rush enables the button
    if (grReady) {
      btn.textContent = 'Send Next Wave';
      btn.classList.add('gr-ready');
      btn.disabled = false;
    } else if (gr && grCd > 0) {
      btn.textContent = `Send Next (${grCd})`;
      btn.classList.add('gr-cd');
      btn.disabled = true;
    } else {
      btn.textContent = 'Wave Active';
      btn.classList.add('gr-cd');     // reuse dim style for "no-op" state
      btn.disabled = true;
    }
  } else {
    // Between waves
    btn.disabled = false;
    if (grReady) {
      btn.textContent = 'Start Wave · Gold Rush';
      btn.classList.add('gr-ready');
    } else if (gr && grCd > 0) {
      btn.textContent = `Start Wave (Rush in ${grCd})`;
    } else {
      btn.textContent = 'Start Wave';
    }
  }
}

// Live DPS + beacon badges — recomputed each frame so beacon adjacency /
// mutator changes / last-stand thresholds reflect immediately without
// rebuilding the panel. Basic stat = damage in last 1s; advanced "Peak" = best
// 1s ever. Beacon "+X%" indicators are kept in sync here too — otherwise
// placing/upgrading/selling a beacon while another tower is selected would
// leave the displayed contribution stale (the bug behind "beacon sometimes
// doesn't say it applies").
function refreshPanelDPS() {
  if (!state.selectedTower) return;
  const t = state.selectedTower;
  const live = document.getElementById('panel-dps');
  if (live) {
    const text = t.type === 'beacon'
      ? fmtMoney(Math.round(t._buffContributionPerSec || 0)) + '/s'
      : fmtMoney(Math.round(getRecentDps(t)));
    if (live.textContent !== text) live.textContent = text;
  }
  // Live portrait — the panel icon tracks the real tower (aim, recoil, evo FX).
  const icon = document.getElementById('tp-icon');
  if (icon) renderTowerIcon(icon, t, null, { zoom: 0.92 });
  // DPS graph + headline + team share (graph twice a second)
  const big = document.getElementById('panel-dps-big');
  if (big) { const v = k1(t.type === 'beacon' ? t._buffContributionPerSec : getRecentDps(t)); if (big.textContent !== v) big.textContent = v; }
  const now = performance.now();
  if (!refreshPanelDPS._t || now - refreshPanelDPS._t > 500) {
    refreshPanelDPS._t = now;
    const sp = document.getElementById('tp-spark'); if (sp && t._dpsHist && t._dpsHist.length > 1) sp.innerHTML = lineChart(t._dpsHist, 266, 40, { fill: true, zero: true });
    const sh = document.getElementById('panel-share'); if (sh) { const tot = state.towers.reduce((a, q) => a + (q._dpsEma || 0), 0); sh.textContent = (tot > 0 ? Math.round((t._dpsEma || 0) / tot * 100) : 0) + '%'; }
  }
  const peak = document.getElementById('panel-peak-dps');
  if (peak && t.stats) {
    const text = fmtMoney(Math.round(t.stats.peakDps || 0));
    if (peak.textContent !== text) peak.textContent = text;
  }
  // Beacon contribution badges — only relevant for non-beacon selections.
  if (t.type !== 'beacon') {
    const bc = computeBeaconContribution(t);
    // Helper: set text + visibility based on a positive value.
    const sync = (id, value, formatter) => {
      const el = document.getElementById(id);
      if (!el) return;
      if (value > 0) {
        const text = formatter(value);
        if (el.textContent !== text) el.textContent = text;
        if (el.style.display === 'none') el.style.display = '';
      } else if (el.style.display !== 'none') {
        el.style.display = 'none';
      }
    };
    sync('panel-bc-dmg',   bc.dmg,      v => `+${Math.round(v * 100)}% beacon`);
    sync('panel-bc-fr',    bc.fireRate, v => `+${Math.round(v * 100)}% beacon`);
    sync('panel-bc-range', bc.range,    v => `+${Math.round(v)} beacon`);
    sync('panel-bc-crit',  bc.crit,     v => `+${Math.round(v * 100)}%`);
    // Crit row holds its own toggle (the row, not just the badge, is hidden when 0).
    const critRow = document.getElementById('panel-bc-crit-row');
    if (critRow) critRow.style.display = (bc.crit > 0) ? '' : 'none';
  }
}

// Per-frame: keep the bottom-bar tower buttons in sync with current gold.
// Toggles .disabled and updates the displayed cost (for cost-modifying mutators/curses).
// Throttled to ~6Hz (every ~167ms) — affordability rarely changes between
// frames at gameplay speed and the full DOM walk + classList toggles were
// adding up at high frame counts. The visual lag is imperceptible.
let _lastTowerBtnRefresh = 0;
function refreshTowerButtons() {
  const now = performance.now();
  if (now - _lastTowerBtnRefresh < 167) return;
  _lastTowerBtnRefresh = now;
  const btns = document.querySelectorAll('#tower-selector .tower-btn');
  btns.forEach(btn => {
    const k = btn.dataset.type;
    if (!k || !TOWER_DEFS[k]) return;
    const cost = buildCostFor(k);
    btn.classList.toggle('disabled', state.gold < cost);
    btn.classList.toggle('affordable', state.gold >= cost);
    btn.classList.toggle('selected', state.placingType === k);
    btn.style.setProperty('--afford', Math.min(1, state.gold / Math.max(1, cost)).toFixed(3));
    const costEl = btn.querySelector('.cost');
    const txt = '$' + fmtMoney(cost);
    if (costEl && costEl.textContent !== txt) costEl.textContent = txt;
  });
}

let last = performance.now();

// MENU BACKDROP — the salt flat at rest. A worn track sweeps under the title,
// a few pieces stand watch beside it and a file of enemies from the furthest
// era you've reached walks it, under the same sun, clouds and grade as a run.
// ----------------------------------------------------------------------------
const MENU_BG = { key: '', still: null, bloom: null, R: null, u: 1, walk: 0, t: 0, mask: null };
const MENU_WALKERS = ['runner', 'runner', 'swarm', 'swarm', 'swarm', 'runner', 'brute', 'runner', 'sprinter', 'runner', 'swarm', 'swarm', 'tank', 'runner'];
function menuVisible() { const m = document.getElementById('menu'); return !!m && m.style.display !== 'none'; }
function _menuRoute(w, h) {
  // Enters off the left edge low, runs along the bottom, climbs the right side, leaves top-right.

function startWave() {

  if (state.wave === 0 || state.enemiesToSpawn.length === 0) {
    state.wave++;
  }

  // Doesn't apply to bosses (5-3 lives each is too costly to forgive).
  state._waveLeakBudget = 1;
  // Active artifacts — any that the player armed go off this wave + start cooldown
  for (const a of state.artifacts) {

    const s = state.artifactState[a.id];

      state.nextWaveGoldMul = Math.max(state.nextWaveGoldMul, a.active.mult);
    }

    s.cd = a.active.cooldown;

  }

  if (hasMut('earthquake') && state.wave > 1 && state.wave % 5 === 0 && state.towers.length > 0) {

  // the branch/sub-branch threshold by opening the modal if needed.

const RELENTLESS_DELAY = 7;

// (enemies from the old wave keep walking — waves overlap, no rest period).

  state.gold += 10 + state.wave * 2;
  // Tick down active-artifact cooldowns
  for (const a of state.artifacts) {

    if (s && s.cd > 0) s.cd--;

    setTimeout(() => showEncounter(), 400);

function endWave() {
  state.waveInProgress = false;
  state.autoStart = AUTO_START_DELAY;
  state.nextWaveGoldMul = 1;
  state.nextWaveFireRateBuff = 0;
  state.chillNextWave = false;
  state.eliteIncomingWave = false;
  // Wave complete bonus
  state.gold += 10 + state.wave * 2;
  // Tick down active-artifact cooldowns (1 wave at a time)
  for (const a of state.artifacts) {
    if (!a.active) continue;
    const s = state.artifactState[a.id];
    if (s && s.cd > 0) s.cd--;
  }
  fireArtifactEvent('wave_end', { wave: state.wave });
  // Boon every 5 waves — otherwise encounter every 3 waves (3,6,9,12...)
  if (state.wave > 0 && state.wave % 5 === 0) {
    setTimeout(() => showBoonPick(), 400);
  } else if (state.wave > 0 && state.wave % 3 === 0) {
    setTimeout(() => showEncounter(), 400);
  }
  // Refresh Scouts preview after possibly state-changing wave-end hooks.
  ensureScoutedWaves();
  renderScoutsPanel();
  updateTopBar();
  if (state.wave > meta.bestWave) meta.bestWave = state.wave;
  saveMeta();

}

function loadMeta() {
  try {
    const raw = localStorage.getItem('tower_meta');
    if (!raw) { migrateMetaSchema(); return; }
    const obj = JSON.parse(raw);
    Object.assign(meta, obj);
  } catch(e) {}
  migrateMetaSchema();
}
function saveMeta() {
  try { localStorage.setItem('tower_meta', JSON.stringify(meta)); } catch(e) {}
}

    nextWaveFireRateBuff: 0,
    time: 0, scoutsUnlocked: false, scoutedWaves: [], _freePlacing: false,
    // Artifact / encounter / curse state — reset per run
    artifacts: [], artifactCache: {}, artifactState: {},

    curseCostMul: 1, curseEnemySpeed: 0, curseLifeDrain: false, curseBossElite: false, curses: [],

  });

  state.grid = m.grid;
  state.path = pathToPixels(m.path);
  state.pathSegments = m.secondary ? [pathToPixels(m.secondary.points)] : [];
  state.features = m.features || [];
  state.hazards = m.hazards || [];
  state.archetype = m.archetype || '';
  state.mapVariant = m.variant || 'classic';
  rebuildArtifactCache();
  // Apply every checked perk at its current level. Multiple perks can be
  // active at once now — buying just unlocks them; checking them in the shop

  const activePerks = (meta.activePool && meta.activePool.perks) ? meta.activePool.perks.slice() : [];

  // apply that one (the migration step also seeds activePool from equippedPerk).
  if (!activePerks.length && state.equippedPerk) activePerks.push(state.equippedPerk);
  for (const k of activePerks) {
    if (!PERK_POOL[k]) continue;
    const lv = getPerkLevel(k) || 1;

  resetRunUi();
  updateTopBar();
  netOnRunStart();
}
// Clears the tape / side card / radial for a new or resumed run.
function resetRunUi() {

  state.selectedTower = null; renderPanel();

  const g = document.getElementById('game'); g.classList.add('ui-snap');

function gameOver() {
  if (state.phase !== 'playing') return;
  sfx('gameover');
  killAllStreams();
  clearSavedRun();   // run is over, drop the checkpoint
  state.camera.shakeAmt = 20;
  state.phase = 'gameover';
  endRun(true);
  netHostEnd();
}

function endRun(finished) {
  const earned = Math.max(1, (state.wave || 0) * 2);
  meta.shards += earned;
  meta.runs = (meta.runs || 0) + 1;
  const prevBest = meta.bestWave || 0;
  if (state.wave > meta.bestWave) meta.bestWave = state.wave;
  saveMeta();
  // Summary: tiles, two whole-run graphs, relics, shards
  const wave = state.wave || 0, era = eraOf(Math.max(1, wave)), hist = state._runHist || [];
  const tile = (k, v, note) => `<div class="go-stat"><div class="k">${k}</div><div class="v">${v}</div>${note ? `<div class="n">${note}</div>` : ''}</div>`;
  const graph = (label, vals, fmt) => vals.length < 2 ? '' : `<div class="go-graph"><div class="gh"><span class="lbl">${label}</span><span class="num">${fmt(Math.max(...vals))} peak</span></div>${lineChart(vals, 380, 54, { fill: true, zero: true })}<div class="gx"><span>W${hist[0].w}</span><span>W${hist[hist.length - 1].w}</span></div></div>`;
  const muts = state.activeMutators.map(k => `<span class="chip">${MUTATOR_POOL[k].name}</span>`).join('');
  const html = `
    <h2>${finished ? 'The core fell' : 'Run abandoned'}</h2>
    <div class="sub">${finished ? 'Overrun' : 'You walked away'} at wave <strong>${wave}</strong> · Era ${eraNumeral(era)}, the ${ERA_FAMILIES[era % ERA_FAMILIES.length]}. The tower remembers.</div>
    <div id="gameover-stats">
      ${tile('Wave reached', wave, wave > prevBest ? '<b class="best">New best</b>' : `best ${prevBest}`)}
      ${tile('Towers built', state.towersBuilt)}
      ${tile('Gold earned', '$' + fmtMoney(state.goldEarned))}
      ${tile('Lives left', Math.max(0, state.lives))}
      ${tile('Relics', (state.artifacts || []).length)}
      ${tile('Era', eraNumeral(era), ERA_FAMILIES[era % ERA_FAMILIES.length])}
    </div>
    ${hist.length > 1 ? `<div class="go-graphs">${graph('Funds at wave start', hist.map(h => h.g), v => '$' + k1(v))}${graph('Team DPS at wave start', hist.map(h => h.d), v => k1(v))}</div>` : ''}
    ${muts ? `<div class="go-muts"><span class="lbl">Mutators</span>${muts}</div>` : ''}
    ${state.artifacts && state.artifacts.length ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;justify-content:center;">${state.artifacts.map(a => `<div class="art-chip" style="--rc:${ARTIFACT_RARITY[a.rarity].color};position:static;">${a.icon||'◆'}</div>`).join('')}</div>` : ''}
    <div class="shards-earned">Shards earned<span class="big">+${earned}</span>Total: ${meta.shards}</div>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="ctrl primary" id="go-again">New Run</button>
      <button class="ctrl" id="go-menu">Main Menu</button>
    </div>
  `;
  const modal = showModalHTML(html, finished ? 'var(--bad)' : 'var(--faint)');
  modal.querySelector('#go-again').onclick = () => { hideModal(); startRun(); };
  if (NET.role === 'guest') { const b = modal.querySelector('#go-again'); b.textContent = 'Host starts the next run'; b.disabled = true; b.classList.remove('primary'); }
  modal.querySelector('#go-menu').onclick = () => {
    // Hard stop on the way back to the main menu — kill any in-flight tower
    // tones, suspend the AudioContext (any decaying per-shot sound stops
    // dead), reset transient run state. tick() early-returns once
    // state.phase is 'menu' so no more sim work runs underneath the menu.
    if (NET.role === 'guest') netLeave(true); else netHostToMenu();
    killAllStreams();
    if (typeof audioCtx !== 'undefined' && audioCtx && typeof audioCtx.suspend === 'function') {
      try { audioCtx.suspend(); } catch (e) {}
    }
    hideModal();
    state.phase = 'menu'; closeBuildRadial();
    state.paused = false;
    state.scoutsUnlocked = false;       // hide leftover preview when returning to menu
    state.scoutedWaves = [];
    renderScoutsPanel();
    document.getElementById('menu').style.display = 'flex';
    refreshMenu();
  };
}

// =====================================================================
// CODEX THUMBNAILS — each entry is a little window onto the salt flat with
// the real piece standing in it (same drawTower / enemy sprites as the board,
// same sun and shadow), so the codex always matches what you see in a run.
// =====================================================================
function _thumbGround(g, w, h) {
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'destination-over';
  const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#f8f2e6'); gr.addColorStop(1, '#e8dcc8');
  g.fillStyle = gr; g.fillRect(0, 0, w, h); g.restore();
}
function _sizeThumb(canvas) {
  const dpr = Math.min(2, window.devicePixelRatio || 1), css = 48;
  if (canvas.width !== css * dpr) { canvas.width = css * dpr; canvas.height = css * dpr; }
  return dpr;
}
// Enemy body + its swept shadow, centred, at the codex family's look.
function paintEnemyThumb(canvas, type, fam, ring) {
  const dpr = _sizeThumb(canvas), g = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
  const def = ENEMY_DEFS[type] || {}, e = { type, size: def.size };
  // The board's low sun throws shadows 3× a piece's height — right for the
  // flats, too much for a 48px window. Thumbs get a short, hard sweep of the
  // body's own silhouette instead, so the piece reads first.
  const bodyR = (def.size || 11) * 1.15, f = Math.min(2.6, 48 * 0.58 / (bodyR * 2)) * dpr;
  const sp = SW.enemySprite(fam, e, 14, 0, f), len = Math.min(sp.top * 0.9, bodyR * 1.1) * f;
  const sx = SUN.x * len / Math.hypot(SUN.x, SUN.y), sy = SUN.y * len / Math.hypot(SUN.x, SUN.y);
  const cx = w / 2 - sx * 0.4, cy = h / 2 - sy * 0.4, ox = cx - sp.reach * f, oy = cy - sp.reach * f;
  const tmp = SW.mk(w, h), tg = tmp.getContext('2d');
  for (let i = 1, n = Math.max(4, Math.ceil(len / 1.5)); i <= n; i++) tg.drawImage(sp.body, ox + sx * i / n, oy + sy * i / n);
  tg.globalCompositeOperation = 'source-in'; tg.fillStyle = `rgb(${LOOK.sh})`; tg.fillRect(0, 0, w, h);
  g.globalAlpha = LOOK.sa; g.drawImage(tmp, 0, 0); g.globalAlpha = 1;
  g.drawImage(sp.body, ox, oy);
  if (ring) {
    const rr = bodyR * f + 3 * dpr, bx = Math.cos(-Math.PI / 4) * rr, by = Math.sin(-Math.PI / 4) * rr;
    g.save(); g.translate(cx, cy); g.strokeStyle = ring.color; g.lineWidth = 1.2 * dpr;
    g.beginPath(); g.arc(0, 0, rr, 0, Math.PI * 2); g.stroke();
    // little tag where the ring crosses up-right: white chip, elite colour rim, ink glyph
    g.fillStyle = '#fffaf1'; g.beginPath(); g.arc(bx, by, 5.5 * dpr, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = INK; g.font = `700 ${7 * dpr}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ring.icon, bx, by + 0.3 * dpr); g.restore();
  }
  _thumbGround(g, w, h);
}
function paintCodexCanvases(modal) {
  modal.querySelectorAll('canvas.codex-canvas').forEach(canvas => {
    const kind = canvas.dataset.kind, key = canvas.dataset.key;
    try {
      if (kind === 'tower') {
        _sizeThumb(canvas);
        renderTowerIcon(canvas, key, +canvas.dataset.level || 1, { zoom: 0.8, cx: 0.44, cy: 0.42 });
        _thumbGround(canvas.getContext('2d'), canvas.width, canvas.height);
      } else if (kind === 'enemy') {
        paintEnemyThumb(canvas, key === 'naturalBoss' ? 'boss' : key, canvas.dataset.fam || ERA_FAMILIES[0]);
      } else if (kind === 'elite') {
        const el = ELITE_MODIFIERS[key];
        if (el) paintEnemyThumb(canvas, 'runner', canvas.dataset.fam || ERA_FAMILIES[0], el);
      }
    } catch (err) { /* thumbnails are cosmetic */ }
  });
}

// CODEX — discovery-gated bestiary + tower reference. Populated by the
// recordCodexDiscovery() calls scattered through spawnEnemy/buildTower/branch
// pick. Only shows entries for things the player has actually seen.
function recordCodexDiscovery(kind, key) {
  if (!key) return;
  if (!meta.codex || typeof meta.codex !== 'object') meta.codex = {};
  meta.codex[kind] = meta.codex[kind] || {};
  if (!meta.codex[kind][key]) {
    meta.codex[kind][key] = true;
    saveMeta();
  }
}

}

let _codexTab = 'towers', _codexEra = null;
const CODEX_ENEMIES = ['runner','tank','swarm','shielded','healer','sprinter','brute','juggernaut','wraith','boss','naturalBoss'];
function showCodex() {

    </div>`;
  const chip = (label, val) => `<span class="chip"><b>${label}</b>${val}</span>`;

    body = CODEX_ENEMIES.map(key => {

      const desc = e.dmgReduction ? `Takes ${Math.round(e.dmgReduction*100)}% less damage, ${Math.round(e.speedMul*100)}% speed`
                : e.hpMul         ? `${e.hpMul}× HP, ${Math.round(e.speedMul*100)}% speed${e.slowImmune ? ', immune to slows' : ''}`
                : e.speedMul && e.speedMul > 1 ? `${e.speedMul}× speed`
                : e.regenPct      ? `Regenerates ${Math.round(e.regenPct*100)}% HP per second`
                : e.onDeathSplit  ? `Splits into ${e.onDeathSplit} runners on death`
                : e.auraRadius    ? `Enemies within ${e.auraRadius}px take ${Math.round((e.auraDmgReduction || 0) * 100)}% less damage`
                : e.goldMulBonus  ? `Drops ${e.goldMulBonus}× gold; steals $${e.stealGold || 0} if it leaks`
                : e.teleportEvery ? `Jumps ${e.teleportTiles || ''} tiles forward every ${e.teleportEvery}s`
                : e.phaseEvery    ? `Invulnerable for ${e.phaseDuration || 1}s every ${e.phaseEvery}s`
                : e.towerOfflineOnKill ? `The tower that kills it goes offline for ${e.towerOfflineOnKill}s`
                : '';
      return `<div class="codex-item">
        <canvas class="codex-canvas" data-kind="elite" data-key="${k}" data-fam="${fam}"></canvas>
        <div class="codex-meta">
          <div class="codex-name"><span class="el-dot" style="background:${e.color}"></span>${e.name}</div>
          <div class="codex-desc">${desc}</div>
        </div>
      </div>`;
    }).join('');
  }

  const html = `
    <h2>Codex</h2>
    <div class="sub">Everything you've met on the flats. Entries unlock as you find them in a run.</div>
    ${tabBtns}
    ${extra}
    <div class="codex-grid">${body || '<div class="codex-empty">Nothing discovered yet. Start a run to begin filling this in.</div>'}</div>
    <div class="modal-actions">
      <button class="ctrl" id="codex-close">Close</button>
    </div>
  `;
  const modal = showModalHTML(html);
  modal.querySelector('#codex-close').onclick = () => hideModal();
  modal.querySelectorAll('.shop-tab').forEach(b => b.onclick = () => { _codexTab = b.dataset.t; showCodex(); });
  modal.querySelectorAll('.codex-era[data-era]').forEach(b => b.onclick = () => { _codexEra = +b.dataset.era; showCodex(); });
  paintCodexCanvases(modal);
}

function refreshMenu() {
  if (typeof netUi === 'function') netUi();
  document.getElementById('mm-best').textContent = meta.bestWave || 0;
  document.getElementById('mm-shards').textContent = meta.shards || 0;
  document.getElementById('mm-runs').textContent = meta.runs || 0;
  // (Perks line removed — active perks already show with their levels in the
  //  shard shop's Perks tab, so the menu summary was redundant.)
  // Resume button — only shown when there's a checkpointed run to pick back up
  const resumeBtn = document.getElementById('mm-resume');
  if (resumeBtn) {
    if (hasSavedRun()) {
      resumeBtn.style.display = '';
      try {
        const save = JSON.parse(localStorage.getItem(SAVE_KEY));
        if (save && save.wave) resumeBtn.querySelector('.mm-resume-lbl').textContent = `Resume Run · Wave ${save.wave}`;
      } catch(e) {}
    } else {
      resumeBtn.style.display = 'none';
    }
  }
}

let _shopTab = 'mutators';
function showShop() {
  // Pool counters in the tab labels — at-a-glance sense of what's active.
  const counts = {
    mutators: (meta.activePool?.mutators || []).length,
    maps:     (meta.activePool?.maps     || []).length,
    perks:    (meta.activePool?.perks    || []).length
  };
  const tabBtns = `
    <div class="shop-tabs">
      <button class="shop-tab ${_shopTab==='mutators'?'active':''}" data-t="mutators">Mutators <span class="tab-count">${counts.mutators}</span></button>
      <button class="shop-tab ${_shopTab==='maps'?'active':''}"     data-t="maps">Map Variants <span class="tab-count">${counts.maps + 1}</span></button>
      <button class="shop-tab ${_shopTab==='perks'?'active':''}"    data-t="perks">Starting Perks <span class="tab-count">${counts.perks}</span></button>
    </div>`;

  // Helper: render a checkbox-style toggle. Clicking the checkbox toggles
  // pool inclusion without buying. Clicking elsewhere on the card buys / levels up.
  // The +1 added to maps is for Classic, which is alwaysUnlocked and always pooled.
  const makeCheck = (cat, k, checked, locked) => {
    const cls = (locked ? 'locked ' : '') + (checked ? 'on' : 'off');
    const tip = locked ? 'Buy to unlock' : (checked ? 'In pool — click to remove' : 'Owned — click to add to pool');
    return `<div class="pool-check ${cls}" data-cat="${cat}" data-k="${k}" title="${tip}">${checked ? '✓' : ''}</div>`;
  };

  let gridHtml = '';

  if (_shopTab === 'mutators') {
    const items = Object.keys(MUTATOR_POOL).map(k => {
      const m = MUTATOR_POOL[k];
      const owned = m.startUnlocked || (meta.unlocked.mutators || []).includes(k);
      const inPool = m.startUnlocked || isInPool('mutators', k);
      return { k, m, owned, inPool, locked: m.startUnlocked };
    });
    gridHtml = items.map(it => {
      const stacks   = getMutatorStacks(it.k);
      const nextCost = getMutatorNextCost(it.k);
      const canAfford = !it.locked && meta.shards >= nextCost;
      const cls = (it.owned && it.inPool) ? 'unlocked in-pool'
                : it.owned                  ? 'unlocked'
                : canAfford                 ? 'locked affordable'
                                            : 'locked';
      // Owned mutators are repurchasable — each buy adds another roll-pool
      // weight (so a mutator bought 3× is 3× as likely to be picked).
      const priceText = it.locked
        ? '★ Always available'
        : it.owned
          ? `Buy +1 weight · ${nextCost} shards`
          : `${nextCost} shards`;
      const tagText = it.locked
        ? 'Mutator'
        : it.owned
          ? `Mutator · ×${stacks} ${it.inPool ? '(in pool)' : '(not in pool)'}`
          : 'Mutator';
      const check = it.owned ? makeCheck('mutators', it.k, it.inPool, it.locked) : '';
      return `
      <div class="shop-item ${cls}" data-cat="mutators" data-k="${it.k}">
        ${check}
        <div class="cat">${tagText}</div>
        <h4>${it.m.name}</h4>
        <div class="desc">${it.m.desc}</div>
        <div class="price">${priceText}</div>
      </div>`;
    }).join('');
  } else if (_shopTab === 'maps') {
    const items = Object.keys(MAP_VARIANTS).map(k => {
      const m = MAP_VARIANTS[k];
      const owned = m.alwaysUnlocked || (meta.unlocked.maps || []).includes(k);
      const inPool = m.alwaysUnlocked || isInPool('maps', k);
      return { k, m, owned, inPool, locked: !!m.alwaysUnlocked };
    });
    gridHtml = items.map(it => {
      const stacks   = getMapStacks(it.k);
      const nextCost = getMapNextCost(it.k);
      const canAfford = !it.locked && meta.shards >= nextCost;
      const cls = (it.owned && it.inPool) ? 'unlocked in-pool'
                : it.owned                  ? 'unlocked'
                : canAfford                 ? 'locked affordable'
                                            : 'locked';
      const priceText = it.locked
        ? '★ Always available'
        : it.owned
          ? `Buy +1 weight · ${nextCost} shards`
          : `${nextCost} shards`;
      const tagText = it.locked
        ? 'Map Variant'
        : it.owned
          ? `Map · ×${stacks} ${it.inPool ? '(in pool)' : '(not in pool)'}`
          : 'Map Variant';
      const check = it.owned ? makeCheck('maps', it.k, it.inPool, it.locked) : '';
      return `
      <div class="shop-item ${cls}" data-cat="maps" data-k="${it.k}">
        ${check}
        <div class="cat">${tagText}</div>
        <h4>${it.m.name}</h4>
        <div class="desc">${it.m.desc}</div>
        <div class="price">${priceText}</div>
      </div>`;
    }).join('');
  } else if (_shopTab === 'perks') {
    // Perks are stackable AND poolable: buy raises level, check adds to the
    // run's active perk set. All active perks apply on run start.
    const items = Object.keys(PERK_POOL).map(k => ({
      k,
      m: PERK_POOL[k],
      level: getPerkLevel(k),
      nextCost: getPerkNextCost(k),
      inPool: isInPool('perks', k)
    }));
    gridHtml = items.map(it => {
      const owned = it.level > 0;
      const canAfford = meta.shards >= it.nextCost;
      const curDesc  = owned ? getPerkDesc(it.k, it.level)     : getPerkDesc(it.k, 1);
      const nextDesc = owned ? getPerkDesc(it.k, it.level + 1) : null;
      const tag = it.inPool && owned
        ? `Active · Lv ${it.level}`
        : owned ? `Owned · Lv ${it.level}` : 'Starting Perk';
      const stateClass = (owned && it.inPool) ? 'unlocked in-pool'
                       : owned                  ? 'unlocked'
                       : canAfford               ? 'locked affordable'
                                                 : 'locked';
      const hint = owned
        ? `<div class="hint" style="opacity:0.7;font-size:11px;margin-top:4px;">Click card to buy +1 lvl · click ✓ to ${it.inPool ? 'remove from' : 'add to'} pool</div>`
        : `<div class="hint" style="opacity:0.7;font-size:11px;margin-top:4px;">Click to buy</div>`;
      const check = owned ? makeCheck('perks', it.k, it.inPool, false) : '';
      return `
      <div class="shop-item ${stateClass}" data-cat="perks" data-k="${it.k}">
        ${check}
        <div class="cat">${tag}</div>
        <h4>${it.m.name}</h4>
        <div class="desc">${curDesc}</div>
        ${nextDesc ? `<div class="desc" style="opacity:0.7;font-size:12px;margin-top:2px;color:#9fc0ff;">Next lvl: ${nextDesc}</div>` : ''}
        <div class="price" style="${canAfford ? '' : 'opacity:0.55;'}">${it.nextCost} shards · Lv ${it.level} → ${it.level + 1}</div>
        ${hint}
      </div>`;
    }).join('');
  }

  const html = `
    <h2>◆ Shard Shop</h2>
    <div class="sub">Spend shards to unlock. <strong>Buy again</strong> to stack — each purchase scales cost (×1.75) and adds another roll-pool weight (perks scale their effect, mutators/maps boost their odds). <strong>Check ✓</strong> to gate which items get rolled. You have <span style="color:#6e4fbf;font-weight:800;">${meta.shards}</span> shards.</div>
    ${tabBtns}
    <div class="shop-grid">${gridHtml}</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;">
      <button class="ctrl" id="shop-close">Close</button>
    </div>
  `;
  const modal = showModalHTML(html, '#6e4fbf');   // shard purple — matches the shard icon
  modal.querySelector('#shop-close').onclick = () => hideModal();
  modal.querySelectorAll('.shop-tab').forEach(b => b.onclick = () => { _shopTab = b.dataset.t; showShop(); });

  // Pool checkbox handler — toggles inclusion, doesn't buy. stopPropagation so
  // the card-level click doesn't also fire (which would try to buy).
  modal.querySelectorAll('.pool-check').forEach(el => {
    el.onclick = (ev) => {
      ev.stopPropagation();
      const cat = el.dataset.cat, k = el.dataset.k;
      if (el.classList.contains('locked')) return;  // permanently in pool, no toggle
      const wasIn = isInPool(cat, k);
      setInPool(cat, k, !wasIn);
      sfx(wasIn ? 'hit' : 'coin');   // small audio feedback
      showShop();
      refreshMenu();
    };
  });

  // Card-level click handler — buys (or levels up) the item.
  modal.querySelectorAll('.shop-item').forEach(el => {
    el.onclick = () => {
      const cat = el.dataset.cat, k = el.dataset.k;
      if (cat === 'mutators') {
        const m = MUTATOR_POOL[k]; if (!m) return;
        // startUnlocked items are permanently free + always pooled — no buys.
        if (m.startUnlocked) return;
        const cost = getMutatorNextCost(k);
        if (meta.shards >= cost) {
          meta.shards -= cost;
          meta.stacks.mutators[k] = (meta.stacks.mutators[k] || 0) + 1;
          if (!(meta.unlocked.mutators || []).includes(k)) (meta.unlocked.mutators ||= []).push(k);
          setInPool('mutators', k, true);   // auto-check on purchase
          saveMeta();
          sfx('boon');
          showShop();
        }
      } else if (cat === 'maps') {
        const m = MAP_VARIANTS[k]; if (!m) return;
        // Classic is always available — no buys.
        if (m.alwaysUnlocked) return;
        const cost = getMapNextCost(k);
        if (meta.shards >= cost) {
          meta.shards -= cost;
          meta.stacks.maps[k] = (meta.stacks.maps[k] || 0) + 1;
          if (!(meta.unlocked.maps || []).includes(k)) (meta.unlocked.maps ||= []).push(k);
          setInPool('maps', k, true);       // auto-check on purchase
          saveMeta();
          sfx('boon');
          showShop();
        }
      } else if (cat === 'perks') {
        const p = PERK_POOL[k]; if (!p) return;
        const lv = getPerkLevel(k);
        const cost = getPerkNextCost(k);
        if (meta.shards >= cost) {
          meta.shards -= cost;
          meta.perkLevels[k] = lv + 1;
          if (!(meta.unlocked.perks || []).includes(k)) (meta.unlocked.perks ||= []).push(k);
          setInPool('perks', k, true);      // auto-check on purchase
          saveMeta();
          sfx('boon');
          showShop();
          refreshMenu();
        }
      }
    };
  });
}

// Schema migration — if old `unlocked` was a flat array of mutator ids, convert it.
function migrateMetaSchema() {
  if (Array.isArray(meta.unlocked)) {
    meta.unlocked = { mutators: meta.unlocked.slice(), maps: [], perks: [] };
  } else if (!meta.unlocked || typeof meta.unlocked !== 'object') {
    meta.unlocked = { mutators: [], maps: [], perks: [] };
  } else {
    meta.unlocked.mutators ||= [];
    meta.unlocked.maps ||= [];
    meta.unlocked.perks ||= [];
    // Convert truthy key->bool pattern to flat array (legacy format from earlier build)
    for (const k of Object.keys(meta.unlocked)) {
      if (!['mutators','maps','perks'].includes(k) && meta.unlocked[k] === true) {
        if (!meta.unlocked.mutators.includes(k)) meta.unlocked.mutators.push(k);
        delete meta.unlocked[k];
      }
    }
  }
  if (meta.equippedPerk === undefined) meta.equippedPerk = null;
  state.equippedPerk = meta.equippedPerk || null;
  // Perk levels — replaces meta.unlocked.perks[] with stackable counts.
  // Each entry in the legacy array becomes level 1; later buys scale up.
  if (!meta.perkLevels || typeof meta.perkLevels !== 'object') meta.perkLevels = {};
  for (const k of (meta.unlocked.perks || [])) {
    if (!meta.perkLevels[k]) meta.perkLevels[k] = 1;
  }
  // Active pool — items toggled "in pool" so the run-start picker considers
  // them. Buying always auto-checks; the player can later uncheck owned items
  // they don't want rolled. Backfill: every owned item is auto-checked once.
  if (!meta.activePool || typeof meta.activePool !== 'object') meta.activePool = {};
  meta.activePool.mutators ||= [];
  meta.activePool.maps     ||= [];
  meta.activePool.perks    ||= [];
  for (const k of (meta.unlocked.mutators || [])) if (!meta.activePool.mutators.includes(k)) meta.activePool.mutators.push(k);
  for (const k of (meta.unlocked.maps     || [])) if (!meta.activePool.maps    .includes(k)) meta.activePool.maps.push(k);
  // Perks — if a legacy equippedPerk existed, treat it as the only "active" one.
  if (meta.equippedPerk && !meta.activePool.perks.includes(meta.equippedPerk)) {
    meta.activePool.perks.push(meta.equippedPerk);
  }
  // Mutator / map stack counts — each repeat purchase bumps the count and
  // adds another weight in the run-start roll pool (so a mutator bought 3x
  // is 3x as likely to roll). Owned items default to 1 stack on first
  // migration so existing saves don't lose anything.
  if (!meta.stacks || typeof meta.stacks !== 'object') meta.stacks = {};
  meta.stacks.mutators ||= {};
  meta.stacks.maps     ||= {};
  for (const k of (meta.unlocked.mutators || [])) {
    if (!meta.stacks.mutators[k]) meta.stacks.mutators[k] = 1;
  }
  for (const k of (meta.unlocked.maps || [])) {
    if (!meta.stacks.maps[k]) meta.stacks.maps[k] = 1;
  }
}

// Pool helpers — single source of truth for "is this item in the run pool?"
function isInPool(cat, k) {
  return !!(meta.activePool && (meta.activePool[cat] || []).includes(k));
}
function setInPool(cat, k, on) {
  if (!meta.activePool) meta.activePool = { mutators: [], maps: [], perks: [] };
  meta.activePool[cat] ||= [];
  const arr = meta.activePool[cat];
  const i = arr.indexOf(k);
  if (on && i < 0) arr.push(k);
  else if (!on && i >= 0) arr.splice(i, 1);
  saveMeta();
}

// Main menu button handlers — wrapped so any startup issue surfaces in console
// instead of silently breaking the menu.
function onMenuStart() {
  if (NET.role === 'guest') { showCoop(); return; }
  try {
    // Starting a fresh run discards any saved checkpoint (it's about to be
    // overwritten anyway, but better to be explicit).
    clearSavedRun();
    ensureAudio();
    startRun();
  }
  catch (e) { console.error('Run start failed:', e); alert('Failed to start run: ' + e.message); }
}
function onMenuResume() {
  if (NET.role === 'guest') { showCoop(); return; }
  try {
    ensureAudio();
    if (!resumeSavedRun()) alert('Could not load saved run.');
  } catch (e) { console.error('Resume failed:', e); alert('Resume failed: ' + e.message); }
}
function onMenuShop() {
  try { showShop(); }
  catch (e) { console.error('Shop failed:', e); alert('Failed to open shop: ' + e.message); }
}
function onMenuCodex() {
  try { showCodex(); }
  catch (e) { console.error('Codex failed:', e); alert('Failed to open codex: ' + e.message); }
}
function onMenuExportLog() {
  try { showLogExport(); }
  catch (e) { console.error('Export failed:', e); alert('Export failed: ' + e.message); }
}

// ============================================================================
// SIMULATION HARNESS — headless tower DPS sweep
// ============================================================================
// Runs the game's REAL combat code (computeTowerStats / damage / projectiles /
// AOE / chain / pierce — same code path as a live game) against controlled
// dummy enemies for every (type × branch × sub × level × buffState × test).
// Outputs a JSON file with single-target DPS, group/AOE DPS, and the tower's
// effective range at each config. Used to drive data-backed rebalance work.
//
// Design points:
// - Snapshots & restores `state` in-place (state is const, can't reassign).
//   Save the dynamic arrays + key flags, mutate, restore at the end.
// - `state._simMode = true` short-circuits the auto-log so sim trials don't
//   pollute _BAL_LOG.
// - Dummy enemies have `_isDummy: true` and `hp = Infinity` so updateEnemies
//   skips path movement / leak logic and damage just accumulates.
// - The inner loop calls `tick(dt)` directly so projectiles, AOEs, chains,
//   pierce, slows, burns — every combat mechanic — all run normally.
// - Yields to the browser between configs via `await new Promise(rAF)` so the
//   page doesn't lock up during the ~10k-trial sweep.

const SIM_TRIAL_DURATION = 5;        // seconds of simulated combat per trial
const SIM_TRIAL_DT       = 1/60;     // fixed sim step
const SIM_TRIAL_FRAMES   = Math.round(SIM_TRIAL_DURATION / SIM_TRIAL_DT);
const SIM_TOWER_X        = 400;      // sim-mode tower placement (arbitrary, away from origin)
const SIM_TOWER_Y        = 400;
const SIM_BUFF_STATES    = ['naked', '+1 beacon', '+2 beacons', '+5 artifacts', 'full'];
// Standard 5-artifact stack used by the player in their actual logs.
const SIM_ARTIFACT_STACK = {
  goldMul: 0.10,            // scavenger
  rangeFlat: 48,            // stoneCore
  fireRateMul: 0,
  teslaChainsBonus: 0,
  splashMul: 0.20,          // flashPowder
  sentryCritBonus: 0,
  frostDmgFlat: 0,
  chilledDmgBonus: 0.10,    // snowglobe
  chainBonus: 1,            // conductor
  deepSlowDmgMul: 1,
  shieldedPierce: 0,
  cannonDoubleFire: 0,
  sentrySilentCrit: 0,
  resonanceAdjacent: 0,
  monolithBonus: 0,
  firstShotCrit: false,
  chronicleEnabled: false,
  auroraActive: false
};

let _simSnapshot = null;

function enterSimMode() {
  if (state._simMode) return;
  // Stash everything the sim will mutate. Mostly the dynamic arrays and the
  // run-state flags. We restore by writing back into `state` (const ref).
  _simSnapshot = {
    towers: state.towers, enemies: state.enemies, projectiles: state.projectiles,
    particles: state.particles, aoes: state.aoes, streams: state.streams,
    iceAuras: state.iceAuras, damageNumbers: state.damageNumbers,
    shardDrops: state.shardDrops, enemiesToSpawn: state.enemiesToSpawn,
    waveInProgress: state.waveInProgress, wave: state.wave, phase: state.phase,
    paused: state.paused, time: state.time, gold: state.gold, lives: state.lives,
    selectedTower: state.selectedTower, artifactCache: state.artifactCache,
    artifacts: state.artifacts, artifactState: state.artifactState,
    mutators: state.mutators, masteries: state.masteries, boons: state.boons,
    features: state.features, hazards: state.hazards,
    autoStartEnabled: state.autoStartEnabled, autoStart: state.autoStart,
    pyrrhicStacks: state.pyrrhicStacks, nextWaveFireRateBuff: state.nextWaveFireRateBuff,
    globalFireRateBonus: state.globalFireRateBonus, globalRangeBonus: state.globalRangeBonus,
    globalDmgBonus: state.globalDmgBonus, perTypeRange: state.perTypeRange,
    firstTowerFree: state.firstTowerFree, firstTowerFreeCount: state.firstTowerFreeCount,
    specialistType: state.specialistType, nextWaveDamageBuff: state.nextWaveDamageBuff,
    showDmgNums: state.showDmgNums, path: state.path, spawnTimer: state.spawnTimer,
    waveInProgressOriginal: state.waveInProgress
  };
  // Build fresh sim arrays / flags. Path is a 2-point throwaway so anything that
  // peeks at state.path doesn't crash; dummies are flagged _isDummy and never
  // walk it anyway.
  state.towers = []; state.enemies = []; state.projectiles = [];
  state.particles = []; state.aoes = []; state.streams = [];
  state.iceAuras = []; state.damageNumbers = []; state.shardDrops = [];
  state.enemiesToSpawn = [];
  state.waveInProgress = true;     // prevents auto-start countdown
  state.wave = 1;
  state.phase = 'playing';
  state.paused = false;
  state.time = 0;
  state.gold = 999999999;
  state.lives = 999999999;
  state.selectedTower = null;
  state.artifactCache = {};
  state.artifacts = [];
  state.artifactState = {};
  state.mutators = {};
  state.masteries = {};
  state.boons = [];
  state.features = [];
  state.hazards = [];
  state.autoStartEnabled = false;
  state.autoStart = 0;
  state.pyrrhicStacks = 0;
  state.nextWaveFireRateBuff = 0;
  state.globalFireRateBonus = 0;
  state.globalRangeBonus = 0;
  state.globalDmgBonus = 0;
  state.perTypeRange = {};
  state.firstTowerFree = false;
  state.firstTowerFreeCount = 0;
  state.specialistType = null;
  state.nextWaveDamageBuff = 0;
  state.showDmgNums = false;
  state.path = [{ x: 0, y: 0 }, { x: 1000, y: 0 }];
  state.spawnTimer = 0;
  state._simMode = true;
  // Make every visual side-effect array a write-blackhole. The arrays still
  // exist (so anything that reads `.length` or iterates them sees an empty
  // collection), but `.push` is a no-op so we don't burn CPU on particle
  // spawns / AOE rings / damage numbers / streams that nobody will see.
  // Restored automatically when exitSimMode reassigns the snapshotted arrays.
  const noop = function () {};
  state.particles.push     = noop;
  state.aoes.push          = noop;
  state.streams.push       = noop;
  state.damageNumbers.push = noop;
  state.shardDrops.push    = noop;
}

function exitSimMode() {
  if (!_simSnapshot) return;
  for (const k of Object.keys(_simSnapshot)) state[k] = _simSnapshot[k];
  _simSnapshot = null;
  delete state._simMode;
  // Bump the per-tick stats cache key so post-sim reads recompute fresh.
  _statsCacheFrame++;
}

// Spawns a stationary infinite-HP dummy at (x,y). Carries enough of the standard
// enemy shape that all combat code (damageEnemy, applySlow, applyChill, burn DoT,
// shielded checks, etc.) works without crashing.
function simSpawnDummy(x, y) {
  const def = ENEMY_DEFS.runner;
  const e = {
    id: Math.random(),
    type: 'runner', def,
    hp: Infinity, maxHp: Infinity,
    speed: 0, baseSpeed: 0, gold: 0,
    progress: 0, pathIdx: 0, _segPos: 0,
    x, y, size: def.size, shape: def.shape, color: def.color,
    flying: false, angle: 0,
    slow: 0, slowDur: 0, stun: 0, burn: null, chilled: 0,
    markedFlash: 0,
    dead: false,
    _isDummy: true
  };
  state.enemies.push(e);
  return e;
}

// Builds a tower at the standard sim position with the given config. Bypasses
// the normal modal-driven branch/sub picker by writing fields directly. Uses
// the real `TOWER_DEFS` shape so computeTowerStats works as in the live game.
function simBuildTower(type, branch, sub, level) {
  const def = TOWER_DEFS[type];
  const t = {
    id: Math.random(), type, gx: 5, gy: 5,
    x: SIM_TOWER_X, y: SIM_TOWER_Y,
    level: 1, branch: null, subbranch: null,
    masteries: [], cooldown: 0, targetMode: 'first',
    angle: 0, firedCount: 0, _lastShot: 0,
    buildAnim: 0, _bloodbathUntil: 0,
    _evoAnimUntil: 0, _evoSparkTimer: 0,
    stageAnims: { core: 0, inner: 0, outer: 0, orbital: 0, branch: 0, sub: 0, mastery: 0 },
    stats: { damageDealt: 0, kills: 0, goldFromKills: 0, bonusGold: 0, totalCost: 0, dpsWindow: [], peakDps: 0, peakSingleTargetDps: 0, maxSingleHit: 0 }
  };
  t.level    = level;
  t.branch   = level >= 5  ? branch : null;
  t.subbranch = level >= 10 ? sub    : null;
  state.towers.push(t);
  return t;
}

// Materialize a buff state by adding beacons / artifact cache / masteries /
// evo level to the world AROUND the primary tower (which has already been
// placed at SIM_TOWER_X,Y). The primary tower is `state.towers[0]`.
function simApplyBuffStack(stack) {
  if (stack === 'naked') return;
  // Beacons go to either side of the main tower so it's in their range.
  if (stack === '+1 beacon' || stack === '+2 beacons' || stack === 'full') {
    const n = stack === '+1 beacon' ? 1 : 2;
    for (let i = 0; i < n; i++) {
      const b = simBuildTower('beacon', 'A', 'A1', 10);
      // Offset so it doesn't overlap the main tower visually (range is 131 at L10)
      b.x = SIM_TOWER_X + (i === 0 ? -60 : 60);
      b.y = SIM_TOWER_Y;
    }
  }
  if (stack === '+5 artifacts' || stack === 'full') {
    state.artifactCache = { ...SIM_ARTIFACT_STACK };
  }
  if (stack === 'full') {
    // Masteries unlock every 5 levels starting at 15. Give the primary tower
    // ONLY the masteries it would actually have at its current level — don't
    // force-bump the level (would break level-specific trials). At L15+ the
    // player typically has at least one +20% damage perk; at L20+, two; etc.
    const lvl = state.towers[0].level;
    const masteryCount = lvl >= 35 ? 5 : lvl >= 30 ? 4 : lvl >= 25 ? 3 : lvl >= 20 ? 2 : lvl >= 15 ? 1 : 0;
    for (let i = 0; i < masteryCount; i++) {
      state.towers[0].masteries.push({ dmg: 0.20 });
    }
    // Evo is derived from tower.level via getEvolution() — no override needed.
  }
}

// Towers whose own DPS column will be ~0 because they're support / debuff —
// for these, the trial ALSO places a "witness" baseline Sentry L5 next to the
// primary so we can read how much the primary BUFFS or DEBUFFS a normal tower
// (witnessDps). Without the witness, a beacon trial just returns 0 forever.
function simNeedsWitness(type) { return type === 'beacon' || type === 'frost'; }

// One sim trial: place primary tower (+ optional witness) + buff state + enemies,
// run SIM_TRIAL_DURATION simulated seconds, return measured stats.
//
// Returned fields:
//   primaryDpsAvg / primaryDpsPeak — DPS of the tower being tested
//   witnessDpsAvg / witnessDpsPeak — DPS of the baseline Sentry L5 next to the
//     primary (only present when simNeedsWitness(type)). For BEACON trials this
//     reads the buff contribution. For FROST trials this reads the slow-ramp +
//     Shatter amplification effect on a normal-fire tower.
//   range — primary tower's effective range AFTER buff stack applied
//   raw* — primary's effective stats (damage, fireRate, splash, chains, crit, pierce)
function runSimTrial(type, branch, sub, level, test, buffStack) {
  // Wipe all per-trial state (these are the only arrays combat code mutates).
  state.towers.length = 0; state.enemies.length = 0;
  state.projectiles.length = 0; state.particles.length = 0;
  state.aoes.length = 0; state.streams.length = 0;
  state.iceAuras.length = 0; state.damageNumbers.length = 0;
  state.shardDrops.length = 0;
  state.artifactCache = {};
  state.time = 0;
  // ---- Primary tower placement ----
  const primary = simBuildTower(type, branch, sub, level);
  _statsCacheFrame++;
  const baseStats = computeTowerStats(primary);
  const baseRange = baseStats.range || 100;
  // Apply buff stack BEFORE placing enemies — some artifacts (Stone Core) add
  // flat range, which should reflect in enemy placement.
  simApplyBuffStack(buffStack);
  _statsCacheFrame++;
  const buffedStats = computeTowerStats(primary);
  const finalRange  = buffedStats.range || baseRange;
  // ---- Optional witness tower for support/debuff towers ----
  let witness = null;
  const wantWitness = simNeedsWitness(type);
  if (wantWitness) {
    // Sentry L5 baseline witness, placed 50 units beside the primary so it
    // shares the same enemy targets and (if applicable) shares beacon range.
    witness = simBuildTower('sentry', null, null, 5);
    witness.x = primary.x + 50;
    witness.y = primary.y - 30;
    _statsCacheFrame++;
  }
  // ---- Enemy placement ----
  // Centered at half-range from the primary tower's BARREL CENTER. Both primary
  // and witness should be able to reach the cluster (witness is offset only
  // 50 units, well within Sentry L5's range of 192 even at base).
  const cx = primary.x + finalRange * 0.5;
  const cy = primary.y;
  if (test === 'single') {
    simSpawnDummy(cx, cy);
  } else if (test === 'group') {
    for (let i = 0; i < 30; i++) {
      const ang = (i / 30) * Math.PI * 2;
      const r   = 12 + (i % 5) * 9;   // 12..48 unit cluster spread
      simSpawnDummy(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
    }
  }
  // ---- Reset per-trial accumulators on every tower we'll measure ----
  for (const t of state.towers) {
    t.stats.damageDealt = 0;
    t.stats.dpsWindow = [];
    t.stats.peakDps = 0;
    t.stats.peakSingleTargetDps = 0;
    t.cooldown = 0;
    t._lastShot = 0;
    t._lastVisualShot = 0;
    t.firedCount = 0;
  }
  // ---- Run the trial — tick() drives all combat ----
  for (let f = 0; f < SIM_TRIAL_FRAMES; f++) tick(SIM_TRIAL_DT);
  // ---- Collect results ----
  const primaryDmg = primary.stats.damageDealt;
  const out = {
    type, branch, sub, level, test, buffStack,
    range:        Math.round(finalRange),
    rawDmg:       Math.round(buffedStats.damage * 10) / 10,
    rawFr:        Math.round(buffedStats.fireRate * 100) / 100,
    rawSplash:    buffedStats.splash    ? Math.round(buffedStats.splash) : 0,
    rawChains:    buffedStats.chains    || 0,
    rawCrit:      buffedStats.critChance ? Math.round(buffedStats.critChance * 100) / 100 : 0,
    rawPierce:    buffedStats.pierce     || 0,
    primaryDmgDealt: Math.round(primaryDmg),
    primaryDpsAvg:   Math.round(primaryDmg / SIM_TRIAL_DURATION),
    primaryDpsPeak:  Math.round(primary.stats.peakDps),
    primaryFired:    primary.firedCount
  };
  if (witness) {
    const wDmg = witness.stats.damageDealt;
    out.witnessType    = 'sentry-L5';
    out.witnessDmgDealt = Math.round(wDmg);
    out.witnessDpsAvg   = Math.round(wDmg / SIM_TRIAL_DURATION);
    out.witnessDpsPeak  = Math.round(witness.stats.peakDps);
  }
  return out;
}

// Drive the full sweep. Iterates all (type × branch × sub × level × buffState
// × test) combinations. Yields between batches via requestAnimationFrame so
// the page stays responsive. Calls onProgress({done, total, label}) as it goes.
async function runFullSimSweep(onProgress) {
  enterSimMode();
  const results = [];
  // Build the work queue. Pre-flatten to know `total` for progress UI.
  const queue = [];
  const types = ['sentry', 'cannon', 'tesla', 'frost', 'beacon'];
  for (const type of types) {
    const def = TOWER_DEFS[type];
    const branchKeys = Object.keys(def.branches || {});
    // For every level from 1 to 40 we pick a config:
    //   L1-L4: base only (no branch yet)
    //   L5-L9: each branch (no sub yet)
    //   L10-L40: each (branch × sub)
    for (let level = 1; level <= 40; level++) {
      if (level < 5) {
        // base only
        for (const test of ['single', 'group']) {
          for (const buffStack of SIM_BUFF_STATES) {
            queue.push({ type, branch: null, sub: null, level, test, buffStack });
          }
        }
      } else if (level < 10) {
        // base + each branch
        for (const branch of branchKeys) {
          for (const test of ['single', 'group']) {
            for (const buffStack of SIM_BUFF_STATES) {
              queue.push({ type, branch, sub: null, level, test, buffStack });
            }
          }
        }
      } else {
        // L10+: every (branch × sub)
        for (const branch of branchKeys) {
          const subKeys = Object.keys(def.branches[branch].subs || {});
          for (const sub of subKeys) {
            for (const test of ['single', 'group']) {
              for (const buffStack of SIM_BUFF_STATES) {
                queue.push({ type, branch, sub, level, test, buffStack });
              }
            }
          }
        }
      }
    }
  }
  const total = queue.length;
  let done = 0;
  const BATCH = 25;        // trials per microtask before yielding to rAF
  for (let i = 0; i < queue.length; i += BATCH) {
    const batch = queue.slice(i, i + BATCH);
    for (const cfg of batch) {
      try {
        const r = runSimTrial(cfg.type, cfg.branch, cfg.sub, cfg.level, cfg.test, cfg.buffStack);
        results.push(r);
      } catch (err) {
        results.push({ ...cfg, error: String(err && err.message || err) });
      }
      done++;
    }
    if (onProgress) {
      const last = batch[batch.length - 1];
      onProgress({ done, total, label: `${last.type}${last.branch ? '.' + last.branch : ''}${last.sub ? '.' + last.sub : ''} L${last.level} ${last.test} ${last.buffStack}` });
    }
    // Yield to the browser so the progress UI repaints + we don't lock up.
    await new Promise(r => requestAnimationFrame(r));
  }
  exitSimMode();
  return results;
}

// Wraps the results in an export-friendly shape and triggers a JSON download.

// future analysts (human or AI) don't need outside context to interpret it.
