<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOWER — Infinite Roguelike Tower Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Stencil+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   STYLE — "salt & sandstone"
   ----------------------------------------------------------------------------
   The world is a sun-bleached salt flat (canvas). Every piece of UI is a
   carved slab of pale sandstone: grainy, inset-lit from the same top-left sun,
   casting the same long shadow as the pieces on the board. Numbers and words
   are stencil-cut; small labels are condensed. Orange is the only accent.
   Layout: wave tape (top) · side card (right) · build radial (on the board).
   ============================================================================ */
:root {
  --ink: #5a3a22; --dim: rgba(90,58,34,0.66); --faint: rgba(90,58,34,0.40); --line: rgba(90,58,34,0.22);
  --or: #cf5216; --or-hi: #e2651f; --good: #4f7f4a; --bad: #c8361c;
  --stone: linear-gradient(160deg, #f7e9d4, #eed8b8);
  --stone-hi: linear-gradient(160deg, #fbf1e2, #f3e2c8);
  --carve: inset 2px 2px 0 rgba(255,242,226,0.65), inset -2px -2px 0 rgba(120,65,35,0.20);
  --drop: 9px 11px 0 rgba(110,62,42,0.18);
  --f: 'Big Shoulders Stencil Display', 'Barlow Condensed', sans-serif;
  --m: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --back: cubic-bezier(0.34, 1.56, 0.64, 1);
  --gap: 12px; --tape-h: 92px; --side-w: 300px;
  --ui: 1;   /* HUD scale, set from the window size by applyUiScale() */
  color-scheme: light;   /* a dark-mode browser must not paint its black defaults behind the stone */
}
/* Every HUD layer scales together so the UI grows with the screen. The canvas
   and the build radial's anchor stay unscaled (they live in board pixels). */
#tape, #side, #hint, #intro, #wave-banner, #era-banner, #elite-banner, #shard-popup, #artifact-popup-stack,
#zoom-chip, #coop-chip, #modal > .modal-content, #net-modal > *, #radial > *, #menu > *:not(#menu-bg), #ftip { zoom: var(--ui); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #f4ece0; color: var(--ink); font-family: var(--m); font-weight: 600; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
#wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
#game { position: relative; flex: 1; overflow: hidden; }
canvas#cv { display: block; background: #f6efe3; cursor: crosshair; }

/* Sandstone slab — shared by every panel */
.slab, #tape, #side, .modal-content, .menu-card, .art-pop, #hint, #wave-banner .band, #era-banner .band, #elite-banner, #shard-popup, #zoom-chip, #coop-chip, .net-modal-note {
  background-image: var(--grain), var(--stone); background-blend-mode: multiply;
  box-shadow: var(--carve), var(--drop);
  border-radius: 4px;
}
.num { font-family: var(--f); font-weight: 800; line-height: 1; letter-spacing: 0.02em; }
.lbl { font-family: var(--m); font-size: 12px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dim); }
.num, .lbl, .carved { text-shadow: 0 1px 0 rgba(255,240,222,0.75), 0 -1px 0 rgba(120,65,35,0.14); }
.or { color: var(--or); }

/* Buttons: small carved tiles; primary = orange enamel */
button.ctrl, .btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--m); font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink); padding: 8px 12px; border: 0; border-radius: 3px; cursor: pointer;
  background-color: #f3e2c8; background-image: var(--grain), var(--stone-hi); background-blend-mode: multiply;
  box-shadow: inset 1.5px 1.5px 0 rgba(255,245,232,0.8), inset -1.5px -1.5px 0 rgba(120,65,35,0.18), 3px 4px 0 rgba(110,62,42,0.16);
  transition: transform .12s var(--ease), color .12s, filter .12s; white-space: nowrap;
}
button.ctrl:hover, .btn:hover { color: var(--or); transform: translateY(-1px); }
button.ctrl:active, .btn:active { transform: translateY(1px); box-shadow: inset 1.5px 1.5px 0 rgba(120,65,35,0.18), inset -1px -1px 0 rgba(255,245,232,0.6); }
button.ctrl svg { width: 13px; height: 13px; }
button.ctrl.active, button.ctrl.on, .btn.on { color: var(--or); box-shadow: inset 2px 2px 0 rgba(120,65,35,0.2), inset -1px -1px 0 rgba(255,245,232,0.7); }
button.ctrl.primary, .btn.fill { color: #fff8ee; background-image: var(--grain), linear-gradient(160deg, #e5692a, #c94d14); text-shadow: 0 1px 0 rgba(90,30,8,0.35);
  box-shadow: inset 1.5px 1.5px 0 rgba(255,210,170,0.55), inset -1.5px -1.5px 0 rgba(90,30,8,0.3), 4px 5px 0 rgba(110,50,25,0.2); }
button.ctrl.primary:hover, .btn.fill:hover { color: #fff; filter: brightness(1.06); }
button.ctrl.danger { color: var(--bad); }
button.ctrl.evo { color: #fff8ee; background-image: var(--grain), linear-gradient(160deg, color-mix(in srgb, var(--ec, #e5692a) 80%, #fff), var(--ec, #c94d14)); text-shadow: 0 1px 0 rgba(0,0,0,0.25); }
button.ctrl.evo.affordable { animation: evoPulse 1.6s ease-in-out infinite; }
@keyframes evoPulse { 50% { filter: brightness(1.12); } }
button.ctrl.gr-ready { color: #fff8ee; background-image: var(--grain), linear-gradient(160deg, #e4b23a, #b9861a); }
button.ctrl:disabled, button.ctrl.gr-cd { opacity: 0.55; cursor: default; transform: none; }

/* ------------------------------------------------------------ WAVE TAPE */
#tape { position: absolute; top: var(--gap); left: var(--gap); right: calc(var(--side-w) + var(--gap) * 2); height: var(--tape-h); overflow: hidden; z-index: 20; }
#tape::before, #tape::after { content: ''; position: absolute; left: 0; right: 0; height: 7px; background: radial-gradient(circle, rgba(90,58,34,0.30) 1.5px, transparent 2px) 0 0 / 18px 7px repeat-x; z-index: 1; pointer-events: none; }
#tape::before { top: 3px; } #tape::after { bottom: 3px; }
#tape .tape-in { position: absolute; inset: 0; }
#tape .head { position: absolute; left: 92px; top: 6px; bottom: 6px; width: 2px; background: var(--or); box-shadow: 0 0 0 3px rgba(207,82,22,0.12); z-index: 3; pointer-events: none; }
.tw { position: absolute; top: 13px; left: 0; width: 158px; height: 66px; margin-left: -12px; padding: 6px 10px; border-radius: 3px;
  background-image: var(--grain), var(--stone-hi); background-blend-mode: multiply;
  box-shadow: inset 1.5px 1.5px 0 rgba(255,245,232,0.8), inset -1.5px -1.5px 0 rgba(120,65,35,0.16), 4px 5px 0 rgba(110,62,42,0.13);
  transition: transform .5s var(--ease), opacity .4s; }
.tw .num { font-size: 26px; }
.tw .comp { position: absolute; right: 9px; top: 8px; display: flex; gap: 6px; font-size: 13px; color: var(--dim); }
.tw .comp .q { letter-spacing: 0.1em; }
.tw small { position: absolute; left: 10px; bottom: 6px; font-size: 11px; letter-spacing: 0.16em; color: var(--dim); }
.tw .bar { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 2px; background: var(--line); overflow: hidden; }
.tw .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--or); }
.tw.now { outline: 1.5px solid var(--or); outline-offset: -1.5px; }
.tw.next { cursor: pointer; } .tw.next small { color: var(--or); }
.tw.next:hover { transform: translateY(-2px); }
.tw.next.go { background-image: var(--grain), linear-gradient(160deg, #e5692a, #c94d14); }
.tw.next.go .num, .tw.next.go small, .tw.next.go .comp { color: #fff8ee; text-shadow: 0 1px 0 rgba(90,30,8,0.35); }
.tw.boss .num { color: var(--or); }
.tw.elite::after { content: '◆ ELITE'; position: absolute; right: 9px; bottom: 6px; font-size: 11px; letter-spacing: 0.16em; color: #8a4fc0; }

/* -------------------------------------------------------------- SIDE CARD */
#side { position: absolute; top: var(--gap); right: var(--gap); bottom: var(--gap); width: var(--side-w); z-index: 20; overflow: hidden; }
.side-eco { position: absolute; inset: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; scrollbar-width: none; transition: transform .38s var(--ease), opacity .3s; }
.side-eco::-webkit-scrollbar { display: none; }
#side.detail .side-eco { transform: translateX(-30%); opacity: 0; pointer-events: none; }
.erow { display: grid; grid-template-columns: 0.8fr 0.8fr 1.4fr; gap: 8px; align-items: end; }
.erow .num { font-size: 32px; transform-origin: left center; display: inline-block; }
.erow .num.pulse { animation: numPulse .45s var(--back); }
.erow .num.pulse.down { animation: numDrop .5s var(--ease); }
@keyframes numPulse { 35% { transform: scale(1.18); } }
@keyframes numDrop { 20% { transform: translateX(-3px); color: var(--bad); } 40% { transform: translateX(3px); } 60% { transform: translateX(-2px); } }
.erow .hp { display: block; font-size: 11px; letter-spacing: 0.12em; color: var(--dim); margin-top: 3px; }
.era { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.era .num { font-size: 18px; color: var(--or); }
.era .lbl { margin-left: auto; }
.era .eb { flex: 1; height: 2px; background: var(--line); position: relative; align-self: center; }
.era .eb i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--or); }
.gblock { display: flex; flex-direction: column; gap: 4px; }
.gh { display: flex; justify-content: space-between; align-items: baseline; }
.gh .num { font-size: 15px; }
.gblock svg { display: block; overflow: visible; }
.dbar { display: grid; grid-template-columns: 92px 1fr 46px; align-items: center; gap: 6px; font-size: 12.5px; letter-spacing: 0.08em; cursor: pointer; padding: 1px 0; }
.dbar em { font-style: normal; color: var(--dim); font-size: 11px; }
.dbar i { height: 4px; background: var(--or); display: block; }
.dbar b { font-family: var(--f); font-weight: 800; font-size: 14px; text-align: right; }
.dbar:hover span { color: var(--or); }
.dempty { font-size: 13px; color: var(--dim); letter-spacing: 0.06em; }
.sect { display: flex; flex-direction: column; gap: 6px; }
.grow { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .55s var(--ease), opacity .45s var(--ease), margin-top .55s var(--ease); }
.grow > .gin { min-height: 0; }
.grow:not(.shown) { grid-template-rows: 0fr; opacity: 0; margin-top: -12px; pointer-events: none; }
.grow:not(.shown) > .gin, .grow.anim > .gin { overflow: hidden; }
.grow.fresh > .gin { animation: growFlash 1.8s var(--ease); }
@keyframes growFlash { 0%, 25% { box-shadow: inset 2px 0 0 var(--or); background: rgba(207,82,22,0.07); } 100% { box-shadow: inset 2px 0 0 rgba(207,82,22,0); background: rgba(207,82,22,0); } }
.first-steps { font-size: 13.5px; line-height: 1.5; color: var(--dim); padding: 9px 11px; border-radius: 3px; box-shadow: inset 1.5px 1.5px 0 rgba(120,65,35,0.12), inset -1px -1px 0 rgba(255,245,232,0.7); }
.first-steps b { color: var(--or); font-weight: 700; }
.first-steps kbd { font-family: var(--f); font-weight: 800; font-size: 12px; padding: 0 4px; border-radius: 2px; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }
#artifacts-bar { display: flex; flex-wrap: wrap; gap: 6px; }
#artifacts-bar:empty::before { content: 'None yet — elites drop them'; font-size: 12.5px; color: var(--faint); letter-spacing: 0.06em; }
.art-chip { --rc: #888; width: 30px; height: 30px; border-radius: 3px; display: grid; place-items: center; font-size: 14px; color: color-mix(in srgb, var(--rc) 55%, var(--ink)); position: relative; cursor: help;
  background-image: var(--grain), var(--stone-hi); background-blend-mode: multiply; box-shadow: inset 0 -2px 0 var(--rc), inset 1.5px 1.5px 0 rgba(255,245,232,0.8), 3px 4px 0 rgba(110,62,42,0.15); }
.art-chip.ready { cursor: pointer; animation: chipReady 1.6s ease-in-out infinite; } @keyframes chipReady { 50% { transform: translateY(-2px); } }
.art-chip.armed { cursor: pointer; outline: 1.5px solid var(--rc); outline-offset: 1px; }
.art-chip.cooldown { opacity: 0.5; }
.art-badge { position: absolute; top: -5px; right: -5px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; font-family: var(--f); font-size: 11px; font-weight: 800; display: grid; place-items: center; color: #fff8ee; background: var(--rc); }
.art-tip, .tooltip, .tip-pop, #ftip { display: none; position: absolute; z-index: 100; width: 230px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; font-weight: 500; letter-spacing: 0.02em; color: var(--ink); text-transform: none; text-align: left; white-space: normal; pointer-events: none;
  background-image: var(--grain), var(--stone-hi); background-blend-mode: multiply; border-radius: 4px; box-shadow: var(--carve), 6px 8px 0 rgba(110,62,42,0.2); }
.art-tip { right: 0; top: calc(100% + 8px); border-top: 2px solid var(--rc); }
.art-tip strong, .tooltip strong, .tip-pop strong, #ftip strong { display: block; font-family: var(--f); font-weight: 800; font-size: 16px; letter-spacing: 0.03em; color: var(--ink); margin-bottom: 2px; }
.art-tip .r, #ftip .r { display: block; font-size: 11px; letter-spacing: 0.16em; color: color-mix(in srgb, var(--rc) 55%, var(--ink)); text-transform: uppercase; }
#mutators-bar { display: flex; flex-wrap: wrap; gap: 6px; }
.mut-chip { position: relative; font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 8px; border-radius: 3px; cursor: help; color: var(--ink);
  background-image: var(--grain), var(--stone-hi); background-blend-mode: multiply; box-shadow: inset 1.5px 1.5px 0 rgba(255,245,232,0.8), inset -1px -1px 0 rgba(120,65,35,0.14); }
.tooltip { right: 0; top: calc(100% + 8px); }
/* One floating tooltip on <body> shows the content of whichever .art-tip / .tooltip / .tip-pop
   is hovered, so nothing gets cut off by the side card edges (see initFloatTip). */
#ftip { position: fixed; left: 0; top: 0; z-index: 400; width: 250px; }
#ftip.show { display: block; animation: tipIn .14s var(--ease); }
#ftip.rc { border-top: 2px solid var(--rc); }
@keyframes tipIn { from { opacity: 0; } to { opacity: 1; } }
.ctlrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ctlrow .seg { display: flex; gap: 3px; }
/* Pinned to the bottom of the card: when relics/mutators pile up, the sections
   above scroll underneath and the controls stay reachable. */
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line);
  position: sticky; bottom: -14px; margin-bottom: -14px; padding-bottom: 14px; z-index: 2;
  background-image: var(--grain), linear-gradient(#efdcbe, #eed8b8); background-blend-mode: multiply; box-shadow: 0 -10px 12px -6px rgba(238,216,184,0.95); }
#side .legacy, .legacy { display: none !important; }

/* Build-up HUD: a run opens on the bare salt flat and each piece arrives the
   first time it matters (growUi() toggles the ui-* classes on #game). The board
   keeps its space reserved, so nothing on it jumps when a panel arrives. */
#tape, #side { transition: transform .65s var(--ease), opacity .5s var(--ease); }
#game.ui-snap #tape, #game.ui-snap #side, #game.ui-snap #intro { transition: none; }
#game:not(.ui-tape) #tape { transform: translateY(calc(-100% - 30px)); opacity: 0; pointer-events: none; }
#game:not(.ui-side) #side { transform: translateX(calc(100% + 30px)); opacity: 0; pointer-events: none; }
#game:not(.ui-ctl) .ctlrow.c-play, #game:not(.ui-auto) #btn-auto { display: none; }
#game.ui-ctl .ctlrow.c-play, #game.ui-auto #btn-auto { animation: fadeUp .5s var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#intro { position: absolute; top: var(--gap); left: var(--gap); right: calc(var(--side-w) + var(--gap) * 2); height: var(--tape-h); z-index: 19;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; pointer-events: none;
  transition: opacity .5s var(--ease), transform .5s var(--ease); }
#intro .t { font-family: var(--f); font-weight: 800; font-size: 26px; letter-spacing: 0.06em; color: var(--ink); text-shadow: 0 1px 0 rgba(255,240,222,0.8); }
#intro .t b { color: var(--or); }
#intro .s { font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
#intro .s kbd { font-family: var(--f); font-weight: 800; padding: 0 5px; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); border-radius: 2px; }
#game:not(.ui-intro) #intro { opacity: 0; transform: translateY(-10px); }

/* Funds where money is being spent: tower card, encounters, boons, branch picks */
.acts-funds { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px; }
.acts-funds b { font-family: var(--f); font-weight: 800; font-size: 20px; color: var(--or); }
.modal-funds { float: right; margin: 2px 0 8px 16px; display: flex; gap: 14px; align-items: baseline; padding: 6px 12px; border-radius: 3px;
  font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); box-shadow: inset 1.5px 1.5px 0 rgba(120,65,35,0.14), inset -1px -1px 0 rgba(255,245,232,0.7); }
.modal-funds b { font-family: var(--f); font-weight: 800; font-size: 20px; letter-spacing: 0.02em; color: var(--or); margin-left: 6px; }
.modal-funds b.lv { color: var(--ink); }
.choice .tag.cost, .choice.colored .tag.cost { font-family: var(--f); font-weight: 800; font-size: 19px; letter-spacing: 0.04em; color: var(--or); }
.choice .need { margin-top: 8px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bad); font-weight: 700; }
.choice.disabled-choice .need { opacity: 1; }

/* Tower detail (slides over the side card) */
#panel { position: absolute; inset: 0; padding: 14px 16px; display: none; flex-direction: column; gap: 10px; overflow-y: auto; scrollbar-width: none;
  background-image: var(--grain), var(--stone); background-blend-mode: multiply; animation: detIn .38s var(--ease); }
#panel::-webkit-scrollbar { display: none; }
@keyframes detIn { from { transform: translateX(40%); opacity: 0; } to { transform: none; opacity: 1; } }
.dh { display: flex; align-items: center; gap: 10px; }
.dh canvas { width: 54px; height: 54px; flex-shrink: 0; }
.dh .t { flex: 1; min-width: 0; }
.dh .t .num { font-size: 28px; }
.dh .lv { text-align: right; } .dh .lv .num { font-size: 30px; }
.dh .x { align-self: flex-start; cursor: pointer; font-size: 15px; color: var(--dim); padding: 0 4px; } .dh .x:hover { color: var(--or); }
.pills { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
.pill { position: relative; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; color: var(--pc, var(--or)); box-shadow: inset 0 0 0 1px var(--pc, var(--or)); cursor: help; }
.tip-pop { left: 0; top: calc(100% + 6px); }
.tip-pop .br-label, #ftip .br-label { display: block; font-size: 11px; letter-spacing: 0.16em; color: var(--or); text-transform: uppercase; }
.evo-badge { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 9px; border-radius: 3px; box-shadow: inset 0 0 0 1px var(--ec, var(--or)); }
.evo-badge .evo-name { font-family: var(--f); font-weight: 800; font-size: 15px; letter-spacing: 0.08em; color: var(--ec, var(--or)); }
.evo-badge .evo-stats { font-size: 11.5px; letter-spacing: 0.08em; color: var(--dim); }
.track { display: flex; align-items: center; }
.track .nd { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--nc, var(--faint)); flex-shrink: 0; position: relative; cursor: help; }
.track .nd.done { background: var(--nc); }
.track .nd.next { animation: ndp 1.4s ease-in-out infinite; } @keyframes ndp { 50% { box-shadow: inset 0 0 0 1.5px var(--nc), 0 0 0 4px rgba(207,82,22,0.15); } }
.track .sg { flex: 1; height: 2px; background: var(--line); position: relative; } .track .sg i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--or); }
.srow { display: grid; grid-template-columns: 58px 1fr 56px 44px; align-items: center; gap: 6px; }
.srow i { height: 3px; background: var(--line); position: relative; display: block; } .srow i u { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.srow b { font-family: var(--f); font-weight: 800; font-size: 19px; text-align: right; }
.srow em { font-style: normal; color: var(--good); font-size: 12.5px; letter-spacing: 0.04em; }
.srow em.neg { color: var(--bad); }
.srow .bc { display: block; font-size: 11px; color: var(--or); letter-spacing: 0.06em; }
.share { display: grid; grid-template-columns: 52px 1fr 1fr 1fr; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.share .num { font-size: 18px; }
.tabs, .tg { display: flex; gap: 3px; }
.tabs span, .tg span { flex: 1; text-align: center; padding: 6px 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; color: var(--dim); border-radius: 3px; }
.tabs span:hover, .tg span:hover { color: var(--or); }
.tabs span.on, .tg span.on { color: var(--or); box-shadow: inset 1.5px 1.5px 0 rgba(120,65,35,0.18), inset -1px -1px 0 rgba(255,245,232,0.7); }

  background-image: var(--grain), var(--stone-hi); background-blend-mode: multiply;
  box-shadow: inset 1.5px 1.5px 0 rgba(255,245,232,0.85), inset -1.5px -1.5px 0 rgba(120,65,35,0.18), 5px 7px 0 rgba(110,62,42,0.18);
  animation: rpop .32s var(--back) both; transition: transform .14s var(--ease); }

  padding: 7px 14px; font-size: 13.5px; letter-spacing: 0.08em; white-space: nowrap; animation: fadeDown .25s var(--ease); }

/* ---------------------------------------------------------------- MODAL */

  background-color: #f3e2c8; background-image: var(--grain), var(--stone-hi); background-blend-mode: multiply; box-shadow: inset 1.5px 1.5px 0 rgba(255,245,232,0.8), inset -1px -1px 0 rgba(120,65,35,0.16), 3px 4px 0 rgba(110,62,42,0.14); }

.pool-check.on::after { transform: translateX(14px); background: var(--good); }
.pool-check.locked::after { transform: translateX(14px); background: var(--or); } .pool-check.locked { cursor: default; }
.codex-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: calc(54vh / var(--ui)); overflow-y: auto; padding-right: 6px; }

.codex-meta { flex: 1; min-width: 0; }

.codex-name .cost { font-size: 13px; color: var(--or); }

details.codex-more { margin-top: 6px; }

<script>
/* ============================================================================
   TOWER — Infinite Roguelike Tower Defense
   ----------------------------------------------------------------------------
   All balance numbers are centralized here for easy tuning.
   Sections:
     1. CONSTANTS / BALANCE
     2. AUDIO (Web Audio API synthesis)
     3. TOWER DEFINITIONS
     4. ENEMY DEFINITIONS
     5. MUTATOR POOL
     6. BOON POOL
     7. GAME STATE
     8. MAP GENERATION
     9. WAVE GENERATION
    10. TOWER BEHAVIOR
    11. ENEMY BEHAVIOR
    12. PROJECTILES
    13. PARTICLES / FX
    14. UPGRADES & BRANCH LOGIC
    15. UI (DOM)
    16. RENDER (canvas)
    17. INPUT
    18. GAME LOOP
    19. META / SAVE
    20. INIT
   ============================================================================ */

// ============================================================================
// 1. CONSTANTS / BALANCE
// ============================================================================
const GRID_W = 20, GRID_H = 12;            // grid dimensions
const CELL = 48;                            // pixel size per cell
const W = GRID_W * CELL, H = GRID_H * CELL; // canvas logical size

const START_GOLD  = 200;                   // starting gold
const START_LIVES = 20;                    // starting lives (Fortified mutator -> 30)
const AUTO_START_DELAY = 1.5;              // seconds between waves when AUTO toggle is on (semi-insta)
const ENEMY_HP_SCALE   = 1.13;             // base enemy HP multiplier per wave
const ENEMY_GOLD_SCALE = 1.07;             // enemy gold multiplier per wave (was 1.10 — tighter late-game economy)
const LATE_WAVE        = 20;               // wave past which late-game HP scaling kicks in
const LATE_HP_SCALE    = 1.05;             // compound HP *= this per wave past LATE_WAVE (accelerating curve)
const BOSS_HP_TIER     = 1.32;             // boss HP per 10-wave tier (was 1.25)
const SELL_REFUND      = 0.70;             // default sell refund %
const UPGRADE_COST_MULT= 0.80;             // upgrade cost = UPGRADE_COST_MULT * nextLevelBase
const UPGRADE_SCALE    = 1.38;             // per-level cost scale (was 1.35)

// Floating numbers, screen shake tuning. DMG_NUM_LIFE is the per-floater
// stacking window — one bubble per second, accumulating damage that lands
// on the same enemy during its lifetime. New hits AFTER it expires spawn
// a fresh one. Set to 1.0s for "a new number every second."
const DMG_NUM_LIFE = 1.0;
const SHAKE_DECAY  = 6.0;
const PARTICLE_CAP = 400;                  // hard cap particles for perf

// ===== TOWER EVOLUTION =====================================================
// Past level 10, towers grow yellow rings (1 per level). At 5 rings (every
// 5 levels) the rings collapse into the tower with an animation and the
// tower steps up to the next "evolution tier" — a globally-themed body
// color, accent highlight, glow, and optional theatrical mode (facet,
// halo, starfield, hue-cycle). Sub-branch flavor is preserved as the
// inner-core dot via the per-tower SUB_TINTS map below.
const EVO_INTERVAL        = 5;     // levels per evolution cycle
const EVO_RINGS_PER_CYCLE = 5;     // rings shown when a cycle is full
const EVO_ANIM_DURATION   = 0.7;   // seconds — collapse + flash animation length

// Each tier is a self-contained look. Every tier now carries a `mode` so
// it has a distinctive signature flourish (not just a tint):
//   'plates'   — Reinforced bronze armor plates with rivets
//   'facet'    — Crystalline overlapping refraction passes + rotating sparkle
//   'beams'    — Radiant rotating golden light beams
//   'halo'     — Angelic double pulsing halo
//   'stars'    — Void dark vortex + bright pinprick constellation
//   'hueCycle' — Prismatic rainbow hue-rotate body + outer ring
// `shine` (0..1) drives the additive highlight pass + outer glow blur.
// `sparkle` (0..1.5) drives ambient drifting sparks.
const EVO_TIERS = [
  null,                                                                                                                                  // evo 0 — use TOWER_DEFS[type].color
  { label: 'Tempered',    body: '#cd7f32', accent: '#ffe1a8', glow: '#cd7f32', shine: 0.50, sparkle: 0.2, mode: 'plates'   },           // evo 1 — bronze / copper
  { label: 'Crystalline', body: '#7eecff', accent: '#ffffff', glow: '#7eecff', shine: 0.60, sparkle: 0.5, mode: 'facet'    },           // evo 2
  { label: 'Radiant',     body: '#ffd23a', accent: '#fff5b3', glow: '#ffaa00', shine: 0.80, sparkle: 0.8, mode: 'beams'    },           // evo 3 — molten gold beams
  { label: 'Hallowed',    body: '#fffaf0', accent: '#ffe9a3', glow: '#ffd866', shine: 0.95, sparkle: 1.0, mode: 'halo'     },           // evo 4
  { label: 'Eclipse',     body: '#15102a', accent: '#c2a4ff', glow: '#9966ff', shine: 0.75, sparkle: 1.2, mode: 'stars'    },           // evo 5
  { label: 'Iridescent',  body: '#ff8caa', accent: '#ffffff', glow: '#ff66dd', shine: 1.00, sparkle: 1.5, mode: 'hueCycle' }            // evo 6+
];
function getEvolution(level) {
  if (level <= 10) return 0;
  return Math.floor((level - 10) / EVO_INTERVAL);
}
function getRingsForLevel(level) {
  if (level <= 10) return 0;
  const sinceEvo = (level - 10) - getEvolution(level) * EVO_INTERVAL;   // 0..4
  return Math.min(EVO_RINGS_PER_CYCLE, sinceEvo);
}
// True if upgrading from `level` to `level+1` crosses an evolution threshold.
// Used by the panel to show "Evolve" instead of "Upgrade", and by upgradeCost
// to apply the evo cost multiplier on the level that triggers the collapse.
function willEvolveAt(level) {
  return level >= 10 && getEvolution(level + 1) > getEvolution(level);
}
// "Sub-level" within the current evo cycle: 0 immediately after an evo
// (range is at its lowest), 4 right before the next one (range fully back).
// At L11..L14 (pre-evo, evo=0) this returns 1..4 — the "warmup" levels also
// climb the range curve so the very first cycle behaves like the rest.
function getEvoSubLevel(level) {
  if (level <= 10) return 4;   // pre-evo towers play at full range
  return (level - 10) - getEvolution(level) * EVO_INTERVAL;   // 0..4
}
// Range multiplier from the sawtooth. Drops to 0.65× the moment a tower
// evolves, then climbs back to 1.00× over the next 4 upgrades. The big
// damage / fire-rate buff (+35% per evo) more than covers the lost range
// so each evo is still a net power gain even at the bottom of the sawtooth.
function getEvoRangeMult(level) {
  const evo = getEvolution(level);
  if (evo <= 0) return 1;
  const sub = getEvoSubLevel(level);              // 0..4
  return 0.65 + (sub / 4) * 0.35;                 // 0.65 → 1.00
}
function getEvoTier(evo) {
  if (evo <= 0) return null;
  return EVO_TIERS[Math.min(evo, EVO_TIERS.length - 1)];
}
function getEvoOverflowSpeed(evo) {
  // Past evo 6 we keep prismatic mode but ramp the cycle speed slightly.
  return Math.min(2.0, 1.0 + Math.max(0, evo - 6) * 0.10);
}

// Per-tower-per-sub palette so a Sentry-A1 (Minigun) doesn't look like a
// Cannon-A1 (Cluster). Each color is keyed to its sub's flavor within its
// tower's overall theme. Replaces the old universal A1/A2/B1/B2 map.
const SUB_TINTS = {
  'sentry.A1': '#ff5e5e', 'sentry.A2': '#a4b3c4', 'sentry.B1': '#7ee69b', 'sentry.B2': '#ffd866',
  'cannon.A1': '#ffa040', 'cannon.A2': '#cd7f32', 'cannon.B1': '#ff4422', 'cannon.B2': '#ffe066',
  'tesla.A1':  '#9d6bff', 'tesla.A2':  '#e0e0ff', 'tesla.B1':  '#3ab9ff', 'tesla.B2':  '#5af0d6',
  'frost.A1':  '#5099ff', 'frost.A2':  '#e6f7ff', 'frost.B1':  '#a8d8ff', 'frost.B2':  '#d4f0ff',
  'beacon.A1': '#ff6450', 'beacon.A2': '#ffcb47', 'beacon.B1': '#7ee69b', 'beacon.B2': '#9fc0ff'
};
function getSubTint(t) {
  if (!t || !t.subbranch) return null;
  return SUB_TINTS[`${t.type}.${t.subbranch}`] || null;
}

// Colors — brighter palette so the play area feels less cave-dark.
const COL_PATH      = '#2a3656';
const COL_PATH_E    = '#3b4d78';
const COL_SHOULDER  = '#222c47';   // wide-path shoulder tiles (unbuildable but visually distinct from main lane)
const COL_GRID      = '#1e2a44';
const COL_EMPTY     = '#1a2236';
const COL_VALID     = 'rgba(108,160,255,0.28)';
const COL_INVALID   = 'rgba(255,110,130,0.30)';

// ============================================================================
// 2. AUDIO (Web Audio API — no external assets)
// ============================================================================
let audioCtx = null, sfxEnabled = true;
function ensureAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  // Resume the AudioContext if it was suspended (e.g. after Save & Quit)
  // so a fresh / resumed run gets sound back without a page reload.
  if (audioCtx && audioCtx.state === 'suspended' && typeof audioCtx.resume === 'function') {
    try { audioCtx.resume(); } catch(e) {}
  }
}
// Helper: create a short noise burst for snappy thumps.
function makeNoiseBurst(dur, vol, type) {
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    const env = 1 - i / data.length;
    data[i] = (Math.random() * 2 - 1) * env * env;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.value = vol;
  // Optional band-pass to taste
  if (type === 'thump') {
    const f = audioCtx.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 250;
    src.connect(f); f.connect(g);
  } else if (type === 'sizzle') {
    const f = audioCtx.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 1500;
    src.connect(f); f.connect(g);
  } else {
    src.connect(g);
  }
  g.connect(audioCtx.destination);
  src.start();
  return src;
}

// Per-tower plasma sounds. Lower-register fundamentals tuned to an A-minor
// chord so multiple towers firing at once produce harmony, not dissonance:
//   Cannon = A2 (110Hz), Frost = C4 (264Hz), Sentry = E4 (330Hz), Tesla = A4 (440Hz)
// Each shot is an oscillator into a RESONANT LOWPASS that sweeps from open
// → near-fundamental — that's the "pew" plasma timbre. No piercing highs;
// the resonance peak gives sci-fi character without the harshness of bare
// square/sawtooth. Crit accent uses an upper-octave note so it adds harmony.
function playShootSentry(t) {
  // Soft plasma pulse — triangle base + tamer resonance keeps the per-shot
  // gentle so a high-rate burst right before the stream kicks in doesn't sting.
  // Filter sweep still gives a "pew" character without the sharp square buzz.
  const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  o.type = 'triangle';
  o.frequency.setValueAtTime(300, t);
  o.frequency.exponentialRampToValueAtTime(200, t + 0.07);
  f.type = 'lowpass'; f.Q.value = 4;
  f.frequency.setValueAtTime(1200, t);
  f.frequency.exponentialRampToValueAtTime(380, t + 0.10);
  g.gain.setValueAtTime(0.055, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.12);
}
function playShootCannon(t) {
  // A2 deep plasma boom — gentle filter, low Q
  const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(110, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.20);
  f.type = 'lowpass'; f.Q.value = 2;
  f.frequency.value = 380;
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.24);
}
function playShootTesla(t) {
  // Tesla zap — was sawtooth+440Hz with a Q=9 lowpass starting at 2kHz, which
  // parked a sharp resonance peak right in the human ear's most-sensitive
  // band (2-4kHz). At late-game fire rates that turned into a piercing whine.
  // Switched to triangle (only odd harmonics, ~9dB softer than sawtooth),
  // dropped to E4 → A3 (330→220), filter Q 9→2.5, and capped the lowpass so
  // the peak can't climb past 1100Hz.
  const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  o.type = 'triangle';
  o.frequency.setValueAtTime(330, t);
  o.frequency.exponentialRampToValueAtTime(220, t + 0.09);
  f.type = 'lowpass'; f.Q.value = 2.5;
  f.frequency.setValueAtTime(1100, t);
  f.frequency.exponentialRampToValueAtTime(500, t + 0.11);
  g.gain.setValueAtTime(0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.13);
}
function playShootFrost(t) {
  // C4 soft plasma chime — sine carrier already smooth, light filter for warmth
  const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  o.type = 'sine';
  o.frequency.setValueAtTime(264, t);
  o.frequency.exponentialRampToValueAtTime(196, t + 0.14);
  f.type = 'lowpass'; f.Q.value = 3;
  f.frequency.value = 1100;
  g.gain.setValueAtTime(0.10, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.20);
}
function playCrit(t) {
  // Soft accent at E5 → A4 — was A5(880)→E5 which sat in the piercing range.
  // Triangle wave, mild Q=2.5 lowpass, slightly reduced gain.
  const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  o.type = 'triangle';
  o.frequency.setValueAtTime(660, t);
  o.frequency.exponentialRampToValueAtTime(440, t + 0.11);
  f.type = 'lowpass'; f.Q.value = 2.5;
  f.frequency.value = 1300;
  g.gain.setValueAtTime(0.055, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  o.connect(f); f.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.14);
}

// Tower evolution chime — a celebratory ascending sine arpeggio
// (C5 → E5 → G5 → C6) over ~0.45s. Soft lowpass at 1.6kHz so even the
// top note doesn't pierce. Plays once per evolution threshold cross.
function playEvolution(t) {
  const notes = [523.25, 659.25, 783.99, 1046.50];
  const step  = 0.075;
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.Q.value = 1.4; f.frequency.value = 1600;
  const masterG = audioCtx.createGain();
  masterG.gain.value = 1.0;
  f.connect(masterG); masterG.connect(audioCtx.destination);
  for (let i = 0; i < notes.length; i++) {
    const start = t + i * step;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(notes[i], start);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(0.075, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
    o.connect(g); g.connect(f);
    o.start(start); o.stop(start + 0.24);
  }
}

// 'hit' sound throttle — without this, Cluster (4 mini-explosions × N enemies
// each) and other AOE spam would stack 20+ overlapping hits in a single frame
// and shred the player's ears. One hit sound per 60ms is plenty for feedback.
let _lastHitSfxAt = 0;
const HIT_SFX_MIN_GAP = 0.06;
// Crit chime throttle — same reasoning. At late-game fire rates with high
// crit chance, dozens of crits per second would layer the chime to a wall
// of high notes. One per 100ms keeps the "ping" readable.
let _lastCritSfxAt = 0;
const CRIT_SFX_MIN_GAP = 0.10;

function sfx(type) {
  if (!sfxEnabled) return;
  if (state && state._simMode) return;   // Sim sweeps fire thousands of shots — silent.
  ensureAudio();
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // Throttle the high-frequency hit sound to prevent painful stacking on AOE
  if (type === 'hit') {
    if (t - _lastHitSfxAt < HIT_SFX_MIN_GAP) return;
    _lastHitSfxAt = t;
  }
  if (type === 'crit') {
    if (t - _lastCritSfxAt < CRIT_SFX_MIN_GAP) return;
    _lastCritSfxAt = t;
  }
  // Rich tower-specific shoot sounds
  if (type === 'shoot')  return playShootSentry(t);
  if (type === 'cannon') return playShootCannon(t);
  if (type === 'tesla')  return playShootTesla(t);
  if (type === 'frost')  return playShootFrost(t);
  if (type === 'crit')   return playCrit(t);
  if (type === 'evo')    return playEvolution(t);
  // Generic single-osc envelope for everything else (hit/build/wave/etc.)
  const g = audioCtx.createGain();
  g.connect(audioCtx.destination);
  const o = audioCtx.createOscillator();
  o.connect(g);
  let freq = 300, dur = 0.08, vol = 0.07, wave = 'square';
  switch(type) {
    case 'hit':     freq = 440; dur = 0.04; vol = 0.06; wave = 'triangle'; break;
    case 'death':   freq = 180; dur = 0.15; vol = 0.13; wave = 'triangle'; break;
    case 'build':   freq = 520; dur = 0.12; vol = 0.12; wave = 'triangle'; break;
    case 'upgrade': freq = 740; dur = 0.15; vol = 0.13; wave = 'sine'; break;
    case 'wave':    freq = 220; dur = 0.3;  vol = 0.16; wave = 'sawtooth'; break;
    case 'life':    freq = 140; dur = 0.4;  vol = 0.20; wave = 'sawtooth'; break;
    case 'boss':    freq = 60;  dur = 0.6;  vol = 0.26; wave = 'sawtooth'; break;
    case 'gameover':freq = 110; dur = 1.0;  vol = 0.22; wave = 'sawtooth'; break;
    case 'boon':    freq = 880; dur = 0.25; vol = 0.15; wave = 'sine'; break;
    case 'coin':    freq = 1320; dur = 0.05; vol = 0.07; wave = 'square'; break;
    case 'select':  freq = 980;  dur = 0.035; vol = 0.035; wave = 'sine'; break;
    case 'deny':    freq = 150;  dur = 0.09; vol = 0.05; wave = 'square'; break;
  }
  o.type = wave;
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * 0.5), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}

// ============================================================================
// STREAMING TOWER AUDIO — at high fire rates, individual shot sfx fuse into
// per-tower sustained tones that pitch up and tremolo at the firing rate.
// ============================================================================
const STREAM_THRESHOLD = 7.0;       // shots/sec to switch from per-shot to stream
const STREAM_IDLE_DECAY = 0.28;     // seconds of no-fire before fading out
// Tone parameters per tower. Lower-register fundamentals tuned to an A-minor
// chord (Cannon A2, Frost C4, Sentry E4, Tesla A4) so simultaneous fire is
// harmonic, not dissonant. Pitch shifts subtly with fire rate (capped at +35%)
// so the tone "rises" as the tower speeds up — just enough to feel different,
// not enough to become piercing.
const STREAM_CONFIGS = {
  // pitchScale = 0 across the board — the stream stays at its base frequency
  // no matter how fast the tower fires. Only the timbre/tremolo material
  // changes; pitch never climbs into uncomfortable territory. The transition
  // from per-shot bursts to a sustained stream is the audible cue, not pitch.
  // (Frost no longer has a stream — it's a stationary aura now — so its entry
  //  is unused but kept harmless in case any path still references it.)
  sentry: { wave: 'triangle', freq: 220, base: 0.038, tDepth: 0.28, pitchScale: 0, cutoffMax: 1600 },
  cannon: { wave: 'sawtooth', freq: 110, base: 0.090, tDepth: 0.65, pitchScale: 0 },
  tesla:  { wave: 'sawtooth', freq: 330, base: 0.045, tDepth: 0.45, pitchScale: 0 },
  frost:  { wave: 'sine',     freq: 264, base: 0.055, tDepth: 0.50, pitchScale: 0 }
};
const towerStreams = new Map();   // tower.id -> { osc, gain, baseGain, tremolo, tremoloGain, morphLP, lastUsed, type }

// Lowpass cutoff that closes from "wide open" toward the fundamental as the
// fire rate rises. At threshold the timbre is full; well above, it's sine-like.
// `cutoffMax` lets a config cap the upper end so e.g. sentry never opens up
// into a buzzy brightness — it stays warm/streamy even at threshold.
function computeMorphCutoff(fireRate, baseFreq, cutoffMax) {
  const overage = Math.max(0, fireRate - STREAM_THRESHOLD);
  const ratio = Math.min(1, overage / 12);   // 0 at threshold, 1 at threshold+12
  const min = baseFreq * 1.4;                // just above fundamental — kills harmonics
  const max = (typeof cutoffMax === 'number') ? cutoffMax : 8000;
  return min + (max - min) * (1 - ratio);
}

// Stream wind-up — DISABLED. Earlier versions ramped tremolo + pitch from a
// floor up to full over ~0.85s ("spin-up" feel), but the rapid pitch slide
// produced a sharp swooshy artifact especially on Gatling/Minigun-class
// fire rates. Setting the floors to 1.0 makes streams play at full speed
// immediately with no ramp.
const STREAM_RAMP_DURATION = 0.001;
const STREAM_RAMP_TREM_FLOOR = 1.0;
const STREAM_RAMP_PITCH_FLOOR = 1.0;

function streamFire(tower, fireRate) {
  if (!sfxEnabled) return;
  ensureAudio();
  if (!audioCtx) return;
  const config = STREAM_CONFIGS[tower.type];
  if (!config) return;
  const ct = audioCtx.currentTime;
  let s = towerStreams.get(tower.id);
  // Steady-state target (post-ramp) values
  const targetFreq = config.freq * (1 + Math.min(0.35, (fireRate - STREAM_THRESHOLD) * config.pitchScale));
  // Compute ramp factor (eased) — 0 at start of stream, 1 once fully wound up.
  const startedAt = s ? s.startTime : state.time;
  const rampT = easeOutCubic(Math.min(1, (state.time - startedAt) / STREAM_RAMP_DURATION));
  // Apply wind-up to tremolo rate and pitch; cutoff follows the effective rate.
  const effRate  = fireRate   * (STREAM_RAMP_TREM_FLOOR  + (1 - STREAM_RAMP_TREM_FLOOR)  * rampT);
  const effFreq  = targetFreq * (STREAM_RAMP_PITCH_FLOOR + (1 - STREAM_RAMP_PITCH_FLOOR) * rampT);
  const morphCutoff = computeMorphCutoff(effRate, config.freq, config.cutoffMax);
  if (!s) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const tremolo = audioCtx.createOscillator();
    const tremoloGain = audioCtx.createGain();
    osc.type = config.wave;
    osc.frequency.value = effFreq;
    tremolo.type = 'sine';
    tremolo.frequency.value = effRate;
    // baseline gain is mostly held; tremolo modulates it AROUND that baseline
    const baseG = config.base * (1 - config.tDepth * 0.5);
    gain.gain.value = baseG;
    tremoloGain.gain.value = config.base * config.tDepth;
    tremolo.connect(tremoloGain);
    tremoloGain.connect(gain.gain);  // additive modulation on the gain.gain AudioParam
    // Morph lowpass — single dynamic filter that smooths toward sine as rate climbs
    const morphLP = audioCtx.createBiquadFilter();
    morphLP.type = 'lowpass';
    morphLP.Q.value = 0.7;
    morphLP.frequency.value = morphCutoff;
    osc.connect(gain);
    gain.connect(morphLP);
    morphLP.connect(audioCtx.destination);
    // Fade-in: extended from 40ms → 180ms so the per-shot→stream handoff is
    // smooth instead of an audible "snap" when the tower crosses the threshold.
    gain.gain.setValueAtTime(0, ct);
    gain.gain.linearRampToValueAtTime(baseG, ct + 0.18);
    osc.start(ct);
    tremolo.start(ct);
    s = { osc, gain, tremolo, tremoloGain, morphLP, baseGain: baseG, lastUsed: state.time, startTime: state.time, type: tower.type };
    towerStreams.set(tower.id, s);
  } else {
    // Smooth updates — pitch, tremolo rate, and morph cutoff all track fire rate.
    // Use shorter time-constants while ramping so the wind-up reads clearly,
    // then settle to longer constants once at full speed.
    const tc = rampT < 0.99 ? 0.06 : 0.10;
    s.osc.frequency.setTargetAtTime(effFreq, ct, tc);
    s.tremolo.frequency.setTargetAtTime(effRate, ct, tc * 0.7);
    if (s.morphLP) s.morphLP.frequency.setTargetAtTime(morphCutoff, ct, tc * 1.5);
    s.lastUsed = state.time;
  }
}

function stopStream(id) {
  const s = towerStreams.get(id);
  if (!s || !audioCtx) { towerStreams.delete(id); return; }
  const ct = audioCtx.currentTime;
  // Quick fade-out so it doesn't click
  s.gain.gain.cancelScheduledValues(ct);
  s.gain.gain.setValueAtTime(s.gain.gain.value, ct);
  s.gain.gain.linearRampToValueAtTime(0, ct + 0.08);
  setTimeout(() => {
    try { s.osc.stop(); s.tremolo.stop(); } catch(e) {}
  }, 220);
  towerStreams.delete(id);
}

function pruneStreams() {
  if (!towerStreams.size) return;
  // Stop streams for towers that haven't fired recently OR no longer exist
  const aliveIds = new Set(state.towers.map(t => t.id));
  for (const [id, s] of towerStreams) {
    if (!aliveIds.has(id) || (state.time - s.lastUsed) > STREAM_IDLE_DECAY) stopStream(id);
  }
}

function killAllStreams() {
  for (const id of [...towerStreams.keys()]) stopStream(id);
}

// Flamethrower has its own continuous-roar audio model: a looping band-passed
// noise buffer instead of an oscillator. Tremolo modulates the gain at the
// firing rate so you hear a "puffing" wobble that fuses into a steady roar
// at high fire rate. Always streams (per-shot 'cannon' booms sound terrible
// at 3-4 rounds/sec).
function flameStream(tower, fireRate) {
  if (!sfxEnabled) return;
  ensureAudio();
  if (!audioCtx) return;
  const ct = audioCtx.currentTime;
  let s = towerStreams.get(tower.id);
  // Wind-up: the flame "spools up" — tremolo starts slow and accelerates.
  const startedAt = (s && s.type === 'flame') ? s.startTime : state.time;
  const rampT = easeOutCubic(Math.min(1, (state.time - startedAt) / STREAM_RAMP_DURATION));
  const effRate = fireRate * (STREAM_RAMP_TREM_FLOOR + (1 - STREAM_RAMP_TREM_FLOOR) * rampT);
  if (!s || s.type !== 'flame') {
    if (s) stopStream(tower.id);
    // Build noise loop
    const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.5), audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    // Filter chain: highpass → lowpass shapes white noise into a fire-like roar
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 180;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 720;
    const gain = audioCtx.createGain();
    const baseG = 0.090;   // doubled — flame stream was previously too quiet vs the rest
    gain.gain.setValueAtTime(0, ct);
    gain.gain.linearRampToValueAtTime(baseG, ct + 0.08);
    // Tremolo at the (ramped) fire rate — gives the "puff-puff" wind-up
    const tremolo = audioCtx.createOscillator();
    const tremoloGain = audioCtx.createGain();
    tremolo.type = 'sine';
    tremolo.frequency.value = effRate;
    tremoloGain.gain.value = baseG * 0.55;
    tremolo.connect(tremoloGain);
    tremoloGain.connect(gain.gain);
    // Wire chain
    src.connect(hp);
    hp.connect(lp);
    lp.connect(gain);
    gain.connect(audioCtx.destination);
    src.start();
    tremolo.start();
    s = { osc: src, gain, tremolo, tremoloGain, baseGain: baseG, lastUsed: state.time, startTime: state.time, type: 'flame' };
    towerStreams.set(tower.id, s);
  } else {
    // Tremolo follows the ramped rate so the roar audibly winds up.
    s.tremolo.frequency.setTargetAtTime(effRate, ct, rampT < 0.99 ? 0.06 : 0.10);
    s.lastUsed = state.time;
  }
}

// ============================================================================
// 3. TOWER DEFINITIONS
// ----------------------------------------------------------------------------
// Base stats at level 1. Per-level deltas are applied additively.
// Branch multipliers are applied AT lvl 5 and remain for the run.
// Sub-branch at lvl 10 adds unique behavior (a mechanic or a multiplier).
// Mastery perks every 5 levels past 10 give stat buffs + occasional mechanics.
// ============================================================================
const TOWER_DEFS = {
  // ============================================================================
  // SENTRY — $50, single-target king (Minigun). Workhorse opener.
  // Costs unchanged: best opener in the game must stay placeable wave 1.
  // Base stats slightly buffed (+25% dmg, +7% fr) so L1-L5 isn't dead weight.
  // Sub specFees: Minigun $200 (true single-target king per sim — 4,531 DPS L20),
  // Piercer $150 (modest pierce premium). Suppressor + Crit free (value picks).
  // ============================================================================
  sentry: {
    name: 'Sentry',
    cost: 50,
    color: '#4a8cff',
    desc: 'Fast single-target. Cheap, reliable early.',
    base:    { damage: 10, range: 120, fireRate: 3.2 },
    perLvl:  { damage: 3,  range: 5,   fireRate: 0.2 },
    projectile: { type: 'bullet', speed: 900, color: '#9fc0ff' },
    branches: {
      A: { name: 'Gatling', desc: 'Ramping fire rate, reduced damage.', mul: { fireRate: 1.5, damage: 0.85 },
        subs: {
          A1: { name: 'Minigun', desc: '+100% fire rate, +50% damage, shots kick up dust.', mul: { fireRate: 2.0, damage: 1.5 } },

// ============================================================================
const PERK_COST_SCALE = 1.75;
const PERK_POOL = {
  startGold:     { name: 'Flush',        baseDesc: 'Start the run with +$%V gold.',                 V: 100, cost: 100, apply: (s, lv) => { s.gold += 100 * lv; } },

  firstFree:     { name: 'First Swing',  baseDesc: 'The first %V tower%S you build %ARE free.',      V: 1,   cost: 100, apply: (s, lv) => { s.firstTowerFreeCount = lv; } },
  extraReroll:   { name: 'Steady Hand',  baseDesc: '+%V reroll%S on boon & encounter choices.',      V: 1,   cost: 100, apply: (s, lv) => { s.rerollsLeft = (s.rerollsLeft || 0) + lv; } }
};
// Helpers — derive level/cost/desc for a perk based on current meta state.
function getPerkLevel(k) {
  return (meta.perkLevels && meta.perkLevels[k]) || 0;
}
function getPerkNextCost(k) {
  const p = PERK_POOL[k]; if (!p) return 0;
  const lv = getPerkLevel(k);
  return Math.round(p.cost * Math.pow(PERK_COST_SCALE, lv));
}
function getPerkDesc(k, levelOverride) {
  const p = PERK_POOL[k]; if (!p) return '';
  const lv = (typeof levelOverride === 'number') ? levelOverride : Math.max(1, getPerkLevel(k));
  const v = p.V * lv;
  const s = v === 1 ? '' : 's';
  const are = v === 1 ? 'is' : 'are';
  return p.baseDesc.replace(/%V/g, v).replace(/%S/g, s).replace(/%ARE/g, are);
}

// Mutator / map stack helpers — each stack adds a weight in the run-start
// roll pool. Cost scales geometrically per stack (same 1.75× as perks).
const STACK_COST_SCALE = 1.75;
function getMutatorStacks(k) {
  return (meta.stacks && meta.stacks.mutators && meta.stacks.mutators[k]) || 0;
}
function getMapStacks(k) {
  return (meta.stacks && meta.stacks.maps && meta.stacks.maps[k]) || 0;
}
function getMutatorNextCost(k) {
  const m = MUTATOR_POOL[k]; if (!m) return 0;
  const stacks = getMutatorStacks(k);
  return Math.round((m.cost || 0) * Math.pow(STACK_COST_SCALE, stacks));
}
function getMapNextCost(k) {
  const v = MAP_VARIANTS[k]; if (!v) return 0;
  const stacks = getMapStacks(k);
  return Math.round((v.cost || 0) * Math.pow(STACK_COST_SCALE, stacks));
}

const meta = {
  shards: 0,
  bestWave: 0,
  runs: 0,
  unlocked: {}  // keys -> true
};

// ============================================================================
// 8. MAP GENERATION
// ----------------------------------------------------------------------------
// Generates a random path through a 20x12 grid. Path length 25-40. Optional
// split+merge. Entry on left, exit on right. Grid marked accordingly.
// ============================================================================
// ----- Archetype system -----
// Each run picks a random archetype; retry up to 25 times. Fallback keeps things safe.
// Features use a desaturated cool palette (analogous hues) so they recede behind towers/enemies.
// Towers/enemies keep their saturated primaries as focal points — this is the visual hierarchy.
const MAP_FEATURE_TYPES = [
  { type: 'highGround',  color: '#7ab3cc', range: 0.20,    icon: '◎', label: '+20% Range' },
  { type: 'powerShrine', color: '#9b93cc', dmg: 0.25,      icon: '✦', label: '+25% Damage' },
  { type: 'goldVein',    color: '#c4a66b', goldPerKill: 3, icon: '$', label: '+$3 per kill' },
  { type: 'speedStone',  color: '#86bfa3', fireRate: 0.18, icon: '▲', label: '+18% Fire Rate' }
];

// Map hazards — negative counterparts to features.
//   - build-blocker (rubble) — tile cannot hold a tower
//   - buildable debuff (dampener) — tower placed here is weaker
//   - path hazards — buff enemies passing through (heal / speed / damage reduction)
// Hazards use a desaturated warm/earth palette — reads as "terrain" rather than alarm signage.
// Warm family (hazards) vs cool family (features) gives players a glanceable is-this-good-or-bad cue.
const MAP_HAZARD_TYPES = [
  { type: 'rubble',   color: '#5a4a3d', icon: '✕', label: 'Cannot build here',          blocks: true,  onPath: false },
  { type: 'dampener', color: '#8a5a4a', icon: '⚠', label: '-30% damage, -15% range',    dmgMul: 0.70, rangeMul: 0.85, onPath: false },
  { type: 'sanctum',  color: '#b67584', icon: '♥', label: 'Heals enemies in radius',    heal: 0.04,   radius: 52, onPath: true },
  { type: 'surge',    color: '#b87a52', icon: '»', label: 'Enemies move +50% faster',   speedMul: 1.5, radius: 48, onPath: true },
  { type: 'cover',    color: '#8c7060', icon: '▨', label: 'Enemies take -50% damage',   dmgReduce: 0.5, radius: 56, onPath: true }
];

// All low-level archetype generators keyed by name. MAP_VARIANTS pulls subsets
// of these to give each variant a distinct flavor (e.g. Gauntlet = corridors,
// Spiral = serpents). Classic uses all of them at equal odds.
const ARCHETYPE_GENS = {
  zigzag:   genZigzag,
  hairpin:  genHairpin,
  corridor: genCorridor,
  // 'fork' archetype disabled — enemies only use main lane and the visual is misleading.
  serpent:  genSerpent,
  organic:  genOrganic
};

// Pick a map variant for this run from the active pool. Classic is always a
// fallback. Returns the variant key + the underlying archetype generator list.
function pickMapVariant() {
  // Eligible = active-pool maps + always-unlocked variants (Classic).
  // Pool is WEIGHTED — each map's shop stack count adds a weight, so a
  // map bought 3× is 3× as likely to roll as a 1× variant. Always-unlocked
  // maps (Classic) get a single base weight.
  const candidates = [];
  for (const k of Object.keys(MAP_VARIANTS)) {
    const v = MAP_VARIANTS[k];
    if (v.alwaysUnlocked) {
      candidates.push(k);
    } else if (isInPool('maps', k)) {
      const stacks = Math.max(1, getMapStacks(k));
      for (let i = 0; i < stacks; i++) candidates.push(k);
    }
  }
  // Defensive: if everything got unchecked somehow, fall back to Classic.
  if (!candidates.length) candidates.push('classic');
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function generateMap() {
  const variantKey = pickMapVariant();
  const variant = MAP_VARIANTS[variantKey] || MAP_VARIANTS.classic;
  // Build the archetype list from the variant. Each variant entry is an
  // archetype name (string) referencing ARCHETYPE_GENS; duplicates weight
  // the picker (e.g. ['hairpin','hairpin','corridor'] is 2x more likely to
  // produce hairpins than corridors).
  const archetypes = (variant.archetypes || ['zigzag','hairpin','corridor','serpent','organic'])
    .map(name => ({ name, gen: ARCHETYPE_GENS[name] }))
    .filter(a => typeof a.gen === 'function');
  // Pick a single archetype and try a handful of seeds to get a clean layout.
  for (let tries = 0; tries < 8; tries++) {
    const pick = archetypes[Math.floor(Math.random() * archetypes.length)];
    for (let attempt = 0; attempt < 12; attempt++) {
      const r = pick.gen();
      if (r) {
        r.archetype = pick.name;
        r.variant   = variantKey;          // displayed in HUD / used by save-resume
        r.features = generateFeatures(r.grid);
        r.hazards  = generateHazards(r.grid, r.path, r.features);
        return r;
      }
    }
  }
  const fb = genFallback();
  if (fb) fb.variant = variantKey;
  return fb;
}

// Roll a path width 2-6 weighted heavy toward narrow (6 is rare).
function rollPathWidth() {
  const r = Math.random();
  if (r < 0.40) return 2;
  if (r < 0.70) return 3;
  if (r < 0.86) return 4;
  if (r < 0.95) return 5;
  return 6;  // ~5%
}

// Widen the path on the grid. Width N means we add a ring of expanded tiles
// around each path tile: expand = floor(N/2). Enemies still walk the centerline,
// but more tiles are unbuildable so towers spread out and the path "feels" wider.
function widenPath(grid, path, width) {
  // Cap expand at 2 — width 6 would otherwise consume nearly the whole grid (7x7 per tile).
  const expand = Math.min(2, Math.max(0, Math.floor(width / 2)));
  if (expand <= 0) return;
  for (const p of path) {
    for (let dy = -expand; dy <= expand; dy++) {
      for (let dx = -expand; dx <= expand; dx++) {
        if (dx === 0 && dy === 0) continue;
        const tx = p.cx + dx, ty = p.cy + dy;
        if (tx < 0 || tx >= GRID_W || ty < 0 || ty >= GRID_H) continue;
        if (grid[ty][tx] === 0) grid[ty][tx] = 2;  // marker for "wide path shoulder"
      }
    }
  }
}

// Build a grid-aligned path that visits a series of waypoints using L-shaped
// segments. hv=horizontal first, vh=vertical first. Alternates to give corners.
function routeBetween(waypoints, style) {
  const path = [];
  if (!waypoints.length) return path;
  path.push({ cx: waypoints[0].cx, cy: waypoints[0].cy });
  for (let i = 0; i < waypoints.length - 1; i++) {
    const a = waypoints[i], b = waypoints[i + 1];
    let cx = a.cx, cy = a.cy;
    const hFirst = style === 'hv' ? (i % 2 === 0) : (i % 2 === 1);
    if (hFirst) {
      while (cx !== b.cx) { cx += Math.sign(b.cx - cx); path.push({ cx, cy }); }
      while (cy !== b.cy) { cy += Math.sign(b.cy - cy); path.push({ cx, cy }); }
    } else {
      while (cy !== b.cy) { cy += Math.sign(b.cy - cy); path.push({ cx, cy }); }
      while (cx !== b.cx) { cx += Math.sign(b.cx - cx); path.push({ cx, cy }); }
    }
  }
  return path;
}

// Validate a generated path (no repeats, in bounds, each step is 1 tile, length OK).
function pathValid(path, minLen, maxLen) {
  if (path.length < minLen || path.length > maxLen) return false;
  const seen = new Set();
  for (let i = 0; i < path.length; i++) {
    const p = path[i];
    if (p.cx < 0 || p.cx >= GRID_W || p.cy < 0 || p.cy >= GRID_H) return false;
    const k = p.cx + ',' + p.cy;
    if (seen.has(k)) return false;
    seen.add(k);
    if (i > 0) {
      const d = Math.abs(path[i].cx - path[i-1].cx) + Math.abs(path[i].cy - path[i-1].cy);
      if (d !== 1) return false;
    }
  }
  return true;
}

function buildGridFromPath(path) {
  const grid = Array.from({length: GRID_H}, () => Array(GRID_W).fill(0));
  path.forEach(p => grid[p.cy][p.cx] = 1);
  return grid;
}

// Archetype: Zigzag — vertical swings while progressing east. Gives clean corridors.
function genZigzag() {
  const startY = 2 + Math.floor(Math.random() * (GRID_H - 4));
  const wp = [{cx: 0, cy: startY}];
  let x = 2 + Math.floor(Math.random() * 2);
  let y = startY;
  let dir = Math.random() < 0.5 ? 1 : -1;
  while (x < GRID_W - 3) {
    wp.push({cx: x, cy: y});
    const swing = 3 + Math.floor(Math.random() * 3);
    let ny = y + swing * dir;
    if (ny < 1 || ny > GRID_H - 2) { dir *= -1; ny = y + swing * dir; }
    ny = Math.max(1, Math.min(GRID_H - 2, ny));
    wp.push({cx: x, cy: ny});
    y = ny;
    x += 3 + Math.floor(Math.random() * 2);
    dir *= -1;
  }
  wp.push({cx: GRID_W - 1, cy: y});
  const path = routeBetween(wp, 'hv');
  if (!pathValid(path, 24, 50)) return null;
  return { grid: buildGridFromPath(path), path, secondary: null };
}

// Archetype: Hairpin — U-turn creating a big kill zone in the middle of the map.
function genHairpin() {
  const entryY = 1 + Math.floor(Math.random() * 2);
  const exitY = GRID_H - 2 - Math.floor(Math.random() * 2);
  const turnX = 13 + Math.floor(Math.random() * 3);
  const backX = 3 + Math.floor(Math.random() * 3);
  const midY = Math.floor(GRID_H / 2) - 1 + Math.floor(Math.random() * 2);
  const wp = [
    {cx: 0, cy: entryY},
    {cx: turnX, cy: entryY},
    {cx: turnX, cy: midY},
    {cx: backX, cy: midY},
    {cx: backX, cy: exitY},
    {cx: GRID_W - 1, cy: exitY}
  ];
  const path = routeBetween(wp, 'hv');
  if (!pathValid(path, 28, 55)) return null;
  return { grid: buildGridFromPath(path), path, secondary: null };
}

// Archetype: Corridor — wide vertical sweeps between short horizontal runs.
function genCorridor() {
  const entryY = 1 + Math.floor(Math.random() * 2);
  const exitY = GRID_H - 2 - Math.floor(Math.random() * 2);
  const x1 = 4 + Math.floor(Math.random() * 2);
  const y1 = GRID_H - 2 - Math.floor(Math.random() * 2);
  const x2 = 9 + Math.floor(Math.random() * 2);
  const y2 = 1 + Math.floor(Math.random() * 2);
  const x3 = 14 + Math.floor(Math.random() * 2);
  const wp = [
    {cx: 0, cy: entryY},
    {cx: x1, cy: entryY},
    {cx: x1, cy: y1},
    {cx: x2, cy: y1},
    {cx: x2, cy: y2},
    {cx: x3, cy: y2},
    {cx: x3, cy: exitY},
    {cx: GRID_W - 1, cy: exitY}
  ];
  const path = routeBetween(wp, 'hv');
  if (!pathValid(path, 30, 55)) return null;
  return { grid: buildGridFromPath(path), path, secondary: null };
}

// Archetype: Fork — main path plus a visible parallel side route (same pathing but visual variety).
function genFork() {
  const entryY = 3 + Math.floor(Math.random() * (GRID_H - 6));
  const exitY = 3 + Math.floor(Math.random() * (GRID_H - 6));
  const splitX = 5 + Math.floor(Math.random() * 2);
  const mergeX = 13 + Math.floor(Math.random() * 2);
  const topY = Math.max(1, entryY - 3);
  const botY = Math.min(GRID_H - 2, entryY + 3);
  const mainWP = [
    {cx: 0, cy: entryY},
    {cx: splitX, cy: entryY},
    {cx: splitX, cy: topY},
    {cx: mergeX, cy: topY},
    {cx: mergeX, cy: exitY},
    {cx: GRID_W - 1, cy: exitY}
  ];
  const sideWP = [
    {cx: splitX, cy: entryY},
    {cx: splitX, cy: botY},
    {cx: mergeX, cy: botY},
    {cx: mergeX, cy: exitY}
  ];
  const main = routeBetween(mainWP, 'hv');
  const side = routeBetween(sideWP, 'hv');
  if (!pathValid(main, 24, 55)) return null;
  const mainSet = new Set(main.map(p => p.cx + ',' + p.cy));
  const allowed = new Set([splitX + ',' + entryY, mergeX + ',' + exitY]);
  for (const p of side) {
    const k = p.cx + ',' + p.cy;
    if (mainSet.has(k) && !allowed.has(k)) return null;
  }
  const grid = buildGridFromPath(main);
  side.forEach(p => grid[p.cy][p.cx] = 1);
  return { grid, path: main, secondary: { points: side } };
}

// Archetype: Serpent — tight repeated S-curves. Very dense for AOE towers.
function genSerpent() {
  const startY = 2 + Math.floor(Math.random() * (GRID_H - 4));
  const wp = [{cx: 0, cy: startY}];
  let y = startY;
  let x = 2 + Math.floor(Math.random() * 2);
  let dir = Math.random() < 0.5 ? 1 : -1;
  while (x < GRID_W - 2) {
    const swing = 4 + Math.floor(Math.random() * 2);
    let ny = y + swing * dir;
    if (ny < 1 || ny > GRID_H - 2) { dir *= -1; ny = y + swing * dir; }
    ny = Math.max(1, Math.min(GRID_H - 2, ny));
    wp.push({cx: x, cy: y});
    wp.push({cx: x, cy: ny});
    y = ny;
    x += 2 + Math.floor(Math.random() * 2);
    dir *= -1;
  }
  wp.push({cx: GRID_W - 1, cy: y});
  const path = routeBetween(wp, 'hv');
  if (!pathValid(path, 25, 55)) return null;
  return { grid: buildGridFromPath(path), path, secondary: null };
}

// Archetype: Organic — original biased-random-walk. Produces wandering corridors.
function genOrganic() {
  const startRow = 1 + Math.floor(Math.random() * (GRID_H - 2));
  const endRow = 1 + Math.floor(Math.random() * (GRID_H - 2));
  const grid = Array.from({length: GRID_H}, () => Array(GRID_W).fill(0));
  const path = walkPath(grid, 0, startRow, GRID_W - 1, endRow, 42);
  if (!path || path.length < 25 || path.length > 42) return null;
  path.forEach(p => grid[p.cy][p.cx] = 1);
  return { grid, path, secondary: null };
}

function genFallback() {
  const grid = Array.from({length: GRID_H}, () => Array(GRID_W).fill(0));
  const r = 6;
  const path = [];
  for (let x = 0; x < GRID_W; x++) { grid[r][x] = 1; path.push({cx: x, cy: r}); }
  return { grid, path, secondary: null, features: [], hazards: [], archetype: 'fallback' };
}

// Place 5-7 special tiles on buildable cells near the path. Towers on these
// tiles get passive bonuses (read in computeTowerStats / killEnemy).
function generateFeatures(grid) {
  const buildable = [];
  for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++) {
    if (grid[y][x] !== 0) continue;
    // Must be adjacent (8-neighbor) to the path — otherwise no tower would use the spot.
    let near = false;
    for (let dx = -1; dx <= 1 && !near; dx++) for (let dy = -1; dy <= 1 && !near; dy++) {
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy;
      // Treat both centerline (1) and shoulder (2) as "path" for adjacency
      if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H && grid[ny][nx] !== 0) near = true;
    }
    if (near) buildable.push({ x, y });
  }
  for (let i = buildable.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [buildable[i], buildable[j]] = [buildable[j], buildable[i]];
  }
  const features = [];
  const target = 5 + Math.floor(Math.random() * 3);
  for (const pos of buildable) {
    if (features.length >= target) break;
    // Keep features spread out so you can't stack all bonuses on one corner.
    if (features.some(f => Math.abs(f.gx - pos.x) + Math.abs(f.gy - pos.y) < 3)) continue;
    const t = MAP_FEATURE_TYPES[Math.floor(Math.random() * MAP_FEATURE_TYPES.length)];
    features.push({ ...t, gx: pos.x, gy: pos.y });
  }
  return features;
}

// Place hazards: rubble/dampener on buildable tiles, sanctum/surge/cover on the path.
// Hazards never overlap features (so a single tile is unambiguously one thing).
function generateHazards(grid, path, features) {
  const hazards = [];
  const featSet = new Set(features.map(f => f.gx + ',' + f.gy));

  // Buildable hazards (rubble + dampener) — 3-5 total, spread out
  const buildable = [];
  for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++) {
    if (grid[y][x] !== 0) continue;
    if (featSet.has(x + ',' + y)) continue;
    buildable.push({ x, y });
  }
  for (let i = buildable.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [buildable[i], buildable[j]] = [buildable[j], buildable[i]];
  }
  const buildableTypes = MAP_HAZARD_TYPES.filter(t => !t.onPath);
  const buildableTarget = 3 + Math.floor(Math.random() * 3);  // 3-5
  for (const pos of buildable) {
    if (hazards.length >= buildableTarget) break;
    if (hazards.some(h => Math.abs(h.gx - pos.x) + Math.abs(h.gy - pos.y) < 2)) continue;
    if (features.some(f => Math.abs(f.gx - pos.x) + Math.abs(f.gy - pos.y) < 2)) continue;
    // Rubble is more common than dampener (players find rubble more readable).
    const t = Math.random() < 0.65 ? buildableTypes[0] : buildableTypes[1];
    hazards.push({ ...t, gx: pos.x, gy: pos.y });
  }

  // Path hazards (sanctum / surge / cover) — 2-3 zones, each spans 2-6 path tiles.
  // The "anchor" tile is the center icon; tiles[] is the full span checked at
  // collision time. 6-tile zones are rare (~5%).
  const pathTypes = MAP_HAZARD_TYPES.filter(t => t.onPath);
  const pathIndices = [];
  for (let i = 4; i < path.length - 4; i++) pathIndices.push(i);  // skip first/last 4 tiles
  for (let i = pathIndices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pathIndices[i], pathIndices[j]] = [pathIndices[j], pathIndices[i]];
  }
  const pathTarget = 2 + Math.floor(Math.random() * 2);  // 2-3 zones
  let placed = 0;
  for (const idx of pathIndices) {
    if (placed >= pathTarget) break;
    // Pick a span 2-6, weighted heavy toward 2.
    const r = Math.random();
    const span = r < 0.40 ? 2 : r < 0.70 ? 3 : r < 0.86 ? 4 : r < 0.95 ? 5 : 6;
    // Clamp so the span fits inside the path with some buffer
    const half = Math.floor(span / 2);
    const startIdx = Math.max(2, idx - half);
    const endIdx   = Math.min(path.length - 3, startIdx + span - 1);
    if (endIdx - startIdx + 1 < 2) continue;
    const tiles = [];
    for (let i = startIdx; i <= endIdx; i++) tiles.push({ gx: path[i].cx, gy: path[i].cy });
    // Spacing: zones shouldn't overlap or cluster
    const overlaps = hazards.some(h => h.onPath && h.tiles && h.tiles.some(t1 => tiles.some(t2 => Math.abs(t1.gx - t2.gx) + Math.abs(t1.gy - t2.gy) < 2)));
    if (overlaps) continue;
    const t = pathTypes[Math.floor(Math.random() * pathTypes.length)];
    // Anchor = middle of span (where the icon draws)
    const mid = path[Math.floor((startIdx + endIdx) / 2)];
    hazards.push({ ...t, gx: mid.cx, gy: mid.cy, tiles, span });
    placed++;
  }

  return hazards;
}

function walkPath(grid, sx, sy, ex, ey, maxLen = 42) {
  // Biased random walk from (sx,sy) to (ex,ey) on grid, avoiding repeats.
  const path = [{cx: sx, cy: sy}];
  const seen = new Set([sx + ',' + sy]);
  let cx = sx, cy = sy;
  let stuck = 0;
  while (!(cx === ex && cy === ey) && path.length < maxLen) {
    const options = [];
    const dirs = [[1,0],[0,1],[0,-1],[-1,0]];
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
      if (seen.has(nx+','+ny)) continue;
      // Bias east + target
      let weight = 1;
      if (nx > cx) weight += 3;
      if (nx < cx) weight -= 1.5;
      if (dy !== 0) weight += 0.6;
      if (nx === ex && ny === ey) weight += 10;
      // distance bias
      const dist = Math.abs(ex - nx) + Math.abs(ey - ny);
      weight -= dist * 0.05;
      if (weight > 0) options.push({nx, ny, w: weight});
    }
    if (options.length === 0) { stuck++; if (stuck > 3) return null; path.pop(); if (path.length === 0) return null; cx = path[path.length-1].cx; cy = path[path.length-1].cy; continue; }
    stuck = 0;
    // Weighted pick
    let total = options.reduce((s, o) => s + o.w, 0);
    let pick = Math.random() * total;
    let chosen = options[0];
    for (const o of options) { pick -= o.w; if (pick <= 0) { chosen = o; break; } }
    cx = chosen.nx; cy = chosen.ny;
    path.push({cx, cy});
    seen.add(cx + ',' + cy);
  }
  if (cx === ex && cy === ey) return path;
  return null;
}

// Convert grid path to pixel waypoints (tile centers)
function pathToPixels(path) {
  return path.map(p => ({ x: p.cx * CELL + CELL/2, y: p.cy * CELL + CELL/2 }));
}

// ============================================================================
// 8a. ARTIFACTS — passive run-long modifiers
// ----------------------------------------------------------------------------
// Artifacts stack freely (5-15 per run). Obtained from elite drops, encounters,
// and ~15% chance to replace a boon choice. Passive mods are aggregated into
// state.artifactCache (recomputed on add/remove) so hot paths don't iterate.
// Reactive effects use onEvent hooks fired from key game events.
// ============================================================================

const ARTIFACT_RARITY = {
  common:    { color: '#c8cdd4', name: 'Common' },
  uncommon:  { color: '#6ab4ff', name: 'Uncommon' },
  rare:      { color: '#c084fc', name: 'Rare' },
  legendary: { color: '#ffc74a', name: 'Legendary' }
};

// Rarity weights by wave; multiplier applied to elite wave thresholds below.
// A roll uses these weights as a CDF: pick a threshold that beats random.
function rollArtifactRarity(wave, forced) {
  if (forced) return forced;
  const r = Math.random();
  if (wave >= 40) {        // mid-late: slight legendary chance, meaningful rare
    if (r < 0.01) return 'legendary';
    if (r < 0.12) return 'rare';
    if (r < 0.50) return 'uncommon';
    return 'common';
  }
  if (wave >= 20) {        // wave 20+: rare unlocks, legendaries still vanishingly rare
    if (r < 0.005) return 'legendary';
    if (r < 0.08)  return 'rare';
    if (r < 0.45)  return 'uncommon';
    return 'common';
  }
  // Early game: common heavy
  if (r < 0.02) return 'rare';
  if (r < 0.30) return 'uncommon';
  return 'common';
}

// Artifact pool: 26 artifacts. Each entry has { name, rarity, desc, icon, mods?, onEvent? }
// mods are aggregated into state.artifactCache on change; onEvent fires on game events.
const ARTIFACT_POOL = {
  // --- Common (60% of drops)

function rollArtifact(wave, forcedRarity) {
  const rarity = rollArtifactRarity(wave, forcedRarity);
  const owned = new Set(state.artifacts.map(a => a.id));
  const pool = Object.keys(ARTIFACT_POOL).filter(k => ARTIFACT_POOL[k].rarity === rarity && !owned.has(k));
  if (!pool.length) {
    // Drop rarity one tier if all of this rarity owned
    const tiers = ['legendary','rare','uncommon','common'];
    const idx = tiers.indexOf(rarity);
    for (let i = idx + 1; i < tiers.length; i++) {
      const fallback = Object.keys(ARTIFACT_POOL).filter(k => ARTIFACT_POOL[k].rarity === tiers[i] && !owned.has(k));
      if (fallback.length) return makeArtifact(fallback[Math.floor(Math.random()*fallback.length)]);
    }
    return null;
  }
  return makeArtifact(pool[Math.floor(Math.random() * pool.length)]);
}

function makeArtifact(id) {
  const def = ARTIFACT_POOL[id];
  return { id, name: def.name, rarity: def.rarity, desc: def.desc, icon: def.icon, mods: def.mods, onEvent: def.onEvent };
}

function grantArtifact(art) {
  if (!art) return;
  state.artifacts.push(art);
  rebuildArtifactCache();
  // Active artifacts get a runtime slot — start ready (cd=0), not armed
  if (art.active) state.artifactState[art.id] = { cd: 0, armed: false };
  renderArtifactRow();
  spawnArtifactPickup(art);
  // Iron Plating one-time lives bonus — apply once on pickup
  if (art.mods && art.mods.livesBonus) state.lives += art.mods.livesBonus;
  sfx('boon');
}

function rebuildArtifactCache() {
  // Aggregate all passive mods into a flat cache so hot paths (computeTowerStats,
  // damageEnemy, killEnemy) can read a single lookup table instead of iterating.
  const c = {
    goldMul: 0, rangeFlat: 0, fireRateMul: 0,
    teslaChainsBonus: 0, splashMul: 0, sentryCritBonus: 0,
    frostDmgFlat: 0, chilledDmgBonus: 0, chainBonus: 0,
    deepSlowDmgMul: 1, shieldedPierce: 0, cannonDoubleFire: 0,
    sentrySilentCrit: 0, resonanceAdjacent: 0, monolithBonus: 0,
    firstShotCrit: false, chronicleEnabled: false, auroraActive: false
  };
  for (const a of state.artifacts) {
    if (!a.mods) continue;
    for (const k of Object.keys(a.mods)) {
      if (typeof c[k] === 'number') c[k] = (c[k] || 0) + (a.mods[k] || 0);
      else if (typeof c[k] === 'boolean') c[k] = c[k] || !!a.mods[k];
    }
  }
  // deepSlowDmgMul is multiplicative (base 1); if Frozen Gears present make it 2.
  c.deepSlowDmgMul = state.artifacts.some(a => a.mods && a.mods.deepSlowDmgMul) ? 2 : 1;
  state.artifactCache = c;
}

function fireArtifactEvent(type, data) {
  if (!state.artifacts || !state.artifacts.length) return;
  for (const a of state.artifacts) {
    if (a.onEvent && a.onEvent[type]) {
      try { a.onEvent[type](state, data || {}); } catch(e) { /* never let an artifact crash the loop */ }
    }
  }
}
