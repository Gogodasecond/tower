// ============================================================================
function spawnEnemy(type, bossWave, eliteModifier, naturalBoss) {
  // Codex discovery — first time the player sees this enemy type, record it
  // so it shows up unlocked in the menu's Help/Codex screen.
  recordCodexDiscovery('enemy', type);
  if (eliteModifier) recordCodexDiscovery('elite', eliteModifier);
  if (naturalBoss) recordCodexDiscovery('enemy', 'naturalBoss');
  const def = ENEMY_DEFS[type];
  const baseHp = def.hp;
  const wave = state.wave;
  let hpMul = Math.pow(ENEMY_HP_SCALE, wave - 1);
  // Late-wave accelerating curve: compound boost past LATE_WAVE so enemies keep up with scaling towers
  if (wave > LATE_WAVE) hpMul *= Math.pow(LATE_HP_SCALE, wave - LATE_WAVE);
  if (hasMut('boomEconomy')) hpMul *= 1.8;
  if (hasMut('fortified'))   hpMul *= 1.5;
  // Boss HP scaling — steeper than normals by design.
  // Natural-spawn bosses (the mid-wave miniboss role) use REGULAR enemy
  // scaling with a chunky base so they don't dwarf full bosses or trivialize
  // the wave. ~ tank-class hp × 4 at any given wave.
  let hp = baseHp * hpMul;
  if (type === 'boss') {
    if (naturalBoss) {
      hp = 700 * hpMul;   // chunky regular enemy, NOT tier-scaled boss HP
    } else {
      // Full boss — must be tougher than any elite at the same wave so it
      // actually feels like a wave climax. Two scaling sources, take the
      // bigger:
      //   classic curve : def.hp × 1.5^(W/10) × (1 + (W-10)·0.18)
      //   elite-floor   : 2× the elite-juggernaut HP at this wave
      // The floor ensures bosses always out-scale the dark-red hex juggernaut
      // elites the player sees in late-game waves.
      const classic = def.hp * Math.pow(BOSS_HP_TIER, wave / 10) * (1 + (wave - 10) * 0.18);
      const eliteJugg = (ENEMY_DEFS.juggernaut.hp * hpMul) * 1.8 /* elite mod */ * 2.2 /* boss-floor multiplier */;
      hp = Math.max(classic, eliteJugg);
    }
  }
  // Speed — full bosses gain a small bump per wave past 10. Natural bosses
  // skip that bump so they're slightly snappier (matching their lighter HP).
  let speed = def.speed;
  if (type === 'boss' && !naturalBoss) speed += Math.max(0, wave - 10) * 0.4;
  // "Wave-tax" speed creep applied to all non-boss enemies. Linear ramp tuned
  // so the cap is hit right around the deep-late-game window (~W60-65) — the
  // current WR is W75 and late-game in this tower starts ~W50-60, so the
  // creep should be barely felt early, noticeable mid, and fully on by then.
  // Bosses already have their own bump above, so we skip them here.
  //   W10  → +8%   W30 → +24%   W50 → +40%   W63+ → +50% cap
  if (!def.isBoss) {
    const ENEMY_SPEED_PER_WAVE = 0.008;      // 0.8% / wave
    const ENEMY_SPEED_CAP      = 1.50;       // never exceed +50% baseline
    const speedCreep = Math.min(ENEMY_SPEED_CAP, 1 + Math.max(0, wave - 1) * ENEMY_SPEED_PER_WAVE);
    speed *= speedCreep;
  }
  if (hasMut('speedDemons') && !def.isBoss) speed *= 1.3;
  if (state.curseEnemySpeed) speed *= (1 + state.curseEnemySpeed);
  // Gold — reduced Boom Economy multiplier (was 2x)
  let gold = Math.round(def.gold * Math.pow(ENEMY_GOLD_SCALE, wave - 1));
  if (hasMut('boomEconomy')) gold *= 1.6;
  if (hasMut('speedDemons') && !def.isBoss) gold *= 1.5;
  if (hasMut('overwhelm')) gold = Math.round(gold * 1.3);
  gold = Math.round(gold);

  // Swarm spawns in clumps (handled by wave gen giving multiple swarm enemies)
  const enemy = {
    id: Math.random(),
    type, def,
    hp, maxHp: hp,
    speed, baseSpeed: speed,
    gold,
    progress: 0,
    pathIdx: 0,
    x: 0, y: 0,
    size: def.size,
    shape: def.shape,
    color: def.color,
    shielded: def.shielded || 0,
    heals: def.heals || 0,
    angle: 0,
    slow: 0, slowDur: 0,
    stun: 0,
    burn: null,
    chilled: 0, chillMarker: 0,
    isBoss: !!def.isBoss,
    // Natural-spawn boss flag — same enemy entity as the boss-wave boss but
    // pacing-balanced: lower HP, no special mechanic, smaller payload.
    isNaturalBoss: !!naturalBoss,
    bossWave: bossWave || 0,
    bossMechanic: null,
    bossTimer: 0,
    dead: false,
    markedFlash: 0,
    _fam: currentFamily()
  };
  // Full-boss setup runs only for boss-wave bosses (assigns mechanic + size).
  // Natural bosses use a fixed slightly-reduced size and no mechanic so they
  // visually distinguish from the wave's "true" boss.
  if (enemy.isBoss && !naturalBoss) {
    setupBoss(enemy, bossWave);
  } else if (enemy.isBoss && naturalBoss) {
    enemy.size = 24;          // slightly smaller than full boss's tier-scaled size
  }
  // Explicit elite modifier from wave gen (full ELITE_MODIFIERS system)
  if (!def.isBoss && eliteModifier && ELITE_MODIFIERS[eliteModifier]) {
    enemy.eliteModifier = eliteModifier;
    applyEliteToEnemy(enemy);
  } else if (!def.isBoss) {
    // Legacy minor-elite fallback — kept for extra variety when no modifier was pre-rolled
    const eliteStart  = hasMut('eliteHunt') ? 10   : 20;
    const eliteBase   = hasMut('eliteHunt') ? 0.24 : 0.08;
    const eliteCap    = hasMut('eliteHunt') ? 0.55 : 0.22;
    const eliteChance = Math.min(eliteCap, eliteBase + Math.max(0, state.wave - eliteStart) * 0.006);
    if (state.wave >= eliteStart && Math.random() < eliteChance) {
      enemy.elite = true;
      enemy.hp *= 1.8;
      enemy.maxHp *= 1.8;
      enemy.baseSpeed *= 1.2;
      enemy.speed *= 1.2;
      enemy.gold = Math.round(enemy.gold * (hasMut('eliteHunt') ? 3 : 2.5));
      enemy.size = Math.round(enemy.size * 1.15);
    }
  }
  // Start position: at path start (flying enemies removed)
  const p0 = state.path[0];
  enemy.x = p0.x; enemy.y = p0.y;
  if (state.chillNextWave) applySlow(enemy, 0.20, 999);
  state.enemies.push(enemy);
}

function setupBoss(enemy, wave) {
  // Pick boss mechanic by tier. 12 mechanics in rotation; past tier 12 we cycle
  // back with +50% HP per repeat and allow mechanics to combine.
  const tier = Math.floor(wave / 10);
  const cycle = Math.floor((tier - 1) / 12);  // 0 for W10-120, 1 for W130-240, etc.
  enemy.size = 28 + Math.min(tier, 12) * 4;
  enemy.maxHp = enemy.hp;
  // Repeat cycles scale HP +50% each cycle
  if (cycle > 0) { enemy.hp *= Math.pow(1.5, cycle); enemy.maxHp = enemy.hp; }
  const baseTier = ((tier - 1) % 12) + 1;
  switch (baseTier) {
    case 1:  enemy.bossMechanic = 'split';      break;  // W10
    case 2:  enemy.bossMechanic = 'slowImmune'; break;  // W20
    case 3:  enemy.bossMechanic = 'spawner';    break;  // W30
    case 4:  enemy.bossMechanic = 'regen';      break;  // W40
    case 5:  enemy.bossMechanic = 'shield';     break;  // W50
    case 6:  enemy.bossMechanic = 'teleport';   break;  // W60
    case 7:  enemy.bossMechanic = 'enrage';     break;  // W70
    case 8:  enemy.bossMechanic = 'aura';       break;  // W80
    case 9:  enemy.bossMechanic = 'mirror';     break;  // W90 — spawns a decoy, wrong target heals it
    case 10: enemy.bossMechanic = 'collector';  break;  // W100 — steals an artifact, returns on kill, lost on leak
    case 11: enemy.bossMechanic = 'dasher';     break;  // W110 — periodic burst sprints (no resistance, no tower removal)
    case 12: enemy.bossMechanic = 'echo';       break;  // W120 — drops shadow copies at HP thresholds
  }
  // Stacked: from cycle 2+ (W250+), add a secondary mechanic
  if (cycle >= 1) {
    const extras = ['slowImmune','regen','enrage','aura','teleport','dasher'].filter(m => m !== enemy.bossMechanic);
    enemy.bossMechanicExtra = extras[Math.floor(Math.random() * extras.length)];
  }
  // Wave 90 special: spawn the mirror decoy immediately
  if (baseTier === 9) {
    setTimeout(() => spawnMirrorDecoy(enemy), 300);
  }
  // Wave 100: steal one random artifact (returns on kill, lost on leak)
  if (baseTier === 10 && state.artifacts && state.artifacts.length) {
    const idx = Math.floor(Math.random() * state.artifacts.length);
    enemy.stolenArtifact = state.artifacts.splice(idx, 1)[0];
    rebuildArtifactCache();
    renderArtifactRow();
  }
  // Echo boss — track which HP thresholds it has dropped echoes at.
  if (baseTier === 12) enemy.echoThresholds = [0.75, 0.5, 0.25];
  sfx('boss');
  state.camera.shakeAmt = 14;
}

// Echo boss minion — a "shadow copy" dropped at HP thresholds. Walks the rest
// of the path on its own at reduced HP. No special damage rules — just a body
// that adds late-wave pressure. Pure spawn-on-trigger, no tower interaction.
function spawnEchoMinion(boss) {
  const def = ENEMY_DEFS.brute;
  const baseHp = def.hp * Math.pow(ENEMY_HP_SCALE, state.wave - 1);
  const echo = {
    id: Math.random(),
    type: 'brute', def,
    hp: baseHp * 1.0, maxHp: baseHp * 1.0,
    speed: def.speed * 0.85, baseSpeed: def.speed * 0.85,
    gold: Math.round(def.gold * 0.4),
    progress: boss.progress, pathIdx: boss.pathIdx, _segPos: boss._segPos || 0,
    x: boss.x, y: boss.y,
    size: def.size + 2, shape: def.shape, color: '#5b3a8a',
    flying: false, angle: 0, slow: 0, slowDur: 0, stun: 0, burn: null,
    chilled: 0, dead: false, isEcho: true, markedFlash: 0
  };
  state.enemies.push(echo);
  return echo;
}

// Spawn a mirror decoy that shares HP bar but damage to wrong one heals real boss.
function spawnMirrorDecoy(boss) {
  const decoy = {
    id: Math.random(), type: 'boss', def: ENEMY_DEFS.boss,
    hp: boss.maxHp * 0.5, maxHp: boss.maxHp * 0.5,
    speed: boss.speed, baseSpeed: boss.baseSpeed,
    gold: 0, progress: boss.progress, pathIdx: boss.pathIdx, _segPos: boss._segPos || 0,
    x: boss.x, y: boss.y, size: boss.size - 4, shape: 'bss', color: '#888e9e',
    flying: false, angle: 0, slow: 0, slowDur: 0, stun: 0, burn: null, chilled: 0, dead: false,
    isBoss: true, bossMechanic: 'mirror-decoy', mirrorOf: boss
  };
  state.enemies.push(decoy);
  boss.mirrorDecoy = decoy;
}

function updateEnemies(dt) {
  const pathLen = state.path.length;
  for (const e of state.enemies) {
    if (e.dead) continue;
    // Sim-mode dummies don't move, don't leak, don't progress along path —
    // they stay pinned where they were spawned so the tower can hammer them
    // for the entire trial window. All status effects (chill, slow, burn)
    // still apply normally so support towers register their contribution.
    if (e._isDummy) {
      // Decay status timers so chilled/slow durations work correctly
      if (e.slowDur > 0) { e.slowDur -= dt; if (e.slowDur <= 0) { e.slow = 0; } }
      if (e.chilled > 0) { e.chilled -= dt; }
      if (e.burn) {
        e.burn.dur -= dt;
        e.burn.tickT -= dt;
        if (e.burn.tickT <= 0) {
          e.burn.tickT = e.burn.tick || 0.5;
          // Apply burn DoT — credits the source tower's stats
          if (e.burn.src) damageEnemy(e, e.burn.dps * (e.burn.tick || 0.5), e.burn.src, false);
        }
        if (e.burn.dur <= 0) e.burn = null;
      }
      continue;
    }
    // Stun check
    if (e.stun > 0) { e.stun -= dt; continue; }
    // Boss mechanics
    if (e.isBoss) {
      e.bossTimer += dt;
      switch (e.bossMechanic) {
        case 'regen':
          e.hp = Math.min(e.maxHp, e.hp + e.maxHp * 0.008 * dt);
          break;
        case 'spawner':
          if (e.bossTimer > 3) {
            e.bossTimer = 0;
            for (let i = 0; i < 3; i++) spawnMinion(e, 'swarm');
          }
          break;
        case 'enrage':
          if (e.hp < e.maxHp * 0.5 && !e.enraged) { e.enraged = true; e.baseSpeed *= 1.8; }
          break;
        case 'aura':
          // Spatial nearby query — was iterating every enemy each frame.
          forEachEnemyInRange(e.x, e.y, 100, (o) => {
            if (o === e) return;
            o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.005 * dt);
          });
          break;
        case 'teleport':
          if (e.bossTimer > 6 && !e.flying) {
            e.bossTimer = 0;
            // Skip ahead 4 tiles
            e.pathIdx = Math.min(pathLen - 1, e.pathIdx + 4);
            e.progress = e.pathIdx / (pathLen - 1);
            spawnRingFx(e.x, e.y, e.color);
          }
          break;
        case 'dasher': {
          // Slow base movement punctuated by short sprints. NO immunities, NO
          // tower removal — purely a timing test. Cycle: 4.5s slow walk →
          // 0.6s sprint at 4× speed → repeat. Visual ring on each dash.
          const cyc = 5.1;     // total cycle length
          const dashStart = 4.5;
          const phase = e.bossTimer % cyc;
          const sprinting = phase >= dashStart;
          if (sprinting !== !!e._dashSprinting) {
            e._dashSprinting = sprinting;
            spawnRingFx(e.x, e.y, sprinting ? '#ffd866' : e.color);
          }
          e._dashSpeedMul = sprinting ? 4.0 : 0.6;
          break;
        }
        case 'echo': {
          // At 75% / 50% / 25% HP, drop a "shadow echo" at the boss's current
          // path position. The echo is a slower brute that walks the rest of
          // the path independently with a fraction of the boss's HP. Threshold
          // list is initialized in setupBoss and consumed top→bottom.
          if (e.echoThresholds && e.echoThresholds.length) {
            const next = e.echoThresholds[0];
            if (e.hp <= e.maxHp * next) {
              e.echoThresholds.shift();
              spawnEchoMinion(e);
              spawnRingFx(e.x, e.y, '#9d6bff');
            }
          }
          break;
        }
      }
    }
    // Elite modifier behaviors (regen / teleport / phase)
    if (e.isElite) {
      e._eliteTimer = (e._eliteTimer || 0) + dt;
      if (e.regenPct) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * e.regenPct * dt);
      if (e.teleportEvery && e._eliteTimer >= e.teleportEvery) {
        e._eliteTimer = 0;
        e.pathIdx = Math.min(state.path.length - 1, e.pathIdx + e.teleportTiles);
        e._segPos = 0;
        spawnRingFx(e.x, e.y, e.eliteDef ? e.eliteDef.color : '#9fc0ff');
      }
      if (e.phaseEvery) {
        e._phaseCooldown = (e._phaseCooldown || e.phaseEvery) - dt;
        if (!e._phasing && e._phaseCooldown <= 0) { e._phasing = true; e._phaseTimer = e.phaseDuration; }
        if (e._phasing) {
          e._phaseTimer -= dt;
          if (e._phaseTimer <= 0) { e._phasing = false; e._phaseCooldown = e.phaseEvery; }
        }
      }
    }
    // Healer: heal nearby enemies (spatial-indexed — was O(N²) before).
    if (e.heals) {
      forEachEnemyInRange(e.x, e.y, 80, (o) => {
        if (o === e) return;
        o.hp = Math.min(o.maxHp, o.hp + o.maxHp * e.heals * dt);
      });
    }
    // Chilled fade
    if (e.chilled > 0) e.chilled -= dt;
    // Slow fade
    if (e.slowDur > 0) { e.slowDur -= dt; if (e.slowDur <= 0) { e.slow = 0; } }
    // Burn DoT
    if (e.burn && e.burn.dur > 0) {
      e.burn.dur -= dt;
      e.burn.tick -= dt;
      if (e.burn.tick <= 0) {
        damageEnemy(e, e.burn.dmg * 0.5, e.burn.from, false);
        e.burn.tick = 0.25;
      }
    }
    // Path hazards — TILE-based zones (2-6 tile spans). Each zone sets a
    // visual flag so drawEnemy can render an overlay (heal pulse / speed
    // streaks / cover bubble).
    e.inCover = false;
    e.inSanctum = false;
    e.inSurge = false;
    let surgeMul = 1;
    if (state.hazards && state.hazards.length) {
      const ex = Math.floor(e.x / CELL), ey = Math.floor(e.y / CELL);
      for (const h of state.hazards) {
        if (!h.onPath) continue;
        const inside = h.tiles ? h.tiles.some(t => t.gx === ex && t.gy === ey) : (h.gx === ex && h.gy === ey);
        if (!inside) continue;
        if (h.heal)      { e.hp = Math.min(e.maxHp, e.hp + e.maxHp * h.heal * dt); e.inSanctum = true; }
        if (h.speedMul)  { surgeMul = Math.max(surgeMul, h.speedMul); e.inSurge = true; }
        if (h.dmgReduce) { e.inCover = true; }
      }
    }
    // Speed calc
    const slowFactor = e.isBoss && e.bossMechanic === 'slowImmune' ? 1 : (1 - e.slow);
    const dashMul = e._dashSpeedMul || 1;   // dasher boss applies its own multiplier
    const speed = e.baseSpeed * slowFactor * surgeMul * dashMul;
    // Walk along path
    const pp = state.path;
    let remaining = speed * dt;
    while (remaining > 0 && e.pathIdx < pp.length - 1) {
      const a = pp[e.pathIdx], b = pp[e.pathIdx + 1];
      const segLen = Math.hypot(b.x - a.x, b.y - a.y);
      const segPos = e._segPos || 0;
      const togo = segLen - segPos;
      if (remaining >= togo) {
        remaining -= togo;
        e.pathIdx++;
        e._segPos = 0;
      } else {
        e._segPos = segPos + remaining;
        remaining = 0;
      }
    }
    // Compute position
    if (e.pathIdx >= pp.length - 1) {
      // Leaked — full bosses 5 lives, natural-spawn bosses 3, regulars 1.
      e.dead = true;
      const cost = e.isBoss ? (e.isNaturalBoss ? 3 : 5) : 1;
      leakLife(cost, e);
      continue;
    }
    const a = pp[e.pathIdx], b = pp[e.pathIdx + 1];
    const segLen = Math.hypot(b.x - a.x, b.y - a.y);
    const t = (e._segPos || 0) / segLen;
    e.x = a.x + (b.x - a.x) * t;
    e.y = a.y + (b.y - a.y) * t;
    e.angle = Math.atan2(b.y - a.y, b.x - a.x);
    e.progress = (e.pathIdx + t) / (pp.length - 1);
    // Marker flash decay
    if (e.markedFlash > 0) e.markedFlash -= dt;
  }
  // Remove dead — in-place to avoid the per-frame array allocation.
  compactInPlace(state.enemies, e => !e.dead);
}

function spawnMinion(boss, type) {
  const def = ENEMY_DEFS[type];
  const e = {
    id: Math.random(),
    type, def,
    hp: def.hp * Math.pow(ENEMY_HP_SCALE, state.wave - 1) * 0.5, maxHp: 0,
    speed: def.speed, baseSpeed: def.speed,
    gold: Math.round(def.gold * 0.5),
    progress: boss.progress, pathIdx: boss.pathIdx, _segPos: boss._segPos || 0,
    x: boss.x, y: boss.y, size: def.size, shape: def.shape, color: def.color,
    flying: false, angle: 0, slow: 0, slowDur: 0, stun: 0, burn: null,
    chilled: 0, dead: false
  };
  e.maxHp = e.hp;
  state.enemies.push(e);
  return e;
}

function leakLife(amt, enemy) {
  // LEAK INSURANCE — first leak per wave is FREE. Resets at wave start.
  // Doesn't apply to bosses (they leak for 3-5 lives — too costly to forgive).
  // Greedy elite gold steal still applies regardless.
  if (state._waveLeakBudget > 0 && enemy && !enemy.isBoss) {
    state._waveLeakBudget -= 1;
    state._savedT = state.time;
    state.camera.shakeAmt = Math.max(state.camera.shakeAmt, 3);
    pushToast('Leak saved! (1/wave)', '#7ee69b');
    if (enemy && enemy.stealGold && state.gold > 0) {
      const stolen = Math.min(enemy.stealGold, state.gold);
      state.gold -= stolen;
    }
    fireArtifactEvent('enemy_leaked', { amount: 0, enemy });
    return;
  }
  state.lives -= amt;
  state._hurtT = state.time;
  state._hurtAmt = Math.min(1, 0.45 + amt * 0.15);
  state.camera.shakeAmt = Math.max(state.camera.shakeAmt, 6);
  sfx('life');
  if (enemy && enemy.stealGold && state.gold > 0) {
    const stolen = Math.min(enemy.stealGold, state.gold);
    state.gold -= stolen;
  }
  fireArtifactEvent('enemy_leaked', { amount: amt, enemy });
  if (state.lives <= 0) gameOver();
}

function damageEnemy(enemy, dmg, source, shakeAmt, isCrit) {
  if (enemy.dead) return;
  // Mirror boss decoy: damaging the wrong one heals the real boss instead
  if (enemy.bossMechanic === 'mirror-decoy' && enemy.mirrorOf && !enemy.mirrorOf.dead) {
    enemy.mirrorOf.hp = Math.min(enemy.mirrorOf.maxHp, enemy.mirrorOf.hp + dmg * 0.5);
    spawnBurst(enemy.x, enemy.y, '#888e9e', 4);
    return;
  }
  // Phase elite — fully invulnerable during phase window
  if (enemy._phasing) return;
  // Elite Armored flat damage reduction
  if (enemy.dmgReduction) dmg *= (1 - enemy.dmgReduction);
  // Aura elite nearby — nearby enemies take less damage
  if (state.enemies && state.enemies.length) {
    for (const aura of state.enemies) {
      if (aura === enemy || aura.dead || !aura.auraRadius) continue;
      const adx = enemy.x - aura.x, ady = enemy.y - aura.y;
      if (adx*adx + ady*ady < aura.auraRadius * aura.auraRadius) { dmg *= (1 - aura.auraDmgReduction); break; }
    }
  }
  // Shielded front-hit (artifact may pierce some of this)
  if (enemy.shielded && source) {
    const dx = enemy.x - source.x, dy = enemy.y - source.y;
    const attackAngle = Math.atan2(dy, dx);
    const facing = enemy.angle;
    const diff = Math.abs(normalizeAngle(attackAngle - facing));
    if (diff > 2.2) {
      let red = enemy.shielded;
      if (state.artifactCache && state.artifactCache.shieldedPierce) red *= (1 - state.artifactCache.shieldedPierce);
      dmg *= (1 - red);
    }
  }
  // Howitzer (cannon A2) — bonus damage vs boss / elite / juggernaut.
  // Read the multiplier from the sub def if the source is a Howitzer.
  if (source && source.type === 'cannon' && source.subbranch === 'A2' && source.branch) {
    const sb = TOWER_DEFS.cannon.branches[source.branch] && TOWER_DEFS.cannon.branches[source.branch].subs[source.subbranch];
    if (sb && sb.bossDmgMul && (enemy.isBoss || enemy.isElite || (enemy.def && enemy.def.name === 'Juggernaut'))) {
      dmg *= sb.bossDmgMul;
    }
  }
  // Frostbite + shatter: chilled takes more dmg
  let bonus = 0;
  if (enemy.chilled > 0) {
    if (hasMut('frostbite')) bonus += 0.3;
    if (state.artifactCache && state.artifactCache.chilledDmgBonus) bonus += state.artifactCache.chilledDmgBonus;
  }
  // Frozen Gears: deeply-slowed (>=50%) take extra damage
  if (enemy.slow >= 0.5 && state.artifactCache && state.artifactCache.deepSlowDmgMul > 1) dmg *= state.artifactCache.deepSlowDmgMul;
  // Global shatter: every Frost B2 (Shatter) tower stacks dmg bonus vs chilled.
  // Description says "stacking across towers" — so each Shatter contributes.
  // Track the closest Shatter so we can credit it via assistDamage below.
  let shatterBonus = 0;
  let nearestShatter = null;
  let nearestShatterDist2 = Infinity;
  if (enemy.chilled > 0) {
    for (const t of state.towers) {
      if (t.subbranch !== 'B2' || t.type !== 'frost') continue;
      // Pull the actual sub def's bonus value (now 0.75 — was hardcoded 0.6).
      const sb = t.branch ? (TOWER_DEFS.frost.branches[t.branch] && TOWER_DEFS.frost.branches[t.branch].subs[t.subbranch]) : null;
      const sbBonus = (sb && typeof sb.shatterBonus === 'number') ? sb.shatterBonus : 0.75;
      shatterBonus += sbBonus;
      // Track nearest Shatter for assist attribution
      const dx = enemy.x - t.x, dy = enemy.y - t.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < nearestShatterDist2) { nearestShatterDist2 = d2; nearestShatter = t; }
    }
  }
  bonus += shatterBonus;
  dmg *= (1 + bonus);
  // Cover hazard — enemy takes reduced damage while inside a cover radius
  if (enemy.inCover) dmg *= 0.5;

  const pre = enemy.hp;
  enemy.hp -= dmg;
  if (dmg > 0) enemy._hitT = state.time;   // drives the white hit-flash + squash
  // Per-tower stats — clamp to actual damage applied (no overkill inflation)
  if (source && source.stats) {
    const actual = Math.min(dmg, pre);
    if (actual > 0) {
      source.stats.damageDealt += actual;
      // Track total damage delivered AND damage that was absorbed past the
      // enemy's HP threshold (overkill) so post-run analysis can flag towers
      // that were oversized for the wave they faced.
      source.stats.overkillDamage = (source.stats.overkillDamage || 0) + Math.max(0, dmg - actual);
      // Per-enemy-type damage breakdown — reveals where each tower actually does work.
      const eName = (enemy.def && enemy.def.name) ? enemy.def.name : (enemy.type || 'unknown');
      if (!source.stats.dmgByType) source.stats.dmgByType = {};
      source.stats.dmgByType[eName] = (source.stats.dmgByType[eName] || 0) + actual;
      // Live DPS: push event into 1-second sliding window. Each entry carries
      // the target enemy's id so getRecentDps can compute both the total 1s
      // DPS and the per-enemy 1s DPS (peak single-target). Pruned + peak-
      // tracked once per frame in tick().
      if (!source.stats.dpsWindow) source.stats.dpsWindow = [];
      source.stats.dpsWindow.push([state.time, actual, enemy.id]);
      // Shatter assist credit: if this hit was amplified by a Shatter, credit
      // the bonus delta to the nearest Shatter's assistDamage. The Shatter
      // itself doesn't deal direct damage, but its amplification is real and
      // measurable — this surfaces it in the panel/log.
      if (nearestShatter && nearestShatter !== source && shatterBonus > 0) {
        // Amplification share = (shatterBonus / (1+totalBonus)) of `actual`
        const ampShare = actual * (shatterBonus / (1 + bonus));
        if (!nearestShatter.stats.assistDamage) nearestShatter.stats.assistDamage = 0;
        nearestShatter.stats.assistDamage += ampShare;
      }
    }
  }
  if (state.showDmgNums) {
    // ONE-SECOND STACKING WINDOW. Each floater lives ~1s from spawn — hits
    // during that window roll into its running total, but life is NOT
    // refreshed and position is NOT re-anchored. After the floater dies,
    // the next hit spawns a fresh one. End result: a new number bubble
    // every second, each one summarizing that second's damage.
    let stacked = false;
    for (let i = state.damageNumbers.length - 1; i >= 0; i--) {
      const n = state.damageNumbers[i];
      if (n.enemyId !== enemy.id) continue;
      if (n.life <= 0) break;          // expired — fall through and spawn fresh
      // Roll the new damage into the existing number.
      n.value = (n.value || 0) + Math.round(dmg);
      n.text  = fmtMoney(n.value);
      // A new crit on a non-crit number upgrades the visual to crit (and
      // extends its remaining life slightly so the big-hit pop reads).
      if (isCrit && !n.crit) {
        n.crit    = true;
        n.color   = '#ffd866';
        n.maxLife = DMG_NUM_LIFE * 1.4;
        n.life    = Math.max(n.life, n.maxLife * 0.6);
      }
      n.bump = 1;                       // size kick on each hit
      stacked = true;
      break;
    }
    if (!stacked) {
      const life = isCrit ? DMG_NUM_LIFE * 1.4 : DMG_NUM_LIFE;
      const value = Math.round(dmg);
      state.damageNumbers.push({
        enemyId: enemy.id,
        value,
        x: enemy.x + (Math.random()-0.5)*10,
        y: enemy.y - enemy.size - 22,
        vy: isCrit ? -90 - Math.random()*15 : -50 - Math.random()*20,
        life,
        maxLife: life,
        text: fmtMoney(value),
        color: isCrit ? '#ffd866' : (source && source.type === 'tesla' ? '#d9b6ff' : (source && source.type === 'cannon' ? '#ffb380' : '#ffffff')),
        crit: !!isCrit,
        bump: 0,
        age: 0
      });
    }
  }
  if (dmg > 0) spawnHitFx(enemy.x, enemy.y, enemy.color);
  sfx('hit');
  if (enemy.hp <= 0) killEnemy(enemy, source, pre);
}

// Hard cap so even fully stacked frost+EMP+permafrost can't stop an enemy.
// At MAX_SLOW = 0.75 enemies always retain at least 25% of their base speed.
const MAX_SLOW = 0.75;

// Slow effects scale with the wave so they keep up with the enemy speed-creep
// curve (defined as 0.8% / wave in spawnEnemy). Slow scaling is slightly
// HIGHER (1.0% / wave) so the speed battle tilts a touch in the player's
// favor over time. Capped at +30% to avoid trivializing late-game enemies.
const SLOW_PER_WAVE   = 0.010;
const SLOW_SCALE_CAP  = 1.30;
function slowWaveScale() {
  const w = Math.max(0, (state.wave || 1) - 1);
  return Math.min(SLOW_SCALE_CAP, 1 + w * SLOW_PER_WAVE);
}

function applySlow(enemy, amt, dur) {
  if (enemy.isBoss && enemy.bossMechanic === 'slowImmune') return;
  if (enemy.slowImmuneElite) return;  // Juggernaut elite
  // Wraith-style slow resistance reduces both magnitude and duration
  if (enemy.def && enemy.def.slowResist) {
    amt *= (1 - enemy.def.slowResist);
    dur *= (1 - enemy.def.slowResist);
  }
  // Wave-scaled boost so slows keep pace with enemy speed creep.
  amt *= slowWaveScale();
  // Cap incoming slow at MAX_SLOW so a single source can't fully stop them.
  if (amt > MAX_SLOW) amt = MAX_SLOW;
  if (amt > enemy.slow) enemy.slow = amt;
  if (dur > enemy.slowDur) enemy.slowDur = dur;
  enemy.chilled = Math.max(enemy.chilled, Math.min(dur, 4));
}

function killEnemy(enemy, source, preHp) {
  if (enemy.dead) return;
  enemy.dead = true;
  // Gold — artifact multiplier applied before rounding so it compounds cleanly
  let g = enemy.gold;
  if (state.nextWaveGoldMul > 1) g *= state.nextWaveGoldMul;
  if (state.artifactCache && state.artifactCache.goldMul) g *= (1 + state.artifactCache.goldMul);
  g = Math.round(g);
  state.gold += g;
  state.goldEarned += g;
  // Fire artifact event hooks (Scavenger, Necromancer, World-Eater, etc.)
  fireArtifactEvent('enemy_killed', { enemy, source, gold: g });
  // Per-tower kill + gold stats
  if (source && source.stats) {
    source.stats.kills += 1;
    source.stats.goldFromKills += g;
  }
  // Gold Vein feature: bonus gold when the killing tower sits on one
  if (source && source.gx !== undefined && state.features) {
    const feat = state.features.find(f => f.gx === source.gx && f.gy === source.gy);
    if (feat && feat.goldPerKill) {
      state.gold += feat.goldPerKill;
      state.goldEarned += feat.goldPerKill;
      if (source.stats) source.stats.bonusGold += feat.goldPerKill;
    }
  }
  if (state.markedEnemyId === enemy.id) { state.gold += 50; state.goldEarned += 50; state.markedEnemyId = null; spawnBurst(enemy.x, enemy.y, '#ffcf4a', 20); }
  spawnDeathFx(enemy.x, enemy.y, enemy.color, enemy.size);
  sfx(enemy.isBoss ? 'boss' : 'death');
  if (enemy.isBoss) state.camera.shakeAmt = Math.max(state.camera.shakeAmt, 18);
  // Shard drop chance — full bosses guarantee, natural-spawn bosses likely,
  // elites likely, regulars rare. Regular rate is long-tail income;
  // elite/natural-boss/full-boss are spike rewards.
  const isNaturalBoss = enemy.isBoss && enemy.isNaturalBoss;
  const isFullBoss    = enemy.isBoss && !enemy.isNaturalBoss;
  const shardChance = isFullBoss     ? 1.0
                    : isNaturalBoss  ? 0.55
                    : enemy.isElite  ? 0.18
                    : 0.025;
  if (Math.random() < shardChance) {
    const count = isFullBoss     ? (3 + Math.floor(Math.random() * 3))
                : isNaturalBoss  ? 2
                : enemy.isElite  ? 2
                : 1;
    spawnShardDrop(enemy.x, enemy.y, count);
  }
  // Bloodbath
  state.bloodbathKills.push(state.time);
  while (state.bloodbathKills.length && state.time - state.bloodbathKills[0] > 2) state.bloodbathKills.shift();
  if (hasMut('bloodbath') && state.bloodbathKills.length >= 5) {
    state.bloodbathKills = [];
    // Find nearest tower to enemy
    let near = null, best = Infinity;
    for (const t of state.towers) {
      const dx = t.x - enemy.x, dy = t.y - enemy.y;
      const d = dx*dx + dy*dy;
      if (d < best) { best = d; near = t; }
    }
    if (near) { near._bloodbathUntil = state.time + 5; spawnRingFx(near.x, near.y, '#ff5a6e'); }
  }
  // Chain reaction — find nearest other enemy via spatial hash (was O(N)).
  if (hasMut('chainReaction') && Math.random() < 0.2) {
    let near = null, best = Infinity;
    // Scan widening: 120px search radius covers most adjacent enemies.
    forEachEnemyInRange(enemy.x, enemy.y, 120, (o, d2) => {
      if (o === enemy) return;
      if (d2 < best) { best = d2; near = o; }
    });
    if (near) {
      damageEnemy(near, Math.max(preHp, enemy.maxHp * 0.2), null, 0);
      state.zaps.push({ points: [{x: enemy.x, y: enemy.y},{x: near.x, y: near.y}], life: 0.2, color: '#ffcf4a' });
    }
  }
  // Phoenix: flamethrower B2 — explosion on kill. Phoenix subs may carry a
  // `phoenixRadiusMul` multiplier that widens the kill-chain explosion radius
  // (set on the sub def — currently 1.30 on Phoenix B2 itself).
  if (source && source.type === 'cannon' && source.subbranch === 'B2') {
    // Prefer the sub def's radius multiplier if present, else use the legacy 80px radius.
    let phoenixR = 80;
    const sb = source.branch && source.subbranch
      ? (TOWER_DEFS.cannon.branches[source.branch] && TOWER_DEFS.cannon.branches[source.branch].subs[source.subbranch])
      : null;
    if (sb && sb.phoenixRadiusMul) phoenixR *= sb.phoenixRadiusMul;
    explodeAt(enemy.x, enemy.y, phoenixR, 40 * Math.pow(1.1, state.wave), source);
  }
  // ELITE DROPS — artifact + modifier side-effects on death
  if (enemy.isElite) {
    const forced = enemy.forceLegendary ? 'legendary' : undefined;
    const art = rollArtifact(state.wave, forced);
    if (art) grantArtifact(art);
    if (enemy.onDeathSplit) {
      for (let i = 0; i < enemy.onDeathSplit; i++) {
        const m = spawnMinion(enemy, 'runner');
        if (m) { m.pathIdx = Math.max(0, m.pathIdx - i); m._segPos = 0;
                 if (m.pathIdx < state.path.length) { m.x = state.path[m.pathIdx].x; m.y = state.path[m.pathIdx].y; } }
      }
    }
    if (enemy.towerOfflineOnKill && source && source.cooldown !== undefined) {
      source.cooldown = Math.max(source.cooldown, enemy.towerOfflineOnKill);
      source._cursedUntil = state.time + enemy.towerOfflineOnKill;
    }
  }
  // Collector boss (W100) — killed: return the stolen artifact
  if (enemy.isBoss && enemy.stolenArtifact) {
    state.artifacts.push(enemy.stolenArtifact);
    rebuildArtifactCache();
    renderArtifactRow();
    spawnArtifactPickup({ ...enemy.stolenArtifact, desc: 'Returned from the Collector. ' + enemy.stolenArtifact.desc });
    enemy.stolenArtifact = null;
  }
  // BOSS DEATH PAYLOAD — every boss drops minions on death. Type and count
  // depend on the boss's mechanic + wave number. Mechanic-flavored choices:
  //   split     → tanks   (already its theme, kept consistent)
  //   slowImmune→ wraiths (slow-resistant fits the immunity)
  //   spawner   → swarm   (it was spawning swarms in life)
  //   regen     → brutes  (chunky, hard-to-finish)
  //   shield    → shielded (more shielded annoyance)
  //   teleport  → sprinters (fast follow-ups)
  //   enrage    → tanks   (heavy follow-ups)
  //   aura      → healers (last-ditch healing)
  //   mirror    → brutes  (more bodies)
  //   collector → juggernauts (heavy)
  //   dasher    → sprinters (speed theme)
  //   echo      → brutes   (more shadows)
  //   (no mechanic, natural-spawn boss) → tanks (chunky body drop)
  // Full-boss count: ~2-3 at W10, scales to ~7 by W100.
  // Natural-boss count: about half of that, since it's a more frequent spawn.
  if (enemy.isBoss) {
    const PAYLOAD = {
      split: 'tank', slowImmune: 'wraith', spawner: 'swarm', regen: 'brute',
      shield: 'shielded', teleport: 'sprinter', enrage: 'tank', aura: 'healer',
      mirror: 'brute', collector: 'juggernaut', dasher: 'sprinter', echo: 'brute'
    };
    // No mechanic on natural bosses → they drop tanks instead of runners,
    // matching the chunky/miniboss feel.
    const mtype = PAYLOAD[enemy.bossMechanic] || (enemy.isNaturalBoss ? 'tank' : 'runner');
    const baseN = enemy.isNaturalBoss
      ? (1 + Math.floor(Math.max(0, state.wave - 20) / 15))   // 1 → 2 around W35, 3 around W50
      : (2 + Math.floor(state.wave / 20));                     // W10:2, W30:3, W50:4, W100:7
    const count = mtype === 'swarm' ? baseN * 3 : baseN;       // swarms come in clusters
    for (let i = 0; i < count; i++) {
      const m = spawnMinion(enemy, mtype);
      if (m) {
        // Stagger along the path so they spread out instead of stacking on death point.
        m.pathIdx = Math.max(0, m.pathIdx - i);
        m._segPos = 0;
        if (m.pathIdx < state.path.length) {
          m.x = state.path[m.pathIdx].x;
          m.y = state.path[m.pathIdx].y;
        }
      }
    }
    // Visual flourish for natural bosses (full bosses already have their own death FX)
    if (enemy.isNaturalBoss) {
      spawnRingFx(enemy.x, enemy.y, '#ff3366');
      state.camera.shakeAmt = Math.max(state.camera.shakeAmt, 6);
    }
  }
}

function destroyTower(tower) {
  const idx = state.towers.indexOf(tower);
  if (idx < 0) return;
  state.towers.splice(idx, 1);
  spawnDeathFx(tower.x, tower.y, TOWER_DEFS[tower.type].color, 24);
  state.camera.shakeAmt = Math.max(state.camera.shakeAmt, 8);
  sfx('death');
  if (state.selectedTower === tower) state.selectedTower = null;
}

function explodeAt(x, y, radius, damage, source) {
  state.aoes.push({ x, y, r: 4, maxR: radius, life: 0.35, color: '#ff8c3a' });
  // Spatial-indexed nearby query — only buckets the explosion radius covers
  // are scanned, instead of every enemy on the field.
  forEachEnemyInRange(x, y, radius, (e) => damageEnemy(e, damage, source, false));
  state.camera.shakeAmt = Math.max(state.camera.shakeAmt, 4);
}

// ============================================================================
// 12. PROJECTILES
// ============================================================================
function updateProjectiles(dt) {
  for (const p of state.projectiles) {
    if (p.dead) continue;
    if (p.type === 'cannonball') {
      // Fly to targetX/targetY at speed
      const dx = p.targetX - p.x, dy = p.targetY - p.y;
      const d = Math.hypot(dx, dy);
      if (d < 10) {
        // Explode
        explodeAt(p.x, p.y, p.splash, p.damage, p.from);
        // p.stunOnHit was a legacy stun field (never assigned to projectiles
        // post-balance — kept for safety but converted to a heavy slow so it
        // can never produce a full stall).
        if (p.stunOnHit) {
          forEachEnemyInRange(p.x, p.y, p.splash, (e) => {
            applySlow(e, 0.75, p.stunOnHit);
          });
        }
        if (p.cluster) {
          for (let i = 0; i < p.cluster; i++) {
            const a = (i / p.cluster) * Math.PI * 2;
            const cx = p.x + Math.cos(a) * 28;
            const cy = p.y + Math.sin(a) * 28;
            explodeAt(cx, cy, p.splash * 0.7, p.damage * 0.5, p.from);
          }
        }
        state.camera.shakeAmt = Math.max(state.camera.shakeAmt, 3);
        p.dead = true;
      } else {
        p.x += (dx / d) * p.speed * dt;
        p.y += (dy / d) * p.speed * dt;
        // Arc: add vertical shift for visual? we'll handle in render
      }
      continue;
    }
    if (!p.target || p.target.dead) {
      // Fly in last direction fading
      p.life = (p.life || 0.3) - dt;
      if (p.life <= 0) { p.dead = true; continue; }
      p.x += (p.vx || 0) * dt;
      p.y += (p.vy || 0) * dt;
      continue;
    }
    const dx = p.target.x - p.x, dy = p.target.y - p.y;
    const d = Math.hypot(dx, dy);
    const step = p.speed * dt;
    if (d < step + (p.target.size || 10)) {
      // Hit target
      if (p.type === 'frost') {
        if (p.aoe) {
          forEachEnemyInRange(p.target.x, p.target.y, p.splash, (e) => {
            applySlow(e, p.slowAmt, p.slowDur);
            if (p.damage > 0) damageEnemy(e, p.damage, p.from, false);  // Ice Heart artifact
          });
          state.aoes.push({ x: p.target.x, y: p.target.y, r: 4, maxR: p.splash, life: 0.35, color: '#5ad6ff' });
          // Freezing aura — lingers ~2.5s, slowing enemies that walk through
          state.iceAuras.push({
            x: p.target.x, y: p.target.y,
            r: p.splash,
            life: 2.5, max: 2.5,
            slowAmt: p.slowAmt * 0.6,
            slowDur: 0.4,
            from: p.from
          });
        } else {
          applySlow(p.target, p.slowAmt, p.slowDur);
          if (p.damage > 0) damageEnemy(p.target, p.damage, p.from, false);  // Ice Heart artifact
        }
        // Glacier — heavy refresh-slow on the target (90%/1.0s, was 75%/0.6s).
        // Plus, with the new glacierAuraRange flag, also chill nearby enemies
        // in a small radius around the target — turns single-target into AOE.
        if (p.glacier) {
          applySlow(p.target, 0.90, 1.0);
          if (p.glacierAuraRange && p.glacierAuraRange > 0) {
            forEachEnemyInRange(p.target.x, p.target.y, p.glacierAuraRange, (e) => {
              if (e === p.target) return;
              applySlow(e, (p.slowAmt || 0.20) * 0.7, (p.slowDur || 1.0) * 0.6);
            });
          }
        }
        spawnBurst(p.target.x, p.target.y, '#b4eeff', 8);
        p.dead = true;
      } else {
        p.hitSet.add(p.target.id);
        damageEnemy(p.target, p.damage, p.from, false, p.isCrit);
        if (p.slowOnHit) applySlow(p.target, p.slowOnHit.amt, p.slowOnHit.dur);
        if (p.empSlow) applySlow(p.target, p.empSlow.amt, p.empSlow.dur);
        if (p.pierce > 0) {
          p.pierce--;
          // Find new target via spatial hash, capped at 180px reseek radius.
          let best = null, bestD2 = Infinity;
          forEachEnemyInRange(p.x, p.y, 180, (e, d2) => {
            if (p.hitSet.has(e.id)) return;
            if (d2 < bestD2) { bestD2 = d2; best = e; }
          });
          if (best) p.target = best; else p.dead = true;
        } else {
          p.dead = true;
        }
      }
    } else {
      p.vx = (dx / d) * p.speed;
      p.vy = (dy / d) * p.speed;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.trail) { p.trail.push({x: p.x, y: p.y}); if (p.trail.length > 6) p.trail.shift(); }
    }
  }
  compactInPlace(state.projectiles, p => !p.dead);
  // Tesla zaps fade
  for (const z of state.zaps) z.life -= dt;
  compactInPlace(state.zaps, z => z.life > 0);
  // AoE rings animate
  for (const a of state.aoes) {
    a.r += (a.maxR - a.r) * dt * 10;
    a.life -= dt;
  }
  compactInPlace(state.aoes, a => a.life > 0);
}

// ============================================================================
// 13. PARTICLES / FX
// ============================================================================
// Impact chips — quick, fast streaks so hits read as "crunch" not "puff".
function spawnHitFx(x, y, color) {
  if (state._simMode) return;
  const n = state.particles.length > PARTICLE_CAP * 0.7 ? 1 : 3;
  for (let i = 0; i < n; i++) {
    if (state.particles.length > PARTICLE_CAP) break;
    const a = Math.random() * Math.PI * 2;
    const s = 70 + Math.random() * 110;
    state.particles.push({
      kind: 'spark', x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.16 + Math.random()*0.14, max: 0.3,
      size: 1.3 + Math.random()*1.2, color, dayCol: i % 2 ? 'rgba(62,47,34,0.75)' : ORANGE
    });
  }
}
// Death — white-hot flash, fast streaks, tumbling shards of the body color,
// and a shockwave ring. Bosses scale everything up.
function spawnDeathFx(x, y, color, size) {
  const big = size >= 20;
  const room = PARTICLE_CAP - state.particles.length;
  if (room > 0) state.particles.push({ kind: 'dust', x, y, vx: 0, vy: 0, life: 0.5, max: 0.5, size: size * (big ? 1.8 : 1.2), color });
  const sparks = big ? 22 : 9, shards = big ? 12 : 5;
  for (let i = 0; i < sparks; i++) {
    if (state.particles.length > PARTICLE_CAP) break;
    const a = Math.random() * Math.PI * 2;
    const s = 90 + Math.random() * (big ? 260 : 170);
    state.particles.push({
      kind: 'spark', x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.3 + Math.random()*0.3, max: 0.6,
      size: 1.5 + Math.random()*2, color, dayCol: i % 3 === 0 ? 'rgba(62,47,34,0.7)' : ORANGE
    });
  }
  for (let i = 0; i < shards; i++) {
    if (state.particles.length > PARTICLE_CAP) break;
    const a = Math.random() * Math.PI * 2;
    const s = 50 + Math.random() * 110;
    state.particles.push({
      kind: 'debris', x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 22,
      life: 0.45 + Math.random()*0.35, max: 0.8,
      size: Math.max(2, size * (0.18 + Math.random() * 0.16)), color
    });
  }
  state.aoes.push({ x, y, r: 2, maxR: size * (big ? 2.4 : 1.5), life: 0.3, color });
}
function dayColor(c) {
  if (typeof c !== 'string' || c[0] !== '#' || c.length < 7) return ORANGE;
  const r = parseInt(c.substr(1, 2), 16), g = parseInt(c.substr(3, 2), 16), b = parseInt(c.substr(5, 2), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.72 ? ORANGE : c;
}
function spawnBurst(x, y, color, n) {
  if (state._simMode) return;
  for (let i = 0; i < n; i++) {
    if (state.particles.length > PARTICLE_CAP) break;
    const a = Math.random() * Math.PI * 2;
    const s = 40 + Math.random() * 80;
    state.particles.push({
      kind: 'spark', x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.4, max: 0.4, size: 2, color, dayCol: dayColor(color)
    });
  }
}
function spawnRingFx(x, y, color) {
  if (state._simMode) return;
  state.aoes.push({ x, y, r: 6, maxR: 40, life: 0.3, color });
}

// Evolution burst — three layered expanding rings (tier color → bright
// white core → tier color again), 30 spark particles in tier color, and
// a small camera shake. Called once when a tower crosses an evo threshold.
function spawnEvolutionFx(tower, evo) {
  const tier = getEvoTier(evo);
  const c    = tier ? tier.glow : TOWER_DEFS[tower.type].color;
  state.aoes.push({ x: tower.x, y: tower.y, r: 8,  maxR: 60, life: 0.45, color: c });
  state.aoes.push({ x: tower.x, y: tower.y, r: 14, maxR: 90, life: 0.55, color: '#ffffff' });
  state.aoes.push({ x: tower.x, y: tower.y, r: 20, maxR: 70, life: 0.40, color: c });
  state.particles.push({ kind: 'dust', x: tower.x, y: tower.y, vx: 0, vy: 0, life: 0.6, max: 0.6, size: 30, color: c });
  for (let i = 0; i < 30; i++) {
    if (state.particles.length >= PARTICLE_CAP) break;
    const ang = Math.random() * Math.PI * 2;
    const sp  = 90 + Math.random() * 110;
    state.particles.push({
      kind: 'spark', x: tower.x, y: tower.y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      life: 0.5 + Math.random() * 0.3, max: 0.8,
      size: 1.6 + Math.random() * 1.4, color: c, dayCol: dayColor(c)
    });
  }
  state.camera.shakeAmt = Math.max(state.camera.shakeAmt || 0, 6);
}

// ----- Shard drops -----
// When an enemy drops a shard, it spits out with an arc, settles for a moment,
// then homes in on the floating popup. On arrival the popup increments and
// stays visible briefly. Popup hides itself when nothing has arrived for a bit.
function spawnShardDrop(x, y, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    state.shardDrops.push({
      x, y,
      vx: Math.cos(a) * (40 + Math.random() * 60),
      vy: -160 - Math.random() * 60,   // pop upward
      phase: 'spit',
      phaseTimer: 0,
      arrived: false
    });
  }
}

// Resolve current popup target in WORLD coords so flying shards can home onto it.
// The popup is always laid out (opacity-gated), so its bounding rect is always valid.
function getShardPopupWorldPos() {
  const popup = document.getElementById('shard-popup');
  const cv = document.getElementById('cv');
  if (!popup || !cv) return null;
  const r = popup.getBoundingClientRect();
  const c = cv.getBoundingClientRect();
  const sx = r.left + r.width  / 2 - c.left;
  const sy = r.top  + r.height / 2 - c.top;
  return screenToWorld(sx, sy);
}

function updateShardDrops(dt) {
  const target = getShardPopupWorldPos();
  for (const s of state.shardDrops) {
    if (s.arrived) continue;
    s.phaseTimer += dt;
    if (s.phase === 'spit') {
      // Physics arc — feels like the enemy spit it out
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 320 * dt;            // gravity
      s.vx *= Math.pow(0.94, dt * 60);  // air friction (frame-rate independent)
      // After ~0.45s, switch to homing
      if (s.phaseTimer >= 0.45) { s.phase = 'home'; s.phaseTimer = 0; }
    } else if (s.phase === 'home') {
      if (!target) continue;
      const dx = target.x - s.x, dy = target.y - s.y;
      const d = Math.hypot(dx, dy);
      // Accelerating homing — feels snappy
      const speed = 220 + s.phaseTimer * 1400;
      const step = Math.min(d, speed * dt);
      if (d < 18) {
        s.arrived = true;
        meta.shards += 1;
        state.shardPopupGained += 1;
        state.shardPopupTimer = 2.4;
        showShardPopup();
        sfx('coin');
        saveMeta();
      } else {
        s.x += (dx / d) * step;
        s.y += (dy / d) * step;
      }
    }
  }
  compactInPlace(state.shardDrops, s => !s.arrived);
  // Tick popup display timer
  if (state.shardPopupTimer > 0) {
    state.shardPopupTimer -= dt;
    if (state.shardPopupTimer <= 0) hideShardPopup();
  }
}

function showShardPopup() {
  const popup = document.getElementById('shard-popup');
  const total = document.getElementById('shard-popup-total');
  const gain  = document.getElementById('shard-popup-gain');
  if (!popup || !total) return;
  popup.classList.add('show');
  total.textContent = meta.shards;
  // Bump animation on the total
  total.classList.remove('bump');
  void total.offsetWidth;
  total.classList.add('bump');
  // Gain badge: "+N" if multiple recent gains
  if (state.shardPopupGained > 1) {
    gain.textContent = ' +' + state.shardPopupGained;
  } else {
    gain.textContent = '';
  }
}

function hideShardPopup() {
  const popup = document.getElementById('shard-popup');
  if (!popup) return;
  popup.classList.remove('show');
  state.shardPopupGained = 0;
}

// Lingering ice aura zones from Frost Blizzard AOE — slow nearby enemies
// over time and render as a translucent fog of cyan + drifting snowflakes.
function updateIceAuras(dt) {
  if (!state.iceAuras || !state.iceAuras.length) return;
  for (const a of state.iceAuras) {
    a.life -= dt;
    // Re-apply slow each tick (spatial-indexed — was iterating all enemies).
    forEachEnemyInRange(a.x, a.y, a.r, (e) => applySlow(e, a.slowAmt, a.slowDur));
    // Spawn drifting snowflake particles inside the aura
    if (Math.random() < 0.5 && state.particles.length < PARTICLE_CAP) {
      const ang = Math.random() * Math.PI * 2;
      const dist = Math.random() * a.r;
      state.particles.push({
        kind: 'spark',
        x: a.x + Math.cos(ang) * dist,
        y: a.y + Math.sin(ang) * dist - 4,
        vx: (Math.random() - 0.5) * 14,
        vy: 6 + Math.random() * 12,
        life: 0.7, max: 0.8,
        size: 1.1 + Math.random() * 0.7,
        color: '#b4eeff'
      });
    }
  }
  compactInPlace(state.iceAuras, a => a.life > 0);
}

function updateParticles(dt) {
  for (const p of state.particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    // Streaks bleed speed fast (snappy), debris glides a little longer.
    const drag = p.kind === 'debris' ? 3 : 4.5;
    p.vx *= Math.max(0, 1 - dt * drag);
    p.vy *= Math.max(0, 1 - dt * drag);
    if (p.vr) { p.rot += p.vr * dt; p.vr *= Math.max(0, 1 - dt * 2); }
    p.life -= dt;
  }
  compactInPlace(state.particles, p => p.life > 0);
  for (const n of state.damageNumbers) {
    n.y += n.vy * dt;
    n.vy += 50 * dt;
    n.life -= dt;
    if (n.bump > 0) n.bump = Math.max(0, n.bump - dt * 6);  // pop kick decays in ~0.16s
  }
  compactInPlace(state.damageNumbers, n => n.life > 0);
}

// ============================================================================
// 14. UPGRADES & BRANCH LOGIC
// ============================================================================
function tryUpgrade(tower) {
  // Must be able to afford the upgrade BEFORE opening any choice modal
  const c = upgradeCost(tower);
  if (state.gold < c) return;
  if (tower.level === 5 && !tower.branch) { showBranchChoice(tower, 'branch'); return; }
  if (tower.level === 10 && !tower.subbranch) { showBranchChoice(tower, 'sub');    return; }
  act('upgrade', { tower });
  renderPanel();
  updateTopBar();
}

// Color codes used by the branch/specialize modal so each upgrade has a
// distinct visual identity (border, top accent stripe, tag pill, glow).
// Branch A is warm (offensive/heavy lean), Branch B is cool (precise/utility lean).
// Sub-branch colors are consistent across all towers so the player learns the pattern:
//   A1 = orange (aggressive/raw),  A2 = gold (utility/control),
//   B1 = green  (precision/cleanse), B2 = purple (exotic/finisher).
const BRANCH_COLORS = { A: '#ffb84a', B: '#6caaff' };
const SUB_COLORS    = { A1: '#ff8c3a', A2: '#ffd866', B1: '#7ee69b', B2: '#c190ff' };

function showBranchChoice(tower, which, isFree) {
  // isFree: true if the upgrade triggering this choice was a free level-up
  // (boon/encounter/mutator). If false/undefined, the player paid normally.
  // A co-op guest's choice doesn't freeze the shared game; the host applies it.
  if (NET.role !== 'guest') pushModalPause();
  const modal = document.getElementById('modal');
  const def = TOWER_DEFS[tower.type];
  // Branch modal picks up the tower's signature color so each tower's spec
  // choice modal is visually distinct.
  let html = `<div class="modal-content">`;
  // What each option actually does to this tower one level up (same stat pipeline as the board)
  const now = computeTowerStats(tower);
  const preview = (patch) => {
    const nx = computeTowerStats(Object.assign({}, tower, patch, { level: tower.level + 1, _statsCache: null, _statsCacheFrame: -1 }));
    const row = (label, a, b, digits, pct) => {
      const f = v => pct ? Math.round(v * 100) + '%' : fmtStat(v, digits);
      return `<span class="chip"><b>${label}</b>${f(b)}${pct ? '' : deltaText(a, b, digits)}</span>`;
    };
    if (tower.type === 'beacon') return row('BUFF', now.buffDmg || 0, nx.buffDmg || 0, 0, true) + row('RATE', now.buffFireRate || 0, nx.buffFireRate || 0, 0, true) + row('RANGE', now.range, nx.range);
    return row('DMG', now.damage, nx.damage, nx.damage < 10 ? 1 : 0) + row('RATE', now.fireRate, nx.fireRate, 2) + row('RANGE', now.range, nx.range);
  };
  const portrait = (patch) => `<canvas class="bc-portrait" data-patch='${JSON.stringify(patch)}' width="72" height="72"></canvas>`;
  // What picking costs — the same price the upgrade button showed (2× at the
  // specialise step), or free when a boon/encounter level triggered the choice.
  const price = isFree ? 0 : upgradeCost(tower);
  const priceLine = price ? ` Picking costs <strong>$${fmtMoney(price)}</strong>.` : ' This level is <strong>free</strong>.';
  modal.dataset.noEsc = '';
  html += modalFunds();
  if (which === 'branch') {
    html += `<h2>Choose Path — ${def.name}</h2>`;
    html += `<div class="sub">This choice is permanent for this tower.${priceLine}</div>`;
    html += `<div class="choice-grid two">`;
    for (const k of ['A','B']) {
      const br = def.branches[k];
      const col = BRANCH_COLORS[k];
      html += `<div class="choice colored" data-branch="${k}" style="--cc:${col};">
        <div class="accent-bar"></div>
        ${portrait({ branch: k })}
        <div class="tag">Path ${k}</div>
        <h3>${br.name}</h3>
        <div class="desc">${br.desc}</div>
        <div class="bc-stats">${preview({ branch: k })}</div>
      </div>`;
    }
    html += `</div>`;
  } else {
    const branchCol = BRANCH_COLORS[tower.branch];
    html += `<h2>Choose Specialization</h2>`;
    html += `<div class="sub">Refine your <strong style="color:color-mix(in srgb, ${branchCol} 45%, var(--ink))">${def.branches[tower.branch].name}</strong>.${priceLine}</div>`;
    html += `<div class="choice-grid two">`;
    for (const k of Object.keys(def.branches[tower.branch].subs)) {
      const sb = def.branches[tower.branch].subs[k];
      // Per-tower-per-sub tint so the modal preview matches what the tower
      // will actually look like once specialized.
      const col = SUB_TINTS[`${tower.type}.${k}`] || SUB_COLORS[k];
      html += `<div class="choice colored" data-sub="${k}" style="--cc:${col};">
        <div class="accent-bar"></div>
        ${portrait({ subbranch: k })}
        <div class="tag">${k} · Specialization</div>
        <h3>${sb.name}</h3>
        <div class="desc">${sb.desc}</div>
        <div class="bc-stats">${preview({ subbranch: k })}</div>
      </div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  modal.innerHTML = html;
  modal.style.display = 'flex';
  modal.querySelectorAll('canvas.bc-portrait').forEach(cv => {
    try {
      const d = Object.assign({}, tower, JSON.parse(cv.dataset.patch), { level: tower.level + 1, angle: -Math.PI / 4, buildAnim: 0, _shootAnim: 0, _evoAnimUntil: 0, _statsCache: null, _statsCacheFrame: -1 });
      _sizeThumb(cv); cv.style.width = cv.style.height = '72px';
      renderTowerIcon(cv, d, null, { zoom: 0.85, cx: 0.45, cy: 0.43 });
      _thumbGround(cv.getContext('2d'), cv.width, cv.height);
    } catch (err) { /* portrait is cosmetic */ }
  });
  modal.querySelectorAll('.choice').forEach(el => {
    el.onclick = () => {
      const choice = el.dataset.branch || el.dataset.sub;
      modal.style.display = 'none';
      if (NET.role === 'guest') { act('upgrade', { tower, choice }); return; }
      popModalPause();   // restore prior pause state (may stay paused if nested or manually paused)
      applyBranchChoice(tower, which, choice, isFree);
    };
  });
}
// Set a tower's path / specialization and take it past the threshold level.
// Shared by the choice modal and by a co-op guest's upgrade request.
function applyBranchChoice(tower, which, choice, isFree) {
  // Price is fixed BEFORE the choice is applied — upgradeCost() includes the
  // 2× specialize premium only while the tower is still unspecialized.
  const c = isFree ? 0 : upgradeCost(tower);
  if (which === 'branch') {
    tower.branch = choice;
    if (tower.stageAnims) tower.stageAnims.branch = state.time;
    recordCodexDiscovery('branch', `${tower.type}.${choice}`);
  } else {
    tower.subbranch = choice;
    if (tower.stageAnims) tower.stageAnims.sub = state.time;
    recordCodexDiscovery('sub', `${tower.type}.${choice}`);
  }
  // Pay only if this branch choice was triggered by a paid upgrade.
  // Free triggers (boons/encounters/Random Acts/Monolith) skip the cost.
  if (!isFree) {
    state.gold -= c;
    if (tower.stats) tower.stats.totalCost += c;
  }
  // Now perform the actual increment past the threshold (branch is set,
  // so upgradeTower won't re-open the modal)
  upgradeTower(tower, true);
  // Apply any free levels that were queued behind this choice
  const pending = tower._pendingFreeLevels || 0;
  tower._pendingFreeLevels = 0;
  if (pending > 0) freeUpgrade(tower, pending);
  renderPanel();
  updateTopBar();
}

// freeUpgrade — applies N free level-ups in a row, but if a branch threshold
// gates progress (modal opens), queues the remaining levels for the modal
// handler to apply post-choice. This is the right entry point for any
// system that grants multiple free levels (boons, encounters, etc.).
function freeUpgrade(tower, count) {
  for (let k = 0; k < count; k++) {
    const before = tower.level;
    upgradeTower(tower, true);
    if (tower.level === before) {
      // upgradeTower opened the branch-choice modal instead of incrementing.
      // Queue the rest so the modal handler can pick up where we left off.
      tower._pendingFreeLevels = (tower._pendingFreeLevels || 0) + (count - 1 - k);
      return;
    }
  }
}

// Format big numbers as K / M / B for readability. Keeps short numbers
// (< 10,000) as plain integers so early-game costs read normally.
function fmtMoney(n) {
  n = Math.round(n || 0);
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'K';
  return n.toLocaleString();
}

// Cached previous values so we can pulse the stat block when a number ticks up/down.
let _prevWave = -1, _prevLives = -1, _prevGold = -1;
// Forecast HP for the default "red square" Tank enemy at a given wave, mirroring
// the multiplier stack in spawnEnemy() (HP scale + late-game compound + active
// HP-modifying mutators). Used for the wave-stat HP cue and for tooltips.
function tankHpAtWave(wave) {
  const def = ENEMY_DEFS.tank;
  if (!def) return 0;
  const w = Math.max(1, wave || 1);
  let hpMul = Math.pow(ENEMY_HP_SCALE, w - 1);
  if (w > LATE_WAVE) hpMul *= Math.pow(LATE_HP_SCALE, w - LATE_WAVE);
  if (hasMut('boomEconomy')) hpMul *= 1.8;
  if (hasMut('fortified'))   hpMul *= 1.5;
  return Math.round(def.hp * hpMul);
}

function updateTopBar() {
  // Called every frame — only cheap text updates. Mutator chips render on change only.
  const w = state.wave || 0;
  const l = state.lives;
  const g = state.gold;
  const elW = document.getElementById('ui-wave');
  const elL = document.getElementById('ui-lives');
  const elG = document.getElementById('ui-gold');
  if (w !== _prevWave) { elW.textContent = w || '—'; if (_prevWave !== -1) pulseStat(elW); _prevWave = w; }
  if (l !== _prevLives) { elL.textContent = l;        if (_prevLives !== -1) pulseStat(elL, l < _prevLives); _prevLives = l; }
  if (g !== _prevGold)  {
    // Gold ticks up constantly mid-wave — only pulse on spends and on big
    // gains so the stat doesn't strobe through every kill.
    elG.textContent = '$' + fmtMoney(g);
    if (_prevGold !== -1 && (g < _prevGold || g - _prevGold >= 50)) pulseStat(elG, g < _prevGold);
    _prevGold = g;
  }
  // Wave progress meter — share of this wave's roster already dealt with.
  const progWrap = document.getElementById('ui-wave-prog-wrap');
  if (progWrap) {
    const on = state.waveInProgress && state._waveTotal > 0;
    if (progWrap.classList.contains('on') !== on) progWrap.classList.toggle('on', on);
    if (on) {
      const left = state.enemiesToSpawn.length + state.enemies.length;
      const pct = Math.max(0, Math.min(100, (1 - left / state._waveTotal) * 100));
      const bar = document.getElementById('ui-wave-prog');
      const wTxt = pct.toFixed(1) + '%';
      if (bar.style.width !== wTxt) bar.style.width = wTxt;
    }
  }
  // Wave HP cue — Tank HP at current wave, formatted compact with K/M suffix.
  const elHp = document.getElementById('ui-hp');
  if (elHp) {
    // During a wave: this wave's tank. Between waves: the one you're building for.
    const wv = state.waveInProgress ? Math.max(1, w) : w + 1, hp = tankHpAtWave(wv);
    const text = `W${wv} tank ${fmtMoney(hp)} HP`;
    if (elHp.textContent !== text) { elHp.textContent = text; elHp.title = `HP of a Tank (the baseline heavy enemy) in wave ${wv}, after mutators`; }
  }
}
function pulseStat(el, down) {
  el.classList.remove('pulse', 'down');
  void el.offsetWidth;  // reflow so animation restarts
  el.classList.add('pulse');
  if (down) el.classList.add('down');
}

function renderArtifactRow() {
  // Rebuilds artifact chips. Called on add/remove AND on active-state change
  // (arm/disarm) so the visual reflects ready/armed/cooldown immediately.
  const bar = document.getElementById('artifacts-bar');
  if (!bar) return;
  if (!state.artifacts || state.artifacts.length === 0) { bar.innerHTML = ''; return; }
  bar.innerHTML = state.artifacts.map(a => {
    const rc = ARTIFACT_RARITY[a.rarity].color;
    const rn = ARTIFACT_RARITY[a.rarity].name;
    const isActive = !!a.active;
    const s = isActive ? state.artifactState[a.id] : null;
    let stateClass = '', badge = '', tipState = '';
    if (isActive && s) {
      if (s.armed)        { stateClass = 'armed';    badge = '!'; tipState = '<br><span style="color:#ffd866;font-weight:700;">ARMED — fires next wave</span>'; }
      else if (s.cd > 0)  { stateClass = 'cooldown'; badge = String(s.cd); tipState = `<br><span style="color:#a7b0c6;">Cooldown: ${s.cd} wave${s.cd === 1 ? '' : 's'}</span>`; }
      else                { stateClass = 'ready'; tipState = '<br><span style="color:#7ee69b;font-weight:700;">Ready — click to arm</span>'; }
    }
    // Per-artifact lifetime stat — currently only Necromancer tracks earnings,
    // but the pattern (state._artifactStats[<id>]) makes it trivial to extend
    // for Scavenger / Last Ember / etc. later. Shown as a green "+$X" line at
    // the bottom of the hover tooltip so the player can see the contribution.
    let tipStat = '';
    if (a.id === 'necromancer' && state._artifactStats && state._artifactStats.necromancer) {
      tipStat = `<br><span style="color:#7ee69b;font-weight:700;">Earned: +$${fmtMoney(state._artifactStats.necromancer)}</span>`;
    }
    return `<div class="art-chip ${stateClass}" style="--rc:${rc}" data-id="${a.id}">
      ${a.icon || '◆'}
      ${badge ? `<span class="art-badge">${badge}</span>` : ''}
      <div class="art-tip"><span class="r">${rn}</span><strong>${a.name}</strong>${a.desc}${tipState}${tipStat}</div>
    </div>`;
  }).join('');
  // Wire click handlers for active artifacts (arm/disarm toggle)
  // PLUS a mouseenter refresh on each chip so live-tracking stats (e.g.
  // Necromancer's lifetime earnings) read the latest value at hover time.
  bar.querySelectorAll('.art-chip').forEach(chip => {
    chip.addEventListener('mouseenter', () => {
      // Cheap refresh of just THIS chip's tooltip so we don't blow away listeners.
      const id = chip.dataset.id;
      const a = state.artifacts.find(x => x.id === id);
      if (!a) return;
      const tipEl = chip.querySelector('.art-tip');
      if (!tipEl) return;
      const rn = ARTIFACT_RARITY[a.rarity].name;
      let tipState = '';
      if (a.active) {
        const s = state.artifactState[id];
        if (s) {
          if (s.armed)        tipState = '<br><span style="color:#ffd866;font-weight:700;">ARMED — fires next wave</span>';
          else if (s.cd > 0)  tipState = `<br><span style="color:#a7b0c6;">Cooldown: ${s.cd} wave${s.cd === 1 ? '' : 's'}</span>`;
          else                tipState = '<br><span style="color:#7ee69b;font-weight:700;">Ready — click to arm</span>';
        }
      }
      let tipStat = '';
      if (a.id === 'necromancer' && state._artifactStats && state._artifactStats.necromancer) {
        tipStat = `<br><span style="color:#7ee69b;font-weight:700;">Earned: +$${fmtMoney(state._artifactStats.necromancer)}</span>`;
      }
      tipEl.innerHTML = `<span class="r">${rn}</span><strong>${a.name}</strong>${a.desc}${tipState}${tipStat}`;
    });
    chip.onclick = () => {
      const id = chip.dataset.id;
      const a = state.artifacts.find(x => x.id === id);
      if (!a || !a.active) return;
      const s = state.artifactState[id];
      if (!s || s.cd > 0) return;
      act('relic', { id });
    };
  });
}

// Lightweight on-screen toast — uses the artifact-popup-stack so it appears
// in the same screen position as artifact pickups but with a simpler layout.
// Used for "Leak saved!", "Mulligan available", "Boss incoming", etc.
// FLOATING TOOLTIP — relic chips, mutator chips, path pills and the level track
// keep their tooltip markup inside them (as .art-tip / .tooltip / .tip-pop),
// but the side card clips its edges. So one #ftip on <body> mirrors whichever
// is hovered, sits below the chip (above if there's no room) and is clamped to
// the window. It re-syncs while shown so live numbers (relic earnings) stay current.
(function initFloatTip() {
  const tip = document.getElementById('ftip'); if (!tip) return;
  const SRC = ':scope > .art-tip, :scope > .tooltip, :scope > .tip-pop';
  let host = null, timer = 0;
  const hostOf = el => el && el.closest ? el.closest('.art-chip, .mut-chip, .pill, .track .nd') : null;
  function hide() { host = null; tip.classList.remove('show'); clearInterval(timer); }
  function place() {
    const src = host && host.isConnected && host.querySelector(SRC);
    if (!src) return hide();
    if (tip.innerHTML !== src.innerHTML) tip.innerHTML = src.innerHTML;
    const isArt = src.classList.contains('art-tip');
    tip.classList.toggle('rc', isArt);
    if (isArt) tip.style.setProperty('--rc', getComputedStyle(host).getPropertyValue('--rc').trim() || 'var(--or)');
    // #ftip is zoomed with the HUD: its own px are UI px, the window's are screen px.
    const u = UI_SCALE, r = host.getBoundingClientRect(), tw = tip.offsetWidth * u, th = tip.offsetHeight * u, m = 8;
    const x = Math.max(m, Math.min(innerWidth - tw - m, r.left + r.width / 2 - tw / 2));
    let y = r.bottom + 8 * u;
    if (y + th > innerHeight - m) y = Math.max(m, r.top - 8 * u - th);
    tip.style.left = (x / u) + 'px'; tip.style.top = (y / u) + 'px';
  }
  document.addEventListener('mouseover', e => {
    const h = hostOf(e.target);
    if (h === host) return;
    if (!h) return hide();
    host = h; tip.classList.add('show'); place();
    clearInterval(timer); timer = setInterval(place, 200);
  });
  document.addEventListener('mouseout', e => { if (host && !host.contains(e.relatedTarget)) hide(); });
})();

function pushToast(text, color) {
  const stack = document.getElementById('artifact-popup-stack');
  if (!stack) return;
  if (state._simMode) return;   // No on-screen UI in sim mode.
  const pop = document.createElement('div');
  pop.className = 'art-pop';
  pop.style.setProperty('--rc', color || '#9fc0ff');
  pop.style.padding = '8px 14px';
  pop.style.fontWeight = '700';
  pop.style.fontSize = '13px';
  pop.style.color = `color-mix(in srgb, ${color || '#9fc0ff'} 45%, var(--ink))`;   // game pastels are too pale for text on stone
  pop.innerHTML = `<div style="white-space:nowrap;">${text}</div>`;
  stack.appendChild(pop);
  const remove = () => { if (pop.parentNode) { pop.style.opacity = '0'; pop.style.transform = 'translateX(-20px)'; setTimeout(() => pop.remove(), 250); } };
  pop.addEventListener('click', remove);
  setTimeout(remove, 2200);
}

function spawnArtifactPickup(art) {
  const stack = document.getElementById('artifact-popup-stack');
  if (!stack) return;
  const rc = ARTIFACT_RARITY[art.rarity].color;
  const rn = ARTIFACT_RARITY[art.rarity].name;

  stack.appendChild(pop);
  // Self-dismiss after 4s, or click to dismiss
  const remove = () => { if (pop.parentNode) { pop.style.opacity = '0'; pop.style.transform = 'translateX(-20px)'; setTimeout(() => pop.remove(), 300); } };
  pop.addEventListener('click', remove);
  setTimeout(remove, 4000);
}

// Paint a real tower render (same drawTower() the board uses) into a small
// canvas. Swaps the global ctx for the duration; _drawingIcon suppresses
// any world-space side effects (spark particles) inside drawTower.
let _drawingIcon = false;
function makeDisplayTower(type, level) {
  const lv = level || 1;
  const on = (min) => lv >= min ? -999 : -1;
  return {
    id: 0.37, type, gx: -99, gy: -99, x: 0, y: 0, level: lv,
    branch: null, subbranch: null, masteries: [], angle: -Math.PI / 4,
    buildAnim: 0, _shootAnim: 0, _bloodbathUntil: 0, _evoAnimUntil: 0,
    stageAnims: { core: -999, inner: on(3), outer: on(5), orbital: on(7), branch: -1, sub: -1, mastery: -1 }
  };
}
function renderTowerIcon(canvas, typeOrTower, level, opts) {
  if (!canvas) return;
  const g = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const src = typeof typeOrTower === 'string' ? makeDisplayTower(typeOrTower, level) : typeOrTower;
  const t = Object.assign({}, src, { x: 0, y: 0 });
  if (typeof typeOrTower === 'string') t.gx = t.gy = -99;
  const zoom = (opts && opts.zoom) || 1;
  const prev = ctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, w, h);
  const sc = (Math.min(w, h) / 64) * zoom;
  const ox = (opts && opts.cx != null ? opts.cx : 0.5) * w, oy = (opts && opts.cy != null ? opts.cy : 0.5) * h;
  g.setTransform(sc, 0, 0, sc, ox, oy);
  ctx = g;
  _drawingIcon = true;
  try { drawTower(t); } catch (e) { /* icon is cosmetic — never break the UI over it */ }
  _drawingIcon = false;
  ctx = prev;
}

const _masteryLabel = { dmg: 'Damage', range: 'Range', fireRate: 'Fire rate', splash: 'Splash' };

    const bd = (nx.buffDmg || 0) - (now.buffDmg || 0), bf = (nx.buffFireRate || 0) - (now.buffFireRate || 0);
    if (Math.abs(bd) > 0.0005) parts.push(`${bd > 0 ? '+' : '−'}${Math.abs(Math.round(bd * 100))}% buff`);
    if (Math.abs(bf) > 0.0005) parts.push(`${bf > 0 ? '+' : '−'}${Math.abs(Math.round(bf * 100))}% rate buff`);

    const dd = (nx.damage || 0) - (now.damage || 0), df = (nx.fireRate || 0) - (now.fireRate || 0);

// Per-modal theme color sets the accent stripe, header gradient, border tint,
// and outer glow. Each modal-opener passes its own theme so the popup itself
// reads as "shop" or "shrine" or "boon" or whatever it is, not a generic dialog.
// Funds + lives badge for popups that spend either (encounters, boons, branch
// picks) — the side card is hidden behind the blurred backdrop while they're up.
function modalFunds() {
  return `<div class="modal-funds"><span>Funds<b>$${fmtMoney(state.gold)}</b></span><span>Lives<b class="lv">${state.lives}</b></span></div>`;
}
function showModalHTML(html, theme) {
  const modal = document.getElementById('modal');
  modal.dataset.noEsc = '';
  const themeAttr = theme ? ` style="--theme:${theme};"` : '';
  modal.innerHTML = `<div class="modal-content"${themeAttr}>${html}</div>`;
  modal.style.display = 'flex';
  return modal;
}

function hideModal() {
  document.getElementById('modal').style.display = 'none';
  document.getElementById('modal').dataset.noEsc = '';
  // SAFETY NET — when the modal element actually hides we wipe the pause
  // depth and restore whatever the pre-modal state was. Prevents the game
  // from getting stuck paused if a push isn't matched 1:1 with a pop
  // (e.g. when showModalHTML overwrites an existing modal's contents
  // mid-flow, like a boon/encounter firing during a specialize choice).
  if ((state._modalDepth || 0) > 0) {
    state._modalDepth = 0;
    state.paused = !!state._prePauseState;
  }
}

function showMutatorPick() {
  // Runs once at start of run: pick 3 unique mutators from the ACTIVE pool.
  // Pool is WEIGHTED — each mutator's stack count from the shop adds a
  // weight (e.g. a mutator bought 3× is 3× as likely to roll than a 1×).
  // startUnlocked items are always weight 1 and free.
  const weighted = [];
  for (const k of Object.keys(MUTATOR_POOL)) {
    const m = MUTATOR_POOL[k];
    if (m.startUnlocked) {
      weighted.push(k);   // base weight 1
    } else if (isInPool('mutators', k)) {
      const stacks = Math.max(1, getMutatorStacks(k));
      for (let i = 0; i < stacks; i++) weighted.push(k);
    }
  }
  // Pick 3 unique with weighted RNG — each draw removes the picked item's
  // entries from the bag so we don't roll duplicates of the same mutator.
  const picked = [];
  const bag = weighted.slice();
  while (picked.length < 3 && bag.length) {
    const idx = Math.floor(Math.random() * bag.length);
    const k   = bag[idx];
    picked.push(k);
    for (let i = bag.length - 1; i >= 0; i--) if (bag[i] === k) bag.splice(i, 1);
  }
  state.activeMutators = picked;
  // Apply
  applyMutatorStart();
  renderMutatorsBar();
  updateTopBar();
}

function applyMutatorStart() {
  if (hasMut('fortified')) state.lives = Math.max(state.lives, 30);
  if (hasMut('glassCannon')) state.lives = 1;   // overrides fortified if both rolled — glass cannon is the extreme option
  if (hasMut('discount')) {
    const types = TOWER_ORDER;
    state.specialistType = types[Math.floor(Math.random() * types.length)];
  }
}

// Color palette per boon — mirrors the boon's theme so choices read at a glance.
const BOON_COLORS = {
  freeTower:    '#9fc0ff',  // structure / new tower
  rangeAll:     '#86bfa3',  // sight / green grow
  doubleGold:   '#ffd866',  // wealth gold
  heal:         '#7ee69b',  // life green
  twoLevels:    '#c190ff',  // promotion purple
  dmgAll:       '#ff8c3a',  // combat orange
  barrage:      '#ff8c3a',  // combat
  bigGold:      '#ffd866',  // wealth
  fireRateAll:  '#ff8c3a',  // combat
  chillWorld:   '#5ad6ff',  // cold cyan
  scouts:       '#7ab3cc',  // info blue
  reroll:       '#c190ff'   // arcane
};

// Cost to build a tower of `type` right now, mirroring buildTower(). Used by
// boon previews so the "Save: $X" math accounts for current mutators/specialist.
function buildCostFor(type) {
  const def = TOWER_DEFS[type];
  let c = def.cost;
  if (hasMut('conscription'))  c *= 0.7;
  if (hasMut('temperedSteel')) c *= 1.4;
  if (state.specialistType === type) c *= 0.5;
  if (state.curseCostMul && state.curseCostMul !== 1) c *= state.curseCostMul;
  if ((state.firstTowerFreeCount && state.firstTowerFreeCount > 0) || state.firstTowerFree) c = 0;
  return Math.round(c);
}

// Sum of the next `n` upgrade costs assuming we keep upgrading the same tower.
// Mirrors upgradeCost() but looks ahead. Used by the Field Promotion preview.
function nextNUpgradeCosts(tower, n) {
  if (!tower || n <= 0) return 0;
  const def = TOWER_DEFS[tower.type];
  let total = 0;
  for (let i = 0; i < n; i++) {
    const lvl = tower.level + i;  // cost FROM lvl TO lvl+1
    let c = def.cost * UPGRADE_COST_MULT * Math.pow(UPGRADE_SCALE, lvl - 1);
    if (hasMut('conscription'))  c *= 0.7;
    if (hasMut('temperedSteel')) c *= 1.4;
    if (state.specialistType === tower.type) c *= 0.5;
    total += Math.max(1, Math.round(c));
  }
  return total;
}

// Returns a tiny live-math line shown beneath the boon description. Only
// emitted for boons where the player can't easily eyeball the answer
// themselves (free-tower savings, life-cap interaction, exact gold dump,
// no-op edge cases, dependence on existing towers, etc.). Boons that
// just say "+X% damage" / "+X% fire rate" / "+2 levels" / "+10% range"
// are obvious enough to skip — adding math under those was clutter.
function previewBoon(id) {
  const lifeCap = hasMut('fortified') ? 50 : 40;
  switch (id) {
    case 'freeTower': {
      // Description is self-explanatory — only show the First Swing edge case.
      if (state.firstTowerFree || (state.firstTowerFreeCount && state.firstTowerFreeCount > 0)) return `<i>Next tower is already free (First Swing).</i>`;
      return '';
    }
    case 'heal': {
      // The life cap is the gotcha — at full or near-full lives a heal can
      // be worth less than 5.
      const before = state.lives, after = Math.min(state.lives + 5, lifeCap);
      const gained = after - before;
      if (gained < 5) return `<i>Lives: ${before} → ${after} (capped at ${lifeCap})</i>`;
      return '';
    }
    case 'bigGold': {
      // Exact instant payout depends on wave — worth showing.
      const amt = 150 + state.wave * 25;
      return `<i>+$${fmtMoney(amt)} instantly</i>`;
    }
    case 'twoLevels': {
      // Edge case: no towers built → boon does nothing.
      if (!state.towers.length) return `<i>Need a tower first.</i>`;
      return '';
    }
    case 'scouts': {
      // Already-have edge case — otherwise the description is self-explanatory.
      if (state.scoutsUnlocked) return `<i>Already unlocked — no extra benefit.</i>`;
      return '';
    }
    case 'reroll': {
      // Two no-op edge cases worth flagging.
      const active = state.activeMutators.length;
      const pool = Object.keys(MUTATOR_POOL).filter(k => (MUTATOR_POOL[k].startUnlocked || isInPool('mutators', k)) && !state.activeMutators.includes(k));
